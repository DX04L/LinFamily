<title>Daily QT · 每日靈修</title>

<link id="touch-icon" rel="apple-touch-icon" sizes="180x180" href="icons/grownup-touch.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap">
<style>
@font-face{
  font-family:"BpmfGenSenRounded";
  src:url("../fonts/BpmfGenSenRounded-R.ttf") format("truetype");
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:"BpmfGenSenRounded";
  src:url("../fonts/BpmfGenSenRounded-M.ttf") format("truetype");
  font-weight:600 700;
  font-display:swap;
}
:root{
  --bg:#f9f7f2;--ink:#2c2c2a;--muted:#5b7065;--accent:#9a5737;--line:#ded9cb;--surface:#fffdf7d9;
  --panel:#f1eee3;--button:#30483c;--on-button:#fffdf4;--annotation:#87684e;--radius:14px;
  --shadow:0 10px 34px #3c38260a;--heading:"Noto Serif TC",serif;--body:"Noto Sans TC",sans-serif;
}
[data-theme="kids-cute"]{
  --bg:#fff5f7;--ink:#52394d;--muted:#72516a;--accent:#a43c66;--line:#f0d8e5;--surface:#fffafde8;
  --panel:#fff0f6;--button:#ff7597;--on-button:#421b32;--annotation:#885776;--radius:26px;
  --shadow:0 10px 32px #a8457613;--heading:"Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);transition:background-color .25s,color .25s}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
a{color:var(--accent)}

/* 左右滿版配置（保留舒適邊距） */
.shell{width:100%;padding-inline:clamp(16px,3.2vw,48px)}

header{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.bar,.brand,.date-nav,.modes{display:flex;align-items:center}
.bar{min-height:62px;justify-content:space-between;gap:12px}
.brand{gap:10px;font-family:var(--heading);font-weight:700;text-decoration:none;color:var(--ink)}
.brand img{width:32px;height:32px;border-radius:8px}
.brand span{font-size:14px}
.modes{padding:3px;gap:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.modes button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 15px;font-size:13px;font-weight:700}
.modes [aria-pressed="true"]{color:var(--on-button);background:var(--button)}

/* 精簡版 Hero Banner */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:18px 0 16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.hero-copy{min-width:0;flex:1}
.date-nav{gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.date-nav button{
  width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.date-nav button svg{width:14px;height:14px;display:block}
.title-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 16px;margin-top:10px}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;margin:0}
h1,h2,h3{font-family:var(--heading);line-height:1.35;margin:0}
h1{font-size:clamp(26px,3.6vw,40px);letter-spacing:.02em;font-weight:700}
h2{font-size:clamp(20px,2.5vw,26px)}
h3{font-size:18px}
.lead{font-family:var(--body);font-size:clamp(14px,1.6vw,17px);font-weight:600;color:var(--muted);margin:0}

/* 右側精緻徽章化插畫 */
.art{flex-shrink:0;width:clamp(120px,16vw,175px)}
.art svg{display:block;width:100%;height:auto;max-height:125px}
.kids-art,[data-theme="kids-cute"] .adult-art{display:none}
[data-theme="kids-cute"] .kids-art{display:block}

/* 滿版內容區 */
.content{display:grid;gap:20px;margin:0 0 36px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(12px);padding:clamp(18px,3vw,32px)}
.card .eyebrow{margin-bottom:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* 經文排版 */
.verses{font:clamp(17px,2.2vw,21px)/1.9 var(--heading);list-style:none;padding:0;margin:6px 0 0}
.verses li{display:grid;grid-template-columns:2.4ch 1fr;gap:12px;margin:0 0 14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.verses li:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.verses small{color:var(--accent);font:700 13px/2.5 var(--body)}
.verse-pair{display:flex;flex-direction:column;gap:5px}
.eng-verse{font-family:var(--body);font-size:clamp(14px,1.7vw,16.5px);line-height:1.62;color:var(--muted);font-weight:400}
.eng-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:6px;background:var(--panel);color:var(--accent);margin-right:6px;vertical-align:middle}

p{line-height:1.85;white-space:pre-line}
details{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);margin-top:16px}
summary{cursor:pointer;font-weight:600;width:fit-content;font-size:14px}
details[open] .context{animation:appear .25s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.point{padding:18px 0;border-bottom:1px solid var(--line)}
.point:last-child{border-bottom:0;padding-bottom:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.action{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;font-weight:700;text-decoration:none}
button:hover,.action:hover{filter:brightness(.95)}
[data-theme="kids-cute"] button:active{transform:scale(.94)}
.story{background:linear-gradient(145deg,#fffbeb,#f3e8ff)}
.prayer{padding:16px 18px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);margin-top:16px}

/* 源泉圓體注音版（比大人版稍大一點點） */
.zhuyin{
  font-family:"BpmfGenSenRounded","Noto Sans TC",sans-serif;
  font-size:clamp(19px,2.5vw,23px);
  line-height:1.75;
  letter-spacing:.03em;
}
.kids-verses{list-style:none;padding:0;margin:6px 0 0}
.kids-verses li{display:grid;grid-template-columns:2.4ch 1fr;gap:12px;margin:0 0 16px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.kids-verses li:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.kids-verses small{color:var(--accent);font:700 13px/2.5 var(--body)}

#warning-banner{margin:0 0 36px;padding:13px 18px;border-radius:var(--radius);background:#fffbeb;border:1px solid #f59e0b;color:#92400e;font-weight:700;font-size:14px;line-height:1.6}
#status{margin:0 0 40px}
#toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:1;width:max-content;max-width:calc(100% - 32px);padding:13px 20px;background:var(--button);color:var(--on-button);border-radius:var(--radius);box-shadow:var(--shadow)}
dialog{width:min(490px,calc(100% - 32px));border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);padding:24px}
dialog::backdrop{background:#241a2559}
textarea{width:100%;min-height:110px;font:inherit;margin:12px 0}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:13px}

@media(max-width:670px){
  .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:14px 0 12px;gap:12px}
  .hero-copy{display:contents}
  .date-nav{grid-column:1 / -1;flex-wrap:wrap}
  .date-nav time,.date-nav .eyebrow{white-space:nowrap}
  .title-row{margin-top:0}
  .art{width:96px}
  .art svg{max-height:92px}
  .split{grid-template-columns:1fr}
  .bar{min-height:56px;gap:8px}
  .modes button{padding:5px 11px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

    .replace(/阿們/g, '阿\u{E01E1}們')
    .replace(/什麼/g, '什\u{E01E1}麼')
    .replace(/為甚麼/g, '為什\u{E01E1}麼');
  return escapeText(plain);
}

function render(data) {
  const bible = data.scripture;
  const adult = data.adult_content;
  const kids = data.kids_content;

  $('adult').innerHTML = `
    <section class="card">
      <p class="eyebrow">今日經文 · 和合本 &amp; NIV</p>
      <ol class="verses">${bible.verses.map(v => `
        <li>
          <small>${escapeText(v.verse)}</small>
          <div class="verse-pair">
            <span>${escapeText(v.text)}</span>
            ${v.niv ? `<span class="eng-verse"><span class="eng-tag">NIV</span>${escapeText(v.niv)}</span>` : ''}
          </div>
        </li>`).join('')}
      </ol>
      <details><summary>查看前後文背景經文</summary><div class="context">
        <p><strong>前文</strong> ${escapeText(bible.context_before || '無前文資料')}</p>
        <p><strong>後文</strong> ${escapeText(bible.context_after || '無後文資料')}</p>
      </div></details>
    </section>
    <div class="split">
      <section class="card"><h3>全書背景</h3><p>${escapeText(adult.book_background)}</p></section>
      <section class="card"><h3>當日文化背景與上下文處境</h3><p>${escapeText(adult.daily_context)}</p></section>
    </div>
    ${adult.key_exegesis ? `<section class="card"><h3>重要解經</h3><p>${escapeText(adult.key_exegesis)}</p></section>` : ''}
    <section class="card"><h2>重要神學議題</h2>
      ${adult.theology_points.map((point,i) => `<div class="point"><h3>${escapeText(point.title)}</h3><p>${escapeText(point.summary)}</p>
        <div class="actions"><button class="action" data-point="${i}" data-ai="chatgpt">與 ChatGPT 深入探討 ↗</button>
        <button class="action" data-point="${i}" data-ai="claude">Claude ↗</button></div></div>`).join('')}
    </section>`;

  const hasKidsVerses = bible.verses && bible.verses.some(v => v.ruby || v.text);
  $('kids').innerHTML = `
    ${hasKidsVerses ? `
    <section class="card">
      <p class="eyebrow">今日經文 · 注音 &amp; NIrV</p>
        <ol class="kids-verses">${bible.verses.map(v => `
          <li>
            <small>${escapeText(v.verse)}</small>
            <div class="verse-pair">
              <span class="zhuyin">${rubyMarkup(v.ruby || v.text)}</span>
              ${v.nirv ? `<span class="eng-verse"><span class="eng-tag">NIrV</span>${escapeText(v.nirv)}</span>` : ''}
            </div>
          </li>`).join('')}
        </ol>
    </section>` : ''}
    ${(kids.bible_story_ruby || kids.prayer_ruby) ? `
    <section class="card story">
      ${kids.bible_story_ruby ? `
        <p class="eyebrow">用聖經說故事</p>
        <h2 class="zhuyin">${rubyMarkup(kids.bible_story_title_ruby || kids.bible_story_title)}</h2>
        <p class="zhuyin">${rubyMarkup(kids.bible_story_ruby)}</p>
      ` : ''}
      ${kids.prayer_ruby ? `<div class="prayer"><h3>♡ 今日小禱告</h3><p class="zhuyin">${rubyMarkup(kids.prayer_ruby)}</p></div>` : ''}
    </section>` : ''}`;
}

function setTheme(value) {
  mode = value;
  root.dataset.theme = mode;
  const isKids = mode === 'kids-cute';
  const icon = isKids ? 'kids' : 'grownup';
  const iconSvg = `icons/${icon}.svg`;
  $('favicon').href = iconSvg;
  if (location.protocol === 'file:') {
    const inlineIcon = 'data:image/svg+xml,' + encodeURIComponent(iconFallbacks[icon]);
    $('favicon').href = inlineIcon;
    $('brand-icon').src = inlineIcon;
  } else {
    $('brand-icon').src = iconSvg;
  }
  $('touch-icon').href = `icons/${icon}-touch.png`;
  document.querySelector('meta[name=theme-color]').content = isKids ? '#fff5f7' : '#f9f7f2';
  document.querySelectorAll('[data-mode]').forEach(button => {
    button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
  });
  try { localStorage.setItem('qt-mode', mode); } catch {}
  updateView();
}

function updateView() {
  const isKids = mode === 'kids-cute';
  $('adult').hidden = !current || isKids;
  $('kids').hidden = !current || !isKids;
  $('warning-banner').hidden = isKids || !current?.mismatch_warning;
  $('warning-banner').textContent = current?.mismatch_warning || '';
  $('hero-label').textContent = '· 每日靈修';
  $('hero-title').textContent = !current ? '每日靈修' : current.scripture.reference;
  if (isKids && current?.kids_content?.bible_story_title_ruby) {
    $('hero-title').innerHTML = rubyMarkup(current.kids_content.bible_story_title_ruby);
  }
  $('hero-lead').hidden = !current;
  $('hero-lead').textContent = !current ? '' : (current.scripture.eng_reference || current.scripture.verses[0]?.text || '');
  $('source').textContent = current?.source_channel ? ' · ' + current.source_channel : '';
}

function taipeiDate() {
  const parts = new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Taipei',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts();
  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}

function showStatus(message) {
  $('status').hidden = !message;
  $('status').textContent = message;
}

async function readDevotional(date) {
  if (!firestore) {
    firestore = Promise.all([
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js')
    ]).then(([app, db]) => ({...db, instance:db.getFirestore(app.initializeApp(firebaseConfig))}))
      .catch(error => {
        firestore = null;
        throw error;
      });
  }
  const {doc, getDoc, instance} = await firestore;
  const snapshot = await getDoc(doc(instance, collectionName, date));
  return snapshot.exists() ? snapshot.data() : null;
}

async function selectDate(date) {
  const id = ++request;
  $('date').dateTime = date;
  $('date').textContent = new Intl.DateTimeFormat('zh-TW', {
    timeZone:'UTC', year:'numeric', month:'long', day:'numeric', weekday:'short'
  }).format(new Date(date + 'T00:00:00Z'));
  current = null;
  updateView();
  showStatus('正在讀取靈修內容…');
  try {
    const data = await readDevotional(date);
    if (id !== request) return;
    if (data) render(data);
    current = data;
    updateView();
    showStatus(data ? '' : '這天沒有靈修資料。');
  } catch {
    if (id !== request) return;
    current = null;
    updateView();
    showStatus('暫時無法讀取靈修資料，請稍後再試。');
  }
}

function shiftDate(days) {
  const date = new Date($('date').dateTime + 'T00:00:00Z');
  date.setUTCDate(date.getUTCDate() + days);
  selectDate(date.toISOString().slice(0,10));
}

async function copyPrompt(prompt) {
  try {
    await navigator.clipboard.writeText(prompt);
    return true;
  } catch {
    const input = document.createElement('textarea');
    input.value = prompt;
    input.style.position = 'fixed';
    input.style.opacity = '0';
    const focused = document.activeElement;
    document.body.append(input);
    input.select();
    try { return document.execCommand('copy'); }
    catch { return false; }
    finally {
      input.remove();
      focused?.focus();
    }
  }
}

async function openDiscussion(prompt, url) {
  const tab = window.open('about:blank', '_blank');
  if (tab) tab.opener = null;
  const copied = await copyPrompt(prompt);
  if (!copied || !tab) {
    tab?.close();
    $('prompt-text').value = prompt;
    $('manual-ai').href = url;
    $('manual-copy').showModal();
    $('prompt-text').select();
    return;
  }
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.textContent = '已為您複製神學提問！正在前往 AI 對話視窗…';
  toast.hidden = false;
  setTimeout(() => { if (!tab.closed) tab.location.replace(url); }, 800);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 2500);
}

document.querySelectorAll('[data-mode]').forEach(button => {
  button.addEventListener('click', () => setTheme(button.dataset.mode));
});
$('adult').addEventListener('click', event => {
  const button = event.target.closest('[data-point]');
  if (!button || !current) return;
  const prompt = current.adult_content.theology_points[button.dataset.point]?.deep_dive_prompt;
  if (typeof prompt !== 'string' || !prompt.trim()) return;
  openDiscussion(prompt, button.dataset.ai === 'claude' ? 'https://claude.ai/' : 'https://chatgpt.com/');
});
$('previous').addEventListener('click', () => shiftDate(-1));
$('next').addEventListener('click', () => shiftDate(1));
$('home').addEventListener('click', event => {
  event.preventDefault();
  selectDate(taipeiDate());
});
try { if (localStorage.getItem('qt-mode') === 'kids-cute') mode = 'kids-cute'; } catch {}
setTheme(mode);
selectDate(taipeiDate());
</script>
