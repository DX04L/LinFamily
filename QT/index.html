<!doctype html>
<html lang="zh-Hant-TW" data-theme="literary">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f9f7f2">
<title>Daily QT · 每日靈修</title>
<link id="favicon" rel="icon" type="image/svg+xml" href="icons/grownup.svg">
<link id="touch-icon" rel="apple-touch-icon" sizes="180x180" href="icons/grownup-touch.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Serif+TC:wght@400;500;600;700&display=swap">
<style>
@font-face{
  font-family:"BpmfGenSenRounded";
  src:url("../fonts/BpmfGenSenRounded-R.ttf") format("truetype");
  font-weight:400;
  font-display:swap;
}
@font-face{
  font-family:"BpmfGenSenRounded";
  src:url("../fonts/BpmfGenSenRounded-M.ttf") format("truetype");
  font-weight:600 700;
  font-display:swap;
}
:root{
  --bg:#f9f7f2;--ink:#2c2c2a;--muted:#5b7065;--accent:#9a5737;--line:#ded9cb;--surface:#fffdf7d9;
  --panel:#f1eee3;--button:#30483c;--on-button:#fffdf4;--annotation:#87684e;--radius:14px;
  --shadow:0 10px 34px #3c38260a;--heading:"Noto Serif TC",serif;--body:"Noto Sans TC",sans-serif;
}
[data-theme="kids-cute"]{
  --bg:#fff5f7;--ink:#52394d;--muted:#72516a;--accent:#a43c66;--line:#f0d8e5;--surface:#fffafde8;
  --panel:#fff0f6;--button:#ff7597;--on-button:#421b32;--annotation:#885776;--radius:26px;
  --shadow:0 10px 32px #a8457613;--heading:"Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);transition:background-color .25s,color .25s}
button,a{font:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
a{color:var(--accent)}

/* 左右滿版配置（保留舒適邊距） */
.shell{width:100%;padding-inline:clamp(16px,3.2vw,48px)}

header{border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px)}
.bar,.brand,.date-nav,.modes{display:flex;align-items:center}
.bar{min-height:62px;justify-content:space-between;gap:12px}
.brand{gap:10px;font-family:var(--heading);font-weight:700;text-decoration:none;color:var(--ink)}
.brand img{width:32px;height:32px;border-radius:8px}
.brand span{font-size:14px}
.modes{padding:3px;gap:4px;border:1px solid var(--line);border-radius:999px;background:var(--panel)}
.modes button{border:0;background:transparent;color:var(--muted);border-radius:999px;padding:6px 15px;font-size:13px;font-weight:700}
.modes [aria-pressed="true"]{color:var(--on-button);background:var(--button)}

/* 精簡版 Hero Banner */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px 20px;padding:18px 0 16px;border-bottom:1px solid var(--line);margin-bottom:20px}
.date-nav{grid-column:1 / -1;gap:8px;color:var(--muted);font-size:13px;font-weight:600}
.date-nav button{
  width:30px;height:30px;padding:0;border-radius:50%;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
}
.date-nav button svg{width:14px;height:14px;display:block}
.title-row{display:flex;align-items:baseline;flex-wrap:wrap;gap:8px 16px}
.eyebrow{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.14em;margin:0}
h1,h2,h3{font-family:var(--heading);line-height:1.35;margin:0}
h1{font-size:clamp(26px,3.6vw,40px);letter-spacing:.02em;font-weight:700}
h2{font-size:clamp(20px,2.5vw,26px)}
h3{font-size:18px}
.lead{font-family:var(--body);font-size:clamp(14px,1.6vw,17px);font-weight:600;color:var(--muted);margin:0}

[data-theme="kids-cute"] #hero-lead{font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif}

/* 右側精緻徽章化插畫 */
.art{flex-shrink:0;width:clamp(120px,16vw,175px)}
.art svg{display:block;width:100%;height:auto;max-height:125px}
.kids-art,[data-theme="kids-cute"] .grown-up-art{display:none}
[data-theme="kids-cute"] .kids-art{display:block}

/* 滿版內容區 */
.content{display:grid;gap:20px;margin:0 0 36px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(12px);padding:clamp(18px,3vw,32px)}
.card .eyebrow{margin-bottom:8px}
.split{display:grid;grid-template-columns:1fr 1fr;gap:20px}

/* 經文排版 */
.verses{font:calc(clamp(18px,2.2vw + 1px,22px) * var(--qt-size,1))/calc(1.68 * var(--qt-leading,1)) var(--heading);list-style:none;padding:0;margin:6px 0 0}
.verses li{margin:0 0 14px;padding-bottom:14px;border-bottom:1px dashed var(--line)}
.verses li > span:first-of-type,.context p{color:#222220}
.kids-verses .zhuyin{color:#463044}
.verses li:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.verses small{color:var(--accent);font:700 13px/2.5 var(--body)}
.eng-verse{display:block;margin-top:5px}
.verses small,.kids-verses small{margin-inline-end:.6em;white-space:nowrap}
.eng-verse{font-family:var(--body);font-size:clamp(14px,1.7vw,16.5px);line-height:1.62;color:var(--muted);font-weight:400}
.eng-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;padding:1px 6px;border-radius:6px;background:var(--panel);color:var(--accent);margin-right:6px;vertical-align:middle}

p{line-height:1.85;white-space:pre-line}
#grown-up p:not(.eyebrow){font-size:calc(17px * var(--qt-size,1));line-height:calc(1.68 * var(--qt-leading,1))}
.qt-ai-paragraph{display:block}
.qt-ai-paragraph + .qt-ai-paragraph{margin-block-start:.65em}
.qt-mode-swipe{touch-action:pan-y pinch-zoom}
details{border-top:1px solid var(--line);padding-top:14px;color:var(--muted);margin-top:16px}
summary{cursor:pointer;font-weight:600;width:fit-content;font-size:14px}
details[open] .context{animation:appear .25s ease-out}
@keyframes appear{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:translateY(0)}}
.point{padding:18px 0;border-bottom:1px solid var(--line)}
.point:last-child{border-bottom:0;padding-bottom:0}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.action{display:inline-block;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font-size:14px;font-weight:700;text-decoration:none}
button:hover,.action:hover{filter:brightness(.95)}
[data-theme="kids-cute"] button:active{transform:scale(.94)}
.story{background:linear-gradient(145deg,#fffbeb,#f3e8ff)}
.prayer{padding:16px 18px;border-radius:var(--radius);background:var(--panel);border:1px solid var(--line);margin-top:16px}

/* 源泉圓體注音版（比大人版稍大一點點） */
.zhuyin{
  font-family:"BpmfGenSenRounded","Noto Sans TC",sans-serif;
  font-size:calc(clamp(19px,2.5vw,23px) * var(--qt-size,1));
  line-height:calc(1.58 * var(--qt-leading,1));
  letter-spacing:.03em;
}
.kids-verses{list-style:none;padding:0;margin:6px 0 0}
.kids-verses li{margin:0 0 16px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
.kids-verses li:last-child{border-bottom:0;padding-bottom:0;margin-bottom:0}
.kids-verses small{color:var(--accent);font:700 13px/2.5 var(--body)}

#warning-banner{margin:0 0 36px;padding:13px 18px;border-radius:var(--radius);background:#fffbeb;border:1px solid #f59e0b;color:#92400e;font-weight:700;font-size:14px;line-height:1.6}
#status{margin:0 0 40px}
#toast{position:fixed;bottom:max(20px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:1;width:max-content;max-width:calc(100% - 32px);padding:13px 20px;background:var(--button);color:var(--on-button);border-radius:var(--radius);box-shadow:var(--shadow)}
dialog{width:min(490px,calc(100% - 32px));border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);color:var(--ink);padding:24px}
dialog::backdrop{background:#241a2559}
textarea{width:100%;min-height:110px;font:inherit;margin:12px 0}
footer{border-top:1px solid var(--line);padding:18px 0;color:var(--muted);font-size:13px}

@media(max-width:670px){
  .hero{display:grid;grid-template-columns:minmax(0,1fr) auto;padding:14px 0 12px;gap:12px}
  .date-nav time,.date-nav .eyebrow{white-space:nowrap}
  .title-row h1,.story h2{text-wrap:balance}
  .art{width:96px}
  .art svg{max-height:92px}
  .split{grid-template-columns:1fr}
  .bar{min-height:56px;gap:8px}
  .modes button{padding:5px 11px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.date-nav #meditation-open{
  margin-inline-start:auto;width:auto;height:30px;padding:0 10px;border-radius:8px;
  background:var(--panel);color:var(--accent);white-space:nowrap
}
#meditation{
  position:fixed;inset:0;margin:0;width:100%;height:100%;max-width:none;max-height:none;
  border:0;border-radius:0;padding:0;background:#1b2421;color:#fff;
  color-scheme:dark;overscroll-behavior:contain
}
#meditation::backdrop{background:#1b2421}
html:has(#meditation[open]){overflow:hidden}
.meditation-page{width:min(100%,42rem);margin-inline:auto;padding:clamp(28px,8vw,72px) clamp(20px,5vw,42px)}
.meditation-heading{display:flex;align-items:center;justify-content:space-between;gap:16px}
.meditation-heading h2{font-family:"Noto Serif TC",serif}
.meditation-heading img{flex:none;border-radius:9px}
#meditation-verses{margin:24px 0 32px;font:calc(clamp(23px,3vw + 4px,27px) * var(--qt-size,1))/calc(1.8 * var(--qt-leading,1)) "Noto Serif TC",serif;color:#fff;display:grid;gap:6px}
.meditation-verse{margin:0;line-height:inherit;white-space:normal;cursor:pointer;padding:10px 14px 10px 16px;border-radius:10px;border-left:3px solid transparent;transition:opacity .25s ease,color .22s ease,background-color .22s ease,border-color .22s ease;user-select:none;-webkit-user-select:none}
.meditation-verse:hover{background:rgba(255,255,255,.04)}
#meditation-verses.has-focus .meditation-verse:not(.is-focused){opacity:.35}
#meditation-verses.has-focus .meditation-verse.is-focused{opacity:1;color:#F0B95B;border-left-color:#F0B95B;background:rgba(240,185,91,.10)}
#reading-settings{position:relative;border:0;padding:0;margin:0;color:var(--ink)}
#reading-settings summary{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:var(--panel);list-style:none}
#reading-settings summary::-webkit-details-marker{display:none}
.reading-options{position:absolute;inset-inline-end:0;top:calc(100% + 8px);width:min(16rem,calc(100vw - 32px));padding:14px;display:grid;gap:12px;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);box-shadow:var(--shadow)}
.reading-options label{display:grid;grid-template-columns:1fr auto;gap:4px;font-size:14px;font-weight:600}
.reading-options input{grid-column:1/-1;width:100%;margin:0;accent-color:var(--button)}
.reading-options output{color:var(--muted);font-variant-numeric:tabular-nums}
.reading-options-actions{display:flex;align-items:center;justify-content:space-between;gap:8px}
#reading-settings #export-word,#reading-reset{width:auto;height:auto;min-height:32px;padding:4px 9px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font-size:13px;font-weight:700}
#meditation[data-zhuyin] #meditation-verses{font-family:"BpmfGenSenRounded","Noto Sans TC",sans-serif}
#grown-up h2{font-size:calc(clamp(20px,2.5vw,26px) * var(--qt-size,1))}
#grown-up h3,#kids h3{font-size:calc(18px * var(--qt-size,1))}
#grown-up :is(h2,h3),#kids h3{line-height:calc(1.35 * var(--qt-leading,1))}
#meditation-verses sup{font:600 .55em/0 var(--body);color:inherit;margin-inline-end:.45em}
#meditation[data-zhuyin] #meditation-verses sup{font-family:"Noto Sans TC",sans-serif}
#meditation form{text-align:center}
#meditation form button{
  padding:8px 14px;border:1px solid #627169;border-radius:8px;background:transparent;color:#c3cdc6;font-size:14px
}
#meditation form button:focus-visible{outline-color:#c3cdc6}

function escapeText(value) {
  return String(value ?? '').replace(/[&<>"']/g, char => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[char]);
}

function rubyMarkup(value) {
  // 剝除舊資料裡的 <ruby> 標籤與殘留的 \uE01E 錯誤碼，並套用正確的 Unicode IVS 大括號變體碼
  const plain = String(value ?? '')
    .replace(/<ruby>([^<>]+)<rt>[^<>]*<\/rt><\/ruby>/g, '$1')
    .replace(/\uE01E[12]?/g, '')
    .replace(/耶和華/g, '耶和\u{E01E2}華')
    .replace(/阿們/g, '阿\u{E01E1}們')
    .replace(/什麼/g, '什\u{E01E1}麼')
    .replace(/為甚麼/g, '為什\u{E01E1}麼');
  return escapeText(plain);
}

function formatAiText(value, annotate = false) {
  const escaped = (annotate ? rubyMarkup : escapeText)(value);
  if (/\n[\t ]*\n/.test(escaped)) return escaped;

  // Preserve text offsets so saved annotations still match older entries.
  const sentences = escaped.match(/[^。！？]+[。！？]+[」』”’）)]*|[^。！？]+$|[。！？]+/g) || [];
  if (sentences.join('') !== escaped || sentences.length < 2) return escaped;
  const paragraphs = [];
  let pending = '';
  for (const sentence of sentences) {
    pending += sentence;
    if (pending.trim().length >= 45) {
      paragraphs.push(pending);
      pending = '';
    }
  }
  if (pending.trim().length < 22 && paragraphs.length) paragraphs[paragraphs.length - 1] += pending;
  else if (pending) paragraphs.push(pending);
  return paragraphs.map(text => `<span class="qt-ai-paragraph">${text}</span>`).join('');
}

async function readRecent(serverOnly = false) {
  const {collection, query, orderBy, limit, getDocs, getDocsFromServer, instance} = await getDatabase();
  const snapshot = await (serverOnly ? getDocsFromServer : getDocs)(query(collection(instance, collectionName), orderBy('date', 'desc'), limit(7)));
  return snapshot.docs.filter(doc => /^\d{4}-\d{2}-\d{2}$/.test(doc.id))
    .map(doc => {
      const data = doc.data();
      return {...data, date: doc.id, grownUpContent: data['grown-up_content'] ?? data.adult_content};
    });
}

const bookShortNames = {"創世記":"創","出埃及記":"出","利未記":"利","民數記":"民","申命記":"申","約書亞記":"書","士師記":"士","路得記":"得","撒母耳記上":"撒上","撒母耳記下":"撒下","列王紀上":"王上","列王紀下":"王下","歷代志上":"代上","歷代志下":"代下","以斯拉記":"拉","尼希米記":"尼","以斯帖記":"斯","約伯記":"伯","詩篇":"詩","箴言":"箴","傳道書":"傳","雅歌":"歌","以賽亞書":"賽","耶利米書":"耶","耶利米哀歌":"哀","以西結書":"結","但以理書":"但","何西阿書":"何","約珥書":"珥","阿摩司書":"摩","俄巴底亞書":"俄","約拿書":"拿","彌迦書":"彌","那鴻書":"鴻","哈巴谷書":"哈","西番雅書":"番","哈該書":"該","撒迦利亞書":"亞","瑪拉基書":"瑪","馬太福音":"太","馬可福音":"可","路加福音":"路","約翰福音":"約","使徒行傳":"徒","羅馬書":"羅","哥林多前書":"林前","哥林多後書":"林後","加拉太書":"加","以弗所書":"弗","腓立比書":"腓","歌羅西書":"西","帖撒羅尼迦前書":"帖前","帖撒羅尼迦後書":"帖後","提摩太前書":"提前","提摩太後書":"提後","提多書":"多","腓利門書":"門","希伯來書":"來","雅各書":"雅","彼得前書":"彼前","彼得後書":"彼後","約翰一書":"約一","約翰二書":"約二","約翰三書":"約三","猶大書":"猶","啟示錄":"啟"};
function updateDates() {
  const date = $('date').dateTime;
  const index = recent.findIndex(entry => entry.date === date);
  $('previous').disabled = index < 0 || index === recent.length - 1;
  $('next').disabled = index <= 0;
  $('date-list').replaceChildren(...recent.map(entry => {
    const button = document.createElement('button');
    button.type = 'button';
    const [, month, day] = entry.date.split('-');
    const reference = entry.scripture.reference.replace(/^(.+?)\s+(?=\d)/,
      (match, book) => (bookShortNames[book] || book) + ' ');
    button.textContent = `${Number(month)}/${Number(day)} ${entry.scripture.short_reference || reference}`;
    if (entry.date === date) button.setAttribute('aria-current', 'date');
    button.addEventListener('click', () => selectDate(entry.date));
    return button;
  }));
}

function renderDate(element, date) {
  element.dateTime = date;
  const day = new Date(date + 'T00:00:00Z');
  element.textContent = new Intl.DateTimeFormat('zh-TW', {
    timeZone:'UTC', year:'numeric', month:'long', day:'numeric', weekday:'short'
  }).format(day);
  element.parentElement.setAttribute('aria-label', '選擇日期，' + element.textContent);
  element.nextElementSibling.textContent =
    (day.getUTCMonth() + 1) + '/' + day.getUTCDate() + '（' + '日一二三四五六'[day.getUTCDay()] + '）';
}

function previewDate(data) {
  const preview = $('reading-sheet').cloneNode(true);
  const node = id => preview.querySelector('#' + id);
  node('date-picker').open = false;
  node('status').hidden = true;
  node('retry-panel').hidden = true;
  renderDate(node('date'), data.date);
  render(data, node);
  renderView(data, node);
  const index = recent.indexOf(data);
  node('previous').disabled = index >= recent.length - 1;
  node('next').disabled = index <= 0;
  return preview;
}

function weekStart(date) {
  const monday = new Date(date + 'T00:00:00Z');
  monday.setUTCDate(monday.getUTCDate() - (monday.getUTCDay() + 6) % 7);
  return monday.toISOString().slice(0, 10);
}

async function selectDate(date, animate = true, fallbackWithinWeek = false) {
  const next = recent.find(entry => entry.date === date);
  if (animate && current && next && current.date !== date) {
    $('date-picker').open = false;
    QTReader.turn(next, date > current.date, () => selectDate(date, false));
    return;
  }
  const id = ++request;
  const previousDate = $('date').dateTime;
  $('date-picker').open = false;
  QTReader.clear();
  if (!fallbackWithinWeek) renderDate($('date'), date);
  current = null;
  updateView();
  showStatus('正在讀取靈修內容…');
  try {
    if (!recent.length) recent = await readRecent();
    if (id !== request) return;
    todayMissing = !recent.some(entry => entry.date === taipeiDate());
    updateRetry();
    const start = fallbackWithinWeek ? weekStart(date) : date;
    const data = recent.find(entry => entry.date === date)
      || (fallbackWithinWeek ? recent.find(entry => start <= entry.date && entry.date < date) : null);
    const displayedDate = data?.date || date;
    renderDate($('date'), displayedDate);
    current = data;
    if (data) render(data);
    updateView();
    updateDates();
    if (data && previousDate && previousDate !== displayedDate) window.scrollTo(0, 0);
    showStatus(!data ? (fallbackWithinWeek ? '本週的靈修尚未更新，可從日期選單查看其他日期。' : '這天沒有靈修資料。')
      : displayedDate !== date ? '今天的靈修尚未更新，目前顯示本週最近一筆。' : '');
  } catch {
    if (id !== request) return;
    current = null;
    updateView();
    updateDates();
    showStatus('暫時無法讀取靈修資料，請稍後再試。');
  }
}

function adjacentDate(days) {
  const index = recent.findIndex(entry => entry.date === $('date').dateTime);
  return index >= 0 ? recent[index - days] : null;
}

function shiftDate(days) {
  const target = adjacentDate(days);
  if (target) selectDate(target.date);
}

async function copyPrompt(prompt) {
  try {
    await navigator.clipboard.writeText(prompt);
    return true;
  } catch {
    const input = document.createElement('textarea');
    input.value = prompt;
    input.style.position = 'fixed';
    input.style.opacity = '0';
    const focused = document.activeElement;
    document.body.append(input);
    input.select();
    try { return document.execCommand('copy'); }
    catch { return false; }
    finally {
      input.remove();
      focused?.focus();
    }
  }
}

async function openDiscussion(prompt, url) {
  const tab = window.open('about:blank', '_blank');
  if (tab) tab.opener = null;
  const copied = await copyPrompt(prompt);
  if (!copied || !tab) {
    tab?.close();
    $('prompt-text').value = prompt;
    $('manual-ai').href = url;
    $('manual-copy').showModal();
    $('prompt-text').select();
    return;
  }
  const toast = $('toast');
  clearTimeout(toastTimer);
  toast.textContent = '已為您複製神學提問！正在前往 AI 對話視窗…';
  toast.hidden = false;
  setTimeout(() => { if (!tab.closed) tab.location.replace(url); }, 800);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 2500);
}

document.querySelectorAll('[data-mode]').forEach(button => {
  button.addEventListener('click', () => setTheme(button.dataset.mode));
});
$('grown-up').addEventListener('click', event => {
  const button = event.target.closest('[data-point]');
  if (!button || !current) return;
  const prompt = current.grownUpContent.theology_points[button.dataset.point]?.deep_dive_prompt;
  if (typeof prompt !== 'string' || !prompt.trim()) return;
  openDiscussion(prompt, button.dataset.ai === 'claude' ? 'https://claude.ai/' : 'https://chatgpt.com/');
});

$('next').addEventListener('click', () => shiftDate(1));
$('home').addEventListener('click', event => {
