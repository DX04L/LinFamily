        radial-gradient(circle at 18% 22%, rgba(255, 226, 232, 0.75) 0%, transparent 45%),

        radial-gradient(circle at 50% 78%, rgba(244, 224, 235, 0.75) 0%, transparent 55%),
        radial-gradient(rgba(214, 168, 90, 0.16) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 100% 100%, 26px 26px;
      min-height: 100vh;
      overflow-x: hidden;
    }
    .font-serif-title {
      font-family: 'Playfair Display', 'Noto Sans TC', serif;
    }
    /* Sticker die-cut white border effect */
    .sticker-diecut {
      filter:
        drop-shadow(0 0 2px #ffffff)
        drop-shadow(0 0 2px #ffffff)
        drop-shadow(0 0 3px #ffffff)
        drop-shadow(0 8px 14px rgba(132, 86, 98, 0.18));
    }
    .sticker-diecut-sm {
      filter:
        drop-shadow(0 0 1.5px #ffffff)
        drop-shadow(0 0 2px #ffffff)
        drop-shadow(0 4px 8px rgba(132, 86, 98, 0.14));
    }
    /* Scalloped Rosette Badge */
    .rosette-badge {
      background: radial-gradient(circle at 30% 25%, #f3c6ce 0%, #df9aa7 62%, #cb8190 100%);
      box-shadow:
        inset 0 0 0 3px #f6e299,
        inset 0 0 0 5px rgba(255, 255, 255, 0.55),
        0 8px 18px rgba(154, 92, 108, 0.28);
    }
    /* Metallic Gold Foil Text & Border */
    .gold-foil-bg {
      background: linear-gradient(135deg, #f9e8a6 0%, #d8ab5c 45%, #f5df94 75%, #b9893c 100%);
    }
    .gold-text {
      background: linear-gradient(180deg, #fff6cc 0%, #e4b968 55%, #b08032 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* 2.5D Book Drop Animation */
    @keyframes bookDrop25D {
      0% {
        opacity: 0;
        transform: translateY(-230px) rotate(-9deg) scale(1.12);
      }
      58% {
        opacity: 1;
        transform: translateY(10px) rotate(2.5deg) scale(0.97);
      }
      76% {
        transform: translateY(-14px) rotate(-1.5deg) scale(1.02);
      }
      90% {
        transform: translateY(4px) rotate(0.6deg) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0px) rotate(0deg) scale(1);
      }
    }
    .animate-book-drop {
      animation: bookDrop25D 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes twinkleStar {
      0%, 100% { transform: scale(0.85) rotate(0deg); opacity: 0.55; }
      50% { transform: scale(1.18) rotate(12deg); opacity: 1; }
    }
    .animate-twinkle {
      animation: twinkleStar 3.4s ease-in-out infinite;
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    .animate-float {
      animation: floatSlow 4.5s ease-in-out infinite;
    }
    @keyframes burstOut {
      0% { opacity: 1; transform: translate(0, 0) scale(0.4); }
      100% { opacity: 0; transform: translate(var(--tx), var(--ty)) scale(1.25) rotate(45deg); }
    }
    .animate-burst {
      animation: burstOut 0.9s ease-out forwards;
    }
    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: #e7b5c0;
      border-radius: 999px;
    }

    // Helper: Sunday to Saturday week boundaries
    function getWeekBounds(baseDate = new Date(), offsetWeeks = 0) {
      const d = new Date(baseDate.getFullYear(), baseDate.getMonth(), baseDate.getDate());
      const dayOfWeek = d.getDay(); // 0 = Sunday, 6 = Saturday
      const sunday = new Date(d);
      sunday.setDate(d.getDate() - dayOfWeek + offsetWeeks * 7);
      sunday.setHours(0, 0, 0, 0);

      const saturday = new Date(sunday);
      saturday.setDate(sunday.getDate() + 6);
      saturday.setHours(23, 59, 59, 999);
      return { sunday, saturday };
    }

    function formatDateShort(dateObj) {
      const m = dateObj.getMonth() + 1;
      const d = dateObj.getDate();
      return `${m}/${d}`;
    }

    function calculateScholarship(bookCount) {
      if (bookCount < 2) return 0;
      return 100 + (bookCount - 2) * 50;
    }

    // Generate illustrated sample book cover DataURL
    function createSampleCoverDataUrl(titleText = 'Forest Fairytales', paletteIndex = 0) {
      const canvas = document.createElement('canvas');
      canvas.width = 400;
      canvas.height = 500;
      const ctx = canvas.getContext('2d');
      const colors = [
        ['#F9D5DF', '#E89EB2'],
        ['#E2D4F4', '#B497D6'],
        ['#D2E8FA', '#8CBCE6'],
        ['#FBF0C9', '#DFC26D']
      ][paletteIndex % 4];

      const grad = ctx.createLinearGradient(0, 0, 400, 500);
      grad.addColorStop(0, colors[0]);
      grad.addColorStop(1, colors[1]);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 400, 500);

      // Gold ornate frame
      ctx.strokeStyle = '#FFF5D6';
      ctx.lineWidth = 8;
      ctx.strokeRect(24, 24, 352, 452);
      ctx.strokeStyle = '#C99A45';
      ctx.lineWidth = 2;
      ctx.strokeRect(32, 32, 336, 436);

      // Decorative crown circle
      ctx.fillStyle = 'rgba(255,255,255,0.72)';
      ctx.beginPath();
      ctx.arc(200, 175, 76, 0, Math.PI * 2);
      ctx.fill();

      ctx.font = '64px serif';
      ctx.textAlign = 'center';
      ctx.fillText('👑', 200, 196);

      ctx.fillStyle = '#6D4C55';
      ctx.font = 'bold 28px Georgia, serif';
      const displayTitle = (titleText || 'Princess Tales').slice(0, 18);
      ctx.fillText(displayTitle, 200, 315);

      ctx.fillStyle = '#9E737E';
      ctx.font = '18px sans-serif';
      ctx.fillText('✨ Fairytale Collection ✨', 200, 360);

      return canvas.toDataURL('image/png');
    }

    function createInitialBooks() {
      const now = new Date();
      const { sunday } = getWeekBounds(now, 0);
      const day0 = new Date(sunday.getTime() + 10 * 3600 * 1000).toISOString();
      const day1 = new Date(sunday.getTime() + 34 * 3600 * 1000).toISOString();

      return [
        {
          id: 'seed-en-1',
          title: 'Forest Fairytales',
          language: 'en',
          paletteIndex: 0,

    // Scalloped Rosette Scholarship Medallion (Inspired by bottom-left sticker in reference)
    function RosetteScholarshipMedallion({ amount, bookCount, t, onClick }) {
      // Generate 16-scallop SVG flower path
      const scallops = 16;
      const cx = 80, cy = 80, rOuter = 74, rInner = 65;
      let d = '';
      for (let i = 0; i < scallops; i++) {
        const a1 = (i / scallops) * Math.PI * 2;
        const aMid = ((i + 0.5) / scallops) * Math.PI * 2;
        const a2 = ((i + 1) / scallops) * Math.PI * 2;
        const x1 = cx + Math.cos(a1) * rInner;
        const y1 = cy + Math.sin(a1) * rInner;
        const xm = cx + Math.cos(aMid) * rOuter;
        const ym = cy + Math.sin(aMid) * rOuter;
        const x2 = cx + Math.cos(a2) * rInner;
        const y2 = cy + Math.sin(a2) * rInner;
        if (i === 0) d += `M ${x1.toFixed(1)},${y1.toFixed(1)} `;
        d += `Q ${xm.toFixed(1)},${ym.toFixed(1)} ${x2.toFixed(1)},${y2.toFixed(1)} `;
      }
      d += 'Z';

      return (
        <button
          onClick={onClick}
          title={t.ruleShort}
          className="group relative cursor-pointer focus:outline-none transition-transform duration-300 hover:scale-105 active:scale-95 sticker-diecut"

                <stop offset="65%" stopColor="#E19AA8" />
                <stop offset="100%" stopColor="#C97E8E" />
              </radialGradient>
              <linearGradient id="goldRing" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stopColor="#FFF4C2" />
                <stop offset="50%" stopColor="#D6A54E" />
                <stop offset="100%" stopColor="#F5DC8E" />
              </linearGradient>
            </defs>
            <path d={d} fill="url(#rosettePink)" stroke="#FFFFFF" strokeWidth="4" />
            <circle cx="80" cy="80" r="56" fill="none" stroke="url(#goldRing)" strokeWidth="3.5" />
            <circle cx="80" cy="80" r="51" fill="none" stroke="#FFF8E7" strokeWidth="1" strokeDasharray="3 3" />

    // Photo Crop & Upload Modal
    function AddBookModal({ isOpen, onClose, onSave, t }) {
      const [rawImage, setRawImage] = useState(null);
      const [zoom, setZoom] = useState(1.1);
      const [rotation, setRotation] = useState(0);
      const [offset, setOffset] = useState({ x: 0, y: 0 });
      const [isDragging, setIsDragging] = useState(false);
      const [dragStart, setDragStart] = useState({ x: 0, y: 0 });
      const [title, setTitle] = useState('');
      const [language, setLanguage] = useState('en');
      const fileInputRef = useRef(null);
      const imgObjRef = useRef(null);

      useEffect(() => {
        if (isOpen) {
          setRawImage(null);
          setZoom(1.1);
          setRotation(0);
          setOffset({ x: 0, y: 0 });
          setTitle('');
          setLanguage('en');
        }
      }, [isOpen]);

      if (!isOpen) return null;

      const handleFileChange = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          setRawImage(ev.target.result);
          setZoom(1.1);
          setRotation(0);
          setOffset({ x: 0, y: 0 });
        };
        reader.readAsDataURL(file);
      };

      const handleUseSample = () => {
        const sample = createSampleCoverDataUrl(title || 'Princess Story', Math.floor(Math.random() * 4));
        setRawImage(sample);
        setZoom(1.0);
        setRotation(0);
        setOffset({ x: 0, y: 0 });
      };

      const handlePointerDown = (e) => {
        if (!rawImage) return;
        setIsDragging(true);
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setDragStart({ x: clientX - offset.x, y: clientY - offset.y });
      };

      const handlePointerMove = (e) => {
        if (!isDragging) return;
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        setOffset({
          x: clientX - dragStart.x,
          y: clientY - dragStart.y
        });
      };

      const handlePointerUp = () => setIsDragging(false);

      const generateCroppedCover = () => {
        if (!rawImage || !imgObjRef.current) {
          return createSampleCoverDataUrl(title || 'My Storybook', Math.floor(Math.random() * 4));
        }
        const canvas = document.createElement('canvas');
        const outW = 320;
        const outH = 400;
        canvas.width = outW;
        canvas.height = outH;
        const ctx = canvas.getContext('2d');

        ctx.fillStyle = '#FFF5F7';
        ctx.fillRect(0, 0, outW, outH);

        const img = imgObjRef.current;
        const previewW = 220;
        const scaleFactor = outW / previewW;

        ctx.save();
        ctx.translate(outW / 2 + offset.x * scaleFactor, outH / 2 + offset.y * scaleFactor);
        ctx.rotate((rotation * Math.PI) / 180);
        const baseScale = Math.max(outW / img.naturalWidth, outH / img.naturalHeight) * zoom;
        ctx.scale(baseScale, baseScale);
        ctx.drawImage(img, -img.naturalWidth / 2, -img.naturalHeight / 2);
        ctx.restore();

        return canvas.toDataURL('image/jpeg', 0.88);
      };

      const handleConfirmSave = () => {
        const finalTitle =
          title.trim() ||
          (language === 'en' ? `Fairytale Vol.${Math.floor(Math.random() * 9 + 1)}` : `童話故事集 ${Math.floor(Math.random() * 9 + 1)}`);
        const coverDataUrl = generateCroppedCover();
        onSave({
          id: 'book-' + Date.now(),
          title: finalTitle,
          language,
          paletteIndex: Math.floor(Math.random() * BOOK_PALETTES.length),
          createdAt: new Date().toISOString(),
          coverDataUrl
        });
        onClose();
      };

      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#6D4C55]/45 backdrop-blur-sm">
          <div className="relative w-full max-w-md rounded-[36px] bg-gradient-to-b from-[#FFF9FA] to-[#FDECEF] border-4 border-white shadow-2xl p-6 max-h-[92vh] overflow-y-auto">
            <h2 className="text-xl font-bold text-center text-[#784B58] mb-4">{t.modalTitle}</h2>

            {/* Step 1: Photo & Crop */}
            <div className="mb-4">
              <p className="text-sm font-bold text-[#8A5A67] mb-2">{t.step1Photo}</p>
              <div className="flex flex-wrap gap-2 mb-3">
                <button
                  type="button"
                  onClick={() => fileInputRef.current?.click()}
                  className="flex-1 py-2 px-3 rounded-full bg-[#E898AC] hover:bg-[#DC849A] text-white font-bold text-xs sm:text-sm shadow transition cursor-pointer"
                >
                  📷 {t.takePhoto}
                </button>
                <button
                  type="button"
                  onClick={handleUseSample}
                  className="py-2 px-3 rounded-full bg-[#F5E0A3] hover:bg-[#ECD082] text-[#6E5322] font-bold text-xs sm:text-sm shadow transition cursor-pointer"
                >
                  👑 {t.useSample}
                </button>
                <input
                  ref={fileInputRef}
                  type="file"
                  accept="image/*"
                  capture="environment"
                  onChange={handleFileChange}
                  className="hidden"
                />
              </div>

              {/* Interactive Crop Frame */}
              <div className="flex flex-col items-center">
                <div
                  onMouseDown={handlePointerDown}
                  onMouseMove={handlePointerMove}
                  onMouseUp={handlePointerUp}
                  onMouseLeave={handlePointerUp}
                  onTouchStart={handlePointerDown}
                  onTouchMove={handlePointerMove}
                  onTouchEnd={handlePointerUp}
                  className="relative w-[220px] h-[275px] rounded-[24px] border-4 border-[#E5BE73] bg-[#FFF2F5] overflow-hidden shadow-inner flex items-center justify-center cursor-grab active:cursor-grabbing select-none"
                >
                  {rawImage ? (
                    <img
                      ref={imgObjRef}
                      src={rawImage}
                      alt="Book Preview"
                      draggable={false}
                      style={{
                        transform: `translate(${offset.x}px, ${offset.y}px) rotate(${rotation}deg) scale(${zoom})`,
                        transformOrigin: 'center center'
                      }}
                      className="max-w-none w-full h-full object-cover pointer-events-none"
                    />
                  ) : (
                    <div className="text-center px-4 text-[#B58894]">
                      <div className="text-4xl mb-2">📖✨</div>
                      <div className="text-xs font-medium">{t.cropHint}</div>
                    </div>
                  )}
                  {/* Corner Crop Guides */}
                  <div className="absolute inset-3 border-2 border-dashed border-white/80 rounded-[16px] pointer-events-none" />
                </div>

                {rawImage && (
                  <div className="w-full mt-3 px-2 space-y-2">
                    <p className="text-[11px] text-center text-[#9A6D79]">{t.cropHint}</p>
                    <div className="flex items-center gap-3">
                      <span className="text-xs font-bold text-[#784B58] whitespace-nowrap">{t.zoomLabel}</span>
                      <input
                        type="range"
                        min="0.7"
                        max="2.6"
                        step="0.05"
                        value={zoom}
                        onChange={(e) => setZoom(parseFloat(e.target.value))}
                        className="flex-1 accent-[#DF8FA3]"
                      />
                      <button
                        type="button"
                        onClick={() => setRotation((r) => (r + 90) % 360)}
                        className="px-2.5 py-1 rounded-full bg-white border border-[#E7B5C0] text-xs font-bold text-[#784B58] shadow-sm hover:bg-[#FFF5F7] cursor-pointer"
                      >
                        ↻ {t.rotateLabel}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            </div>

            {/* Step 2: Book Title */}
            <div className="mb-4">
              <label className="block text-sm font-bold text-[#8A5A67] mb-1.5">{t.bookTitleLabel}</label>
              <input
                type="text"
                value={title}
                onChange={(e) => setTitle(e.target.value)}
                placeholder={t.bookTitlePlaceholder}
                className="w-full px-4 py-2.5 rounded-full bg-white border-2 border-[#ECC2CC] focus:border-[#D6A85A] focus:outline-none text-sm text-[#6D4C55] font-medium"
              />
            </div>

            {/* Step 3: Language Stack Choice */}
            <div className="mb-6">
              <label className="block text-sm font-bold text-[#8A5A67] mb-1.5">{t.langSelectLabel}</label>
              <div className="grid grid-cols-2 gap-2.5">
                <button
                  type="button"
                  onClick={() => setLanguage('en')}
                  className={`py-2.5 px-3 rounded-full text-xs sm:text-sm font-bold border-2 transition cursor-pointer ${
                    language === 'en'
                      ? 'bg-[#BAD8F2] border-[#759EC2] text-[#355675] shadow-sm'
                      : 'bg-white border-[#F0D3DA] text-[#9A717C]'
                  }`}
                >
                  🏰 {t.langEn}
                </button>
                <button
                  type="button"
                  onClick={() => setLanguage('zh')}
                  className={`py-2.5 px-3 rounded-full text-xs sm:text-sm font-bold border-2 transition cursor-pointer ${
                    language === 'zh'
                      ? 'bg-[#F2B8C6] border-[#B97889] text-[#6B3B48] shadow-sm'
                      : 'bg-white border-[#F0D3DA] text-[#9A717C]'
                  }`}
                >
                  🌸 {t.langZh}
                </button>
              </div>
            </div>

            {/* Action Buttons */}
            <div className="flex gap-3">
              <button
                type="button"
                onClick={onClose}
                className="w-1/3 py-3 rounded-full bg-white border-2 border-[#EBC6D0] text-[#8A5A67] font-bold text-sm hover:bg-[#FFF5F7] cursor-pointer"
              >
                {t.cancel}
              </button>
              <button
                type="button"
                onClick={handleConfirmSave}
                className="w-2/3 py-3 rounded-full gold-foil-bg border-2 border-white text-[#634115] font-extrabold text-sm shadow-lg hover:brightness-105 active:scale-95 transition cursor-pointer"
              >
                {t.saveAndDrop}
              </button>
            </div>
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      const [lang, setLang] = useState('zh');
      const [viewMode, setViewMode] = useState('week'); // 'week' (default) | 'all'
      const [weekOffset, setWeekOffset] = useState(0); // 0 = current Sun-Sat week
      const [books, setBooks] = useState(() => {
        try {
          const saved = localStorage.getItem('fairytale_castle_books_v1');
          if (saved) {
            const parsed = JSON.parse(saved);
            if (Array.isArray(parsed) && parsed.length > 0) return parsed;
          }
        } catch (e) {}
        return createInitialBooks();
      });
      const [newestBookId, setNewestBookId] = useState(null);
      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [selectedBook, setSelectedBook] = useState(null);
      const [isRuleModalOpen, setIsRuleModalOpen] = useState(false);

      useEffect(() => {
        try {
          localStorage.setItem('fairytale_castle_books_v1', JSON.stringify(books));
        } catch (e) {}
      }, [books]);

      const t = I18N[lang];
      const { sunday, saturday } = useMemo(() => getWeekBounds(new Date(), weekOffset), [weekOffset]);

      // Filter books based on viewMode ('week' vs 'all')
      const displayedBooks = useMemo(() => {
        const sorted = [...books].sort((a, b) => new Date(a.createdAt) - new Date(b.createdAt));
        if (viewMode === 'all') return sorted;
        return sorted.filter((b) => {
          const time = new Date(b.createdAt).getTime();
          return time >= sunday.getTime() && time <= saturday.getTime();
        });
      }, [books, viewMode, sunday, saturday]);

      // Always calculate weekly scholarship from the active week's books
      const activeWeekBooks = useMemo(() => {
        return books.filter((b) => {
          const time = new Date(b.createdAt).getTime();
          return time >= sunday.getTime() && time <= saturday.getTime();
        });
      }, [books, sunday, saturday]);

      const scholarshipAmount = calculateScholarship(activeWeekBooks.length);

      const enBooks = displayedBooks.filter((b) => b.language === 'en');
      const zhBooks = displayedBooks.filter((b) => b.language === 'zh');

      const handleAddBook = (newBook) => {
        // Ensure new book falls inside the currently viewed week if user navigated weeks, or today if current week
        let bookToSave = { ...newBook };
        if (weekOffset !== 0) {
          const midWeek = new Date(sunday.getTime() + 12 * 3600 * 1000);
          bookToSave.createdAt = midWeek.toISOString();
        }
        setBooks((prev) => [...prev, bookToSave]);
        setNewestBookId(bookToSave.id);
        setTimeout(() => {
          setNewestBookId((curr) => (curr === bookToSave.id ? null : curr));
        }, 2500);
      };

      const handleDeleteBook = (id) => {
        setBooks((prev) => prev.filter((b) => b.id !== id));
        setSelectedBook(null);
      };

      return (
        <div className="relative min-h-screen pb-32 overflow-hidden">
          {/* Scattered Gold Foil Stars Background */}
          <GoldStar size={26} className="fixed top-12 left-[6%] animate-twinkle" />
          <GoldStar size={18} className="fixed top-36 left-[18%] animate-twinkle" style={{ animationDelay: '0.8s' }} />
          <GoldStar size={28} className="fixed top-16 right-[8%] animate-twinkle" style={{ animationDelay: '1.3s' }} />
          <GoldStar size={20} className="fixed top-48 right-[20%] animate-twinkle" style={{ animationDelay: '2.1s' }} />
          <GoldStar size={24} className="fixed bottom-32 left-[8%] animate-twinkle" style={{ animationDelay: '1.6s' }} />
          <GoldStar size={22} className="fixed bottom-28 right-[9%] animate-twinkle" style={{ animationDelay: '0.5s' }} />

          {/* Top Floating Cloud Controls & Castle Header */}
          <header className="relative z-20 max-w-5xl mx-auto pt-3 px-4">
            {/* Top Bar: View Toggle Cloud & Bilingual Toggle Cloud */}
            <div className="flex flex-wrap items-center justify-between gap-2 mb-1">
              {/* Cloud Pill: This Week vs All-Time Tower */}
              <div className="inline-flex items-center bg-white/90 backdrop-blur-sm p-1 rounded-full border-2 border-[#F2CFD8] shadow-sm">
                <button
                  onClick={() => setViewMode('week')}
                  className={`px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold transition cursor-pointer ${
                    viewMode === 'week'
                      ? 'bg-[#E99DB0] text-white shadow-sm'
                      : 'text-[#8C5E6B] hover:text-[#6D4C55]'
                  }`}
                >
                  ☁️ {t.thisWeek} ({activeWeekBooks.length})
                </button>
                <button
                  onClick={() => setViewMode('all')}
                  className={`px-3.5 py-1.5 rounded-full text-xs sm:text-sm font-bold transition cursor-pointer ${
                    viewMode === 'all'
                      ? 'bg-[#C7AEE3] text-white shadow-sm'
                      : 'text-[#8C5E6B] hover:text-[#6D4C55]'
                  }`}
                >
                  🏰 {t.allTime} ({books.length})
                </button>
              </div>

              {/* Cloud Pill: Traditional Chinese / English Switch */}
              <button
                onClick={() => setLang((l) => (l === 'zh' ? 'en' : 'zh'))}
                className="px-4 py-1.5 rounded-full bg-white/95 border-2 border-[#E5BE73] text-xs sm:text-sm font-bold text-[#7A5526] shadow-sm hover:bg-[#FFF9EB] transition cursor-pointer"
              >
                🌐 {t.langBtn}
              </button>
            </div>

            {/* Pastel Fairytale Castle Illustration & Title */}
            <div className="text-center -mt-1">
              <CastleHeaderArt />
              <h1 className="font-serif-title text-2xl sm:text-4xl font-bold text-[#784957] tracking-wide -mt-3 drop-shadow-sm">
                {t.castleTitle}
              </h1>
              <p className="text-xs sm:text-sm text-[#9B6D7A] font-medium mt-0.5">{t.subtitle}</p>
            </div>

            {/* Floating Cloud Week Navigator (Sunday to Saturday) */}
            {viewMode === 'week' && (
              <div className="mt-3 flex flex-col items-center">
                <div className="inline-flex items-center gap-3 px-5 py-2 rounded-full bg-white/90 border-2 border-[#F3D5DD] shadow-sm">
                  <button
                    onClick={() => setWeekOffset((w) => w - 1)}
                    className="w-7 h-7 rounded-full bg-[#FCE9EE] hover:bg-[#F6D2DC] text-[#784957] font-bold flex items-center justify-center cursor-pointer"
                  >
                    ‹
                  </button>
                  <div className="text-center">
                    <div className="text-[11px] font-bold text-[#A67885]">{t.weekRangeLabel}</div>
                    <div className="text-sm sm:text-base font-extrabold text-[#784957]">
                      {formatDateShort(sunday)} ({t.dayNames[0]}) — {formatDateShort(saturday)} ({t.dayNames[6]})
                    </div>
                  </div>
                  <button
                    onClick={() => setWeekOffset((w) => Math.min(0, w + 1))}
                    disabled={weekOffset === 0}
                    className={`w-7 h-7 rounded-full font-bold flex items-center justify-center ${
                      weekOffset === 0
                        ? 'bg-gray-100 text-gray-300 cursor-not-allowed'
                        : 'bg-[#FCE9EE] hover:bg-[#F6D2DC] text-[#784957] cursor-pointer'
                    }`}
                  >
                    ›
                  </button>
                </div>

                {/* Progress Hint Pill */}
                <div className="mt-2 text-xs font-bold text-[#8E5B69] bg-[#FFF8EA]/90 px-4 py-1 rounded-full border border-[#EBD094]">
                  {activeWeekBooks.length < 2
                    ? t.goalProgress2.replace('{n}', String(2 - activeWeekBooks.length))
                    : t.goalUnlocked}
                </div>
              </div>
            )}
          </header>

          {/* Main 2.5D Book Stacks Stage (Left: English Books, Right: Chinese Books) */}
          <main className="relative z-10 max-w-5xl mx-auto px-3 sm:px-6 mt-4 sm:mt-6">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-10 md:gap-6 items-end min-h-[360px]">
              {/* LEFT STACK: English Books */}
              <section className="flex flex-col items-center justify-end">
                {/* Stack Topper (Crown & Rose) */}
                {enBooks.length > 0 && <StackTopper side="left" />}

                {/* Stacked 2.5D Books (Newest on Top) */}
                <div className="flex flex-col-reverse items-center -space-y-2">
                  {enBooks.length === 0 ? (
                    <div className="w-64 py-10 px-5 rounded-[32px] bg-white/75 border-2 border-dashed border-[#B6D0E8] text-center text-xs sm:text-sm text-[#6C8EAE] font-medium">
                      👑 {t.emptyStack}
                    </div>
                  ) : (
                    enBooks.map((book, idx) => (
                      <Book25D
                        key={book.id}
                        book={book}
                        index={idx}
                        totalCount={enBooks.length}
                        isNewest={book.id === newestBookId}
                        side="left"
                        onSelect={setSelectedBook}
                        newLabel={t.newTag}
                      />
                    ))
                  )}
                </div>

                {/* Soft Cloud Pedestal Base */}
                <div className="relative -mt-2 flex flex-col items-center">
                  <div className="w-64 sm:w-72 h-5 rounded-full bg-white/95 border-2 border-[#DCEAF7] shadow-md" />
                  <div className="mt-2 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/90 border-2 border-[#B9D6F0] shadow-sm">
                    <span className="text-sm font-extrabold text-[#496F94]">🏰 {t.enStackTitle}</span>
                    <span className="px-2 py-0.5 rounded-full bg-[#DCECF9] text-xs font-black text-[#3B5F82]">
                      {enBooks.length} {t.booksCountUnit}
                    </span>
                  </div>
                </div>
              </section>

              {/* RIGHT STACK: Chinese Books */}
              <section className="flex flex-col items-center justify-end">
                {/* Stack Topper (Mini Tower & Lantern) */}
                {zhBooks.length > 0 && <StackTopper side="right" />}

                {/* Stacked 2.5D Books (Newest on Top) */}
                <div className="flex flex-col-reverse items-center -space-y-2">
                  {zhBooks.length === 0 ? (
                    <div className="w-64 py-10 px-5 rounded-[32px] bg-white/75 border-2 border-dashed border-[#EAB8C6] text-center text-xs sm:text-sm text-[#A66B7B] font-medium">
                      🌸 {t.emptyStack}
                    </div>
                  ) : (
                    zhBooks.map((book, idx) => (
                      <Book25D
                        key={book.id}
                        book={book}
                        index={idx}
                        totalCount={zhBooks.length}
                        isNewest={book.id === newestBookId}
                        side="right"
                        onSelect={setSelectedBook}
                        newLabel={t.newTag}
                      />
                    ))
                  )}
                </div>

                {/* Soft Cloud Pedestal Base */}
                <div className="relative -mt-2 flex flex-col items-center">
                  <div className="w-64 sm:w-72 h-5 rounded-full bg-white/95 border-2 border-[#F7DCE3] shadow-md" />
                  <div className="mt-2 inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-white/90 border-2 border-[#F0B8C7] shadow-sm">
                    <span className="text-sm font-extrabold text-[#7D4756]">🌸 {t.zhStackTitle}</span>
                    <span className="px-2 py-0.5 rounded-full bg-[#FCE4EB] text-xs font-black text-[#7D4756]">
                      {zhBooks.length} {t.booksCountUnit}
                    </span>
                  </div>
                </div>
              </section>
            </div>
          </main>

          {/* Bottom-Left Scalloped Rosette Scholarship Medallion (Matching Reference Sticker) */}
          <div className="fixed bottom-3 left-3 sm:bottom-5 sm:left-6 z-30 animate-float">
            <RosetteScholarshipMedallion
              amount={scholarshipAmount}
              bookCount={activeWeekBooks.length}
              t={t}
              onClick={() => setIsRuleModalOpen(true)}
            />
          </div>

          {/* Floating Bottom-Right / Center Primary Action Button */}
          <div className="fixed bottom-5 right-4 sm:bottom-7 sm:right-8 z-30">
            <button
              onClick={() => setIsAddModalOpen(true)}
              className="group flex items-center gap-2.5 px-5 py-3.5 sm:px-6 sm:py-4 rounded-full bg-gradient-to-r from-[#EE9CB1] via-[#E5869F] to-[#D89EE0] text-white font-extrabold text-sm sm:text-base border-4 border-white shadow-xl hover:scale-105 active:scale-95 transition cursor-pointer"
            >
              <span className="text-xl sm:text-2xl group-hover:rotate-12 transition-transform">📸</span>
              <span>{t.addBookBtn}</span>
            </button>
          </div>

          {/* Add Book + Crop Modal */}
          <AddBookModal
            isOpen={isAddModalOpen}
            onClose={() => setIsAddModalOpen(false)}
            onSave={handleAddBook}
            t={t}
          />

          {/* Book Cover Memory Detail Modal */}
          {selectedBook && (
            <div
              onClick={() => setSelectedBook(null)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#6D4C55]/45 backdrop-blur-sm"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-sm rounded-[36px] bg-gradient-to-b from-[#FFF9FA] to-[#FCE9EE] border-4 border-white shadow-2xl p-6 text-center"
              >
                <div className="text-sm font-bold text-[#9A6B78] mb-2">{t.bookDetailTitle}</div>
                <div className="mx-auto w-48 h-60 rounded-[22px] border-4 border-[#E5BE73] overflow-hidden shadow-lg mb-4 bg-white">
                  <img
                    src={selectedBook.coverDataUrl}
                    alt={selectedBook.title}
                    className="w-full h-full object-cover"
                  />
                </div>
                <h3 className="font-serif-title text-xl font-bold text-[#6D4C55] mb-1">{selectedBook.title}</h3>
                <p className="text-xs font-medium text-[#9A6B78] mb-5">
                  {t.readDate}: {new Date(selectedBook.createdAt).toLocaleDateString()} ·{' '}
                  {selectedBook.language === 'en' ? 'English' : '繁體中文'}
                </p>
                <div className="flex gap-2.5">
                  <button
                    onClick={() => handleDeleteBook(selectedBook.id)}
                    className="flex-1 py-2.5 rounded-full bg-white border-2 border-[#F0C6D0] text-xs font-bold text-[#C2647C] hover:bg-[#FFF0F3] cursor-pointer"
                  >
                    🗑️ {t.deleteBook}
                  </button>
                  <button
                    onClick={() => setSelectedBook(null)}
                    className="flex-1 py-2.5 rounded-full bg-[#E898AC] text-white text-xs font-bold shadow hover:bg-[#DC849A] cursor-pointer"
                  >
                    {t.close}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Scholarship Rule Explanation Cloud Modal */}
          {isRuleModalOpen && (
            <div
              onClick={() => setIsRuleModalOpen(false)}
              className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-[#6D4C55]/45 backdrop-blur-sm"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="w-full max-w-md rounded-[36px] bg-gradient-to-b from-[#FFFDF7] to-[#FDECEF] border-4 border-white shadow-2xl p-6"
              >
                <h3 className="text-lg sm:text-xl font-extrabold text-center text-[#784957] mb-4">
                  {t.ruleModalTitle}
                </h3>
                <ul className="space-y-2.5 text-sm text-[#6D4C55] mb-6">
                  {t.ruleLines.map((line, i) => (
                    <li key={i} className="flex items-start gap-2 bg-white/80 p-3 rounded-2xl border border-[#F3D5DD]">
                      <span className="text-base">🌟</span>
                      <span className="font-medium leading-relaxed">{line}</span>
                    </li>
                  ))}
                </ul>
                <button
                  onClick={() => setIsRuleModalOpen(false)}
                  className="w-full py-3 rounded-full gold-foil-bg border-2 border-white text-[#634115] font-extrabold text-sm shadow-md cursor-pointer"
                >
                  {t.close}
                </button>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
