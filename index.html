<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>LinFamily</title>
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinFamily">
  <meta name="theme-color" content="#0E2C4E" id="metaThemeColor">

  <!-- 深淺主題預載防閃爍（沿用舊的設定值 linfamily_pixel_theme） -->
  <script>
    (function () {
      var v = null; try { v = localStorage.getItem('linfamily_theme') || localStorage.getItem('linfamily_pixel_theme'); } catch (_) {}
      var dark = v ? v === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
      document.getElementById('metaThemeColor').setAttribute('content', dark ? '#0E2C4E' : '#F4E4C4');
    })();
  </script>

  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    /* 字型與 DX 相同：英文 Arial（粗體用 Arial Bold）、中文微軟正黑體 */
    @font-face { font-family:"CLC Arial"; src:local("Arial"),local("ArialMT"); font-weight:100 549; }
    @font-face { font-family:"CLC Arial"; src:local("Arial Bold"),local("Arial-BoldMT"); font-weight:550 1000; }

    /* 色系：取自海灘配色（深海藍、湖水綠、海霧綠、霧白、沙色） */
    :root {
      --navy:#0E2C4E; --teal:#0FA3B1; --sea:#A8C5BF; --mist:#ECE8E6; --sand:#F4E4C4;
      --bg:var(--sand); --surface:#FBF6EC; --text:var(--navy); --muted:#4F6B7C;
      --border:rgba(14,44,78,.14); --btn:rgba(14,44,78,.07); --btn-h:rgba(14,44,78,.13);
      --shadow:0 18px 40px rgba(14,44,78,.18);
    }
    html.dark {
      --bg:var(--navy); --surface:#123660; --text:var(--mist); --muted:var(--sea);
      --border:rgba(236,232,230,.12); --btn:rgba(255,255,255,.06); --btn-h:rgba(255,255,255,.12);
      --shadow:0 20px 45px rgba(0,0,0,.45);
      color-scheme:dark;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body {
      min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
      background:var(--bg); color:var(--text);
      font-family:"CLC Arial", Arial, "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing:antialiased; transition:background-color .3s, color .3s;
    }
    button, input, select { font:inherit; color:inherit; }
    a { color:inherit; }

    /* ---------- 頂部列（不是 DX Header：沒有切站、沒有左右滑） ---------- */
    .lf-top { display:flex; align-items:center; justify-content:space-between; gap:12px;
      padding:calc(10px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 10px max(16px, env(safe-area-inset-left));
      max-width:1100px; width:100%; margin:0 auto; }
    .lf-wordmark { height:36px; padding:0 14px; border-radius:10px; background:var(--teal); color:#fff; font-weight:800; font-size:14px;
      letter-spacing:.05em; display:inline-flex; align-items:center; text-decoration:none; }
    .lf-btn { width:36px; height:36px; border-radius:10px; border:1px solid var(--border); background:var(--btn); display:inline-flex;
      align-items:center; justify-content:center; font-size:16px; cursor:pointer; position:relative; transition:background .2s, transform .1s; }
    .lf-btn:hover { background:var(--btn-h); }
    .lf-btn:active { transform:scale(.95); }
    .lf-dot { position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:#F5B942; }
    .lf-dot[hidden] { display:none; }
    .lf-menu { position:absolute; right:0; top:100%; margin-top:8px; width:220px; padding:7px 0; border-radius:12px; background:var(--surface);
      border:1px solid var(--border); box-shadow:var(--shadow); z-index:50; }
    .lf-menu[hidden] { display:none; }
    .lf-menu .lf-menu-head { padding:6px 15px 8px; font-size:11.5px; font-weight:700; color:var(--muted); border-bottom:1px solid var(--border);
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .lf-menu button { display:block; width:100%; padding:9px 15px; border:0; background:none; text-align:left; font-size:14px; font-weight:600; cursor:pointer; }
    .lf-menu button:hover { background:var(--btn); }
    .lf-menu button[hidden], .lf-menu hr[hidden] { display:none; }
    .lf-menu .lf-danger { color:#E0525E; font-weight:700; }
    .lf-menu hr { border:0; border-top:1px solid var(--border); margin:5px 0; }
    html.dark .lf-ic-moon, html:not(.dark) .lf-ic-sun { display:none; }

    /* ---------- 主畫面 ---------- */
    main { flex:1; width:100%; max-width:1100px; margin:0 auto; padding:18px max(20px, env(safe-area-inset-left)) 40px; }
    .lf-hello p { margin:0; }
    .lf-kicker { font-size:12px; font-weight:800; letter-spacing:.3em; text-transform:uppercase; color:var(--teal); }
    .lf-title { margin:6px 0 2px; font-size:clamp(28px, 7vw, 40px); font-weight:800; letter-spacing:-.02em; }
    .lf-date { color:var(--muted); font-size:14px; }
    .lf-tabs { display:inline-flex; gap:4px; padding:4px; margin:22px 0; border-radius:9999px; background:var(--btn); border:1px solid var(--border); }
    .lf-tabs button { border:0; background:none; padding:8px 16px; border-radius:9999px; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; }
    .lf-tabs button[aria-selected="true"] { background:var(--teal); color:#fff; }

    /* App 格子：手機 4 欄、平板 6 欄、電腦 8 欄 */
    #lfApps { display:grid; grid-template-columns:repeat(4, minmax(0, 1fr)); gap:22px 16px; max-width:520px; }
    @media (min-width:640px) { #lfApps { grid-template-columns:repeat(6, minmax(0, 1fr)); max-width:780px; gap:26px 22px; } }
    @media (min-width:1024px) { #lfApps { grid-template-columns:repeat(8, minmax(0, 1fr)); max-width:1040px; } }
    #lfApps .slot-cell { aspect-ratio:auto; }
    .lf-app { display:flex; flex-direction:column; align-items:center; gap:7px; text-decoration:none; color:var(--text); -webkit-tap-highlight-color:transparent; }
    .lf-icon { width:100%; aspect-ratio:1; border-radius:22%; display:grid; place-items:center; overflow:hidden; transition:transform .2s; }
    .lf-app:hover .lf-icon { transform:scale(1.05); }
    .lf-app:active .lf-icon { transform:scale(.95); }
    .lf-icon.is-emoji { background:var(--teal); font-size:clamp(26px, 8vw, 38px); }
    .lf-icon.is-fav { background:var(--mist); }
    .lf-icon.is-fav img { width:58%; height:58%; object-fit:contain; }
    .lf-icon.is-img img { width:100%; height:100%; object-fit:cover; }
    .lf-icon img { display:block; pointer-events:none; }
    .lf-name { font-size:12.5px; font-weight:700; line-height:1.25; text-align:center; max-width:100%; word-break:keep-all; overflow-wrap:anywhere; }
    @media (min-width:640px) { .lf-name { font-size:13.5px; } }
    .lf-slot { aspect-ratio:1; border-radius:22%; border:2px dashed var(--border); color:var(--muted); background:transparent; display:grid; place-content:center;
      font-size:26px; font-weight:300; margin-bottom:25px; opacity:.75; }
    html:not(.dark) .lf-slot { border-color:rgba(14,44,78,.22); }
    .lf-slot.is-admin { cursor:pointer; }
    .lf-slot.is-admin:hover { border-color:var(--teal); color:var(--teal); opacity:1; }
    .lf-remove { position:absolute; top:-9px; left:-9px; width:34px; height:34px; display:grid; place-content:center; border:0; background:none; padding:0; cursor:pointer; z-index:2; }
    .lf-remove span { width:22px; height:22px; border-radius:50%; background:#475569; box-shadow:0 1px 4px rgba(0,0,0,.35); display:grid; place-content:center; }
    .lf-remove span::after { content:""; width:10px; height:2px; border-radius:2px; background:#fff; }
    .lf-remove:hover span { background:#e11d48; }
    .slot-floating .lf-name { visibility:hidden; }
    .lf-hint { color:var(--muted); font-size:12.5px; margin-top:18px; }
    .lf-hint[hidden] { display:none; }

    /* ---------- 家庭空間配置 ---------- */
    .lf-board { background:#fff; border-radius:18px; padding:10px; overflow-x:auto; border:1px solid var(--border); }
    .lf-board svg { display:block; width:100%; min-width:620px; height:auto; }
    .svg-hotspot { cursor:pointer; outline:none; }
    .svg-hotspot .zone-box { transition:fill .2s, stroke .2s; }
    .svg-hotspot:hover .zone-box, .svg-hotspot:focus-visible .zone-box { fill:#EAF7F8; }
    .svg-hotspot.is-active .zone-box { fill:#E1F4F6; stroke:#0FA3B1; stroke-width:3; }
    .svg-hotspot.is-active .zone-pin { fill:#0FA3B1; }
    .lf-zone { margin-top:16px; padding:18px; border-radius:18px; background:var(--surface); border:1px solid var(--border); }
    .lf-zone h3 { margin:0 0 10px; font-size:16px; }
    .lf-zone ul { list-style:none; margin:0; padding:0; display:grid; gap:10px; }
    .lf-zone li a { display:flex; gap:12px; align-items:flex-start; text-decoration:none; padding:10px; border-radius:12px; background:var(--btn); }
    .lf-zone li a:hover { background:var(--btn-h); }
    .lf-zone .lf-icon { width:44px; flex:none; font-size:22px; }
    .lf-zone small { display:block; color:var(--muted); font-size:12.5px; line-height:1.5; margin-top:2px; }

    /* ---------- 對話框 ---------- */
    dialog.lf-dialog { width:min(92vw, 420px); padding:0; border:0; border-radius:20px; background:var(--surface); color:var(--text); box-shadow:var(--shadow); }
    dialog.lf-dialog::backdrop { background:rgba(5,15,28,.6); }
    .lf-dialog form, .lf-dialog .lf-dialog-body { padding:22px; display:flex; flex-direction:column; gap:12px; }
    .lf-dialog h3 { margin:0; font-size:18px; font-weight:800; }
    .lf-dialog label { display:flex; flex-direction:column; gap:6px; font-size:13px; font-weight:700; color:var(--muted); }
    .lf-dialog input, .lf-dialog select { height:44px; padding:0 14px; border-radius:12px; font-size:15px; background:var(--btn); border:1px solid var(--border); outline:none; }
    .lf-dialog input:focus, .lf-dialog select:focus { border-color:var(--teal); }
    .lf-dialog .lf-err { color:#E0525E; font-size:13px; margin:0; }
    .lf-dialog .lf-err[hidden] { display:none; }
    .lf-dialog .lf-note { color:var(--muted); font-size:13px; line-height:1.6; margin:0; }
    .lf-actions { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
    .lf-actions button { height:42px; padding:0 18px; border-radius:12px; font-weight:700; font-size:15px; border:0; cursor:pointer; background:var(--btn); }
    .lf-actions .lf-primary { background:var(--teal); color:#fff; }
    .lf-actions .lf-primary:disabled { opacity:.5; }
    .lf-users { list-style:none; margin:0; padding:0; display:grid; gap:8px; max-height:45vh; overflow:auto; }
    .lf-users li { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:12px; background:var(--btn); font-size:13.5px; }
    .lf-users li span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; }
    .lf-users li button { border:0; background:none; cursor:pointer; font-size:12.5px; font-weight:700; color:var(--teal); padding:4px 6px; }
    .lf-users li button.lf-del { color:#E0525E; }
    .lf-toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:100; padding:10px 18px; border-radius:12px;
      background:#0B1E33; color:#fff; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); }
    footer { text-align:center; font-size:11px; color:var(--muted); padding:14px 0 calc(14px + env(safe-area-inset-bottom)); border-top:1px solid var(--border); }
  </style>
</head>
<body>
  <div class="lf-top">
    <a class="lf-wordmark" href="./" aria-label="LinFamily 主畫面">LinFamily</a>
    <div style="position:relative">
      <button type="button" id="lfAuthBtn" class="lf-btn" aria-haspopup="menu" aria-expanded="false" title="登入與設定"><span id="lfAuthIcon">🔐</span><span id="lfAuthDot" class="lf-dot" hidden></span></button>
      <div id="lfMenu" class="lf-menu" role="menu" hidden>
        <div id="lfMenuHead" class="lf-menu-head">未登入</div>
        <button type="button" role="menuitem" data-act="login" id="lfLoginItem">🔐 登入</button>
        <button type="button" role="menuitem" data-act="users" id="lfUsersItem" hidden>👤 權限管理</button>
        <button type="button" role="menuitem" data-act="install" id="lfInstallItem">📲 安裝 App</button>
        <button type="button" role="menuitem" data-act="theme"><span class="lf-ic-sun">☀️ 切換淺色</span><span class="lf-ic-moon">🌙 切換深色</span></button>
        <hr id="lfLogoutSep" hidden>
        <button type="button" role="menuitem" data-act="logout" id="lfLogoutItem" class="lf-danger" hidden>🚪 登出</button>
      </div>
    </div>
  </div>

  <main>
    <section class="lf-hello">
      <p class="lf-kicker">Lin Family</p>
      <h1 class="lf-title" id="lfGreeting">Hello</h1>
      <p class="lf-date" id="lfDate">&nbsp;</p>
    </section>

    <div class="lf-tabs" role="tablist" aria-label="切換">
      <button type="button" role="tab" aria-selected="true" data-tab="apps">主畫面</button>
      <button type="button" role="tab" aria-selected="false" data-tab="family">家庭空間配置</button>
    </div>

    <section id="panelApps" aria-label="App">
      <!-- App 清單存在 Firestore linfamily_settings/apps。格子邏輯與 DX、YA、SR 共用 clc-slot-grid.js：
           Superuser 長按晃動 → 拖到空格或互換位置、「−」移除、點 App 修改、長按空格新增、按「完成」結束。 -->
      <nav id="lfApps" aria-label="App"></nav>
      <p class="lf-hint" id="lfHint" hidden>長按 App 可以移動或編輯，長按空格可以新增。</p>
    </section>

    <section id="panelFamily" aria-label="家庭空間配置" hidden>
      <div class="lf-board" id="floorplanBoard">
        <svg viewBox="0 0 760 320" role="img" aria-label="LinFamily 家庭空間配置平面圖">
          <defs>
            <marker id="pixelArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#111111"/>
            </marker>
            <pattern id="pixelDots" width="20" height="20" patternUnits="userSpaceOnUse">
              <circle cx="2" cy="2" r="1" fill="#E4E4E7"/>
            </pattern>
          </defs>

          <!-- 純白高對比底層 -->
          <rect x="0" y="0" width="760" height="320" rx="16" fill="#FFFFFF"/>
          <rect x="12" y="12" width="736" height="296" rx="12" fill="url(#pixelDots)" stroke="#111111" stroke-width="1.8"/>

          <!-- 建築隔間牆線 -->
          <line x1="260" y1="12" x2="260" y2="308" stroke="#71717A" stroke-width="1.6" stroke-dasharray="6 4"/>
          <line x1="510" y1="12" x2="510" y2="308" stroke="#71717A" stroke-width="1.6" stroke-dasharray="6 4"/>
          <line x1="260" y1="165" x2="748" y2="165" stroke="#71717A" stroke-width="1.6" stroke-dasharray="6 4"/>

          <!-- 動線箭頭 -->
          <path d="M 135 245 L 135 160 L 365 160 L 365 95" fill="none" stroke="#111111" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#pixelArrow)"/>
          <path d="M 385 120 L 385 225 L 590 225" fill="none" stroke="#111111" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#pixelArrow)"/>
          <path d="M 455 85 L 590 85" fill="none" stroke="#111111" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#pixelArrow)"/>

          <!-- 熱區 1：玄關門禁 -->
          <g class="svg-hotspot" data-zone-id="zone-entry" tabindex="0" role="button" aria-label="1 玄關門禁與影像">
            <rect class="zone-box" x="32" y="34" width="206" height="252" rx="16" fill="#FAFAFA" stroke="#3F3F46" stroke-width="1.6"/>
            <circle class="zone-pin" cx="62" cy="64" r="15" fill="#111111"/>
            <text x="62" y="69" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">1</text>
            <text x="88" y="69" fill="#111111" font-size="15" font-weight="700">玄關門禁與影像</text>
            <text x="48" y="102" fill="#3F3F46" font-size="12.5">• 智慧門鎖狀態監控</text>
            <text x="48" y="126" fill="#3F3F46" font-size="12.5">• 門口監視器即時串流</text>
            <text x="48" y="150" fill="#3F3F46" font-size="12.5">• 家人回家推播通知</text>
            <rect x="48" y="218" width="174" height="44" rx="12" fill="#F4F4F5" stroke="#111111" stroke-width="1.2"/>
            <text x="135" y="245" text-anchor="middle" fill="#111111" font-size="12.5" font-weight="700">主入口動線起點 →</text>
          </g>

          <!-- 熱區 2：客廳影音與相簿 -->
          <g class="svg-hotspot" data-zone-id="zone-living" tabindex="0" role="button" aria-label="2 客廳影音與相簿">
            <rect class="zone-box" x="278" y="34" width="214" height="114" rx="16" fill="#FAFAFA" stroke="#3F3F46" stroke-width="1.6"/>
            <circle class="zone-pin" cx="306" cy="62" r="15" fill="#111111"/>
            <text x="306" y="67" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">2</text>
            <text x="330" y="67" fill="#111111" font-size="15" font-weight="700">客廳影音與相簿</text>
            <text x="294" y="96" fill="#3F3F46" font-size="12.5">• LinFamily 共享相簿牆</text>
            <text x="294" y="118" fill="#3F3F46" font-size="12.5">• 客廳電視與家庭劇院中控</text>
          </g>

          <!-- 熱區 3：書房 NAS 與雲端 -->
          <g class="svg-hotspot" data-zone-id="zone-cloud" tabindex="0" role="button" aria-label="3 書房 NAS 雲端">
            <rect class="zone-box" x="528" y="34" width="202" height="114" rx="16" fill="#FAFAFA" stroke="#3F3F46" stroke-width="1.6"/>
            <circle class="zone-pin" cx="556" cy="62" r="15" fill="#111111"/>
            <text x="556" y="67" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">3</text>
            <text x="580" y="67" fill="#111111" font-size="15" font-weight="700">書房 NAS 雲端</text>
            <text x="544" y="96" fill="#3F3F46" font-size="12.5">• 私有雲檔案與自動備份</text>
            <text x="544" y="118" fill="#3F3F46" font-size="12.5">• 家庭網路與路由器監控</text>
          </g>

          <!-- 熱區 4：餐廚生活共享區 -->
          <g class="svg-hotspot" data-zone-id="zone-life" tabindex="0" role="button" aria-label="4 家庭行事曆、帳本與採買清單">
            <rect class="zone-box" x="278" y="182" width="452" height="104" rx="16" fill="#FAFAFA" stroke="#3F3F46" stroke-width="1.6"/>
            <circle class="zone-pin" cx="306" cy="212" r="15" fill="#111111"/>
            <text x="306" y="217" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="700">4</text>
            <text x="330" y="217" fill="#111111" font-size="15" font-weight="700">家庭行事曆、帳本與採買清單</text>
            <text x="294" y="246" fill="#3F3F46" font-size="12.5">• 全家人行程同步、紀念日提醒、家庭共同記帳與日常採買清單</text>
            <text x="294" y="268" fill="#111111" font-size="12" font-weight="700">動線節點：客廳 → 餐廚生活共享區</text>
          </g>
        </svg>
      </div>
      <div class="lf-zone" id="lfZone">
        <h3 id="lfZoneTitle">點平面圖上的區域，查看相關 App</h3>
        <ul id="lfZoneList"></ul>
      </div>
    </section>
  </main>

  <footer>© 2026 LinFamily</footer>

  <!-- 新增／修改 App -->
  <dialog class="lf-dialog" id="lfAppDialog">
    <form method="dialog" novalidate>
      <h3 id="lfAppTitle">新增 App</h3>
      <label>網址<input id="lfAppUrl" placeholder="例如 HannahProjects/home.html 或 https://…" autocomplete="off" inputmode="url"></label>
      <label>名稱<input id="lfAppName" maxlength="20" placeholder="留空會用網站名稱" autocomplete="off"></label>
      <label>圖示<input id="lfAppIcon" maxlength="300" placeholder="emoji（例如 🎨）或圖片網址；留空用網站圖示" autocomplete="off"></label>
      <p class="lf-err" id="lfAppErr" hidden></p>
      <div class="lf-actions">
        <button type="button" id="lfAppCancel">取消</button>
        <button type="submit" class="lf-primary" id="lfAppSave">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- 權限管理（只有 Superuser） -->
  <dialog class="lf-dialog" id="lfUsersDialog">
    <div class="lf-dialog-body">
      <h3>權限管理</h3>
      <p class="lf-note">Superuser 為固定名單（寫在程式裡）。Admin 可登入；Viewer 唯讀。編輯 App 只限 Superuser。</p>
      <ul class="lf-users" id="lfUsersList"><li><span>讀取中…</span></li></ul>
      <form id="lfUserAdd" style="padding:0;flex-direction:row;gap:8px;align-items:flex-end">
        <label style="flex:1">Email<input id="lfUserEmail" type="email" placeholder="name@example.com" autocomplete="off"></label>
        <label>角色<select id="lfUserRole"><option value="admin">Admin</option><option value="viewer">Viewer</option></select></label>
        <div class="lf-actions" style="margin:0"><button type="submit" class="lf-primary">加入</button></div>
      </form>
      <p class="lf-err" id="lfUsersErr" hidden></p>
      <div class="lf-actions"><button type="button" id="lfUsersClose">關閉</button></div>
    </div>
  </dialog>

  <!-- 安裝說明 -->
  <dialog class="lf-dialog" id="lfInstallDialog">
    <div class="lf-dialog-body">
      <h3>安裝 LinFamily</h3>
      <p class="lf-note" id="lfInstallText"></p>
      <div class="lf-actions"><button type="button" class="lf-primary" id="lfInstallClose">知道了</button></div>
    </div>
  </dialog>

  <script src="clc-slot-grid.js?v=20261115g"></script>
  <script>
  (function () {
    'use strict';
    // ---------- Firebase（LinFamily 自己的專案） ----------
    const firebaseConfig = {
      apiKey: "AIzaSyBPcURIjgwtEVi_nTaZT569e_nwJb4IsUs",
      authDomain: "linfamily-31cb6.firebaseapp.com",
      projectId: "linfamily-31cb6",
      storageBucket: "linfamily-31cb6.firebasestorage.app",
      messagingSenderId: "299667187224",
      appId: "1:299667187224:web:8df32264698caad761c56d"
    };
    let auth = null, db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth(); db = firebase.firestore();
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
    } catch (err) { console.warn('Firebase 無法啟動', err); }

    // Superuser 固定名單（沿用舊版）
    const SUPERUSERS = ['darren710404@gmail.com', 'darren.lin@twclc.org'];
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const $ = id => document.getElementById(id);
    function toast(msg) {
      document.querySelectorAll('.lf-toast').forEach(t => t.remove());
      const t = document.createElement('div'); t.className = 'lf-toast'; t.setAttribute('role', 'status'); t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
    }

    // ---------- 問候與日期 ----------
    function hello() {
      const now = new Date(), h = now.getHours();
      $('lfGreeting').textContent = h < 5 ? 'Good Night' : h < 12 ? 'Good Morning' : h < 18 ? 'Good Afternoon' : 'Good Evening';
      $('lfDate').textContent = now.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long' });
    }
    hello(); setInterval(hello, 60000);

    // ---------- 登入與權限 ----------
    let user = null, role = '', roleUnsub = null, slots = null;
    const isSuper = () => role === 'superuser';
    window.isSuperuser = false;
    function applyRole(r) {
      role = r || '';
      window.isSuperuser = role === 'superuser';
      $('lfAuthIcon').textContent = role === 'viewer' ? '👁️' : role ? '👑' : '🔐';
      $('lfAuthDot').hidden = !role;
      $('lfMenuHead').textContent = role ? `${user.email} · ${role === 'superuser' ? 'Superuser' : role === 'admin' ? 'Admin' : 'Viewer（唯讀）'}` : '未登入';
      $('lfLoginItem').hidden = !!role;
      $('lfUsersItem').hidden = !isSuper();
      $('lfLogoutItem').hidden = !role; $('lfLogoutSep').hidden = !role;
      $('lfHint').hidden = !isSuper();
      if (slots) { slots.render(); if (isSuper()) seedIfNeeded(); }
    }
    if (auth) auth.onAuthStateChanged(u => {
      if (roleUnsub) { roleUnsub(); roleUnsub = null; }
      user = u && u.email && u.emailVerified ? u : null;
      if (!user) return applyRole('');
      const email = user.email.toLowerCase();
      if (SUPERUSERS.includes(email)) return applyRole('superuser');
      roleUnsub = db.collection('admin_users').doc(email).onSnapshot(snap => {
        const d = snap.exists ? snap.data() : null;
        applyRole(d && d.active !== false && (d.role === 'admin' || d.role === 'viewer') ? d.role : '');
      }, () => applyRole(''));
    });
    async function login() {
      if (!auth) return toast('登入服務尚未載入，請重新整理。');
      try {
        const res = await auth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
        const email = res.user.email.toLowerCase();
        if (SUPERUSERS.includes(email)) return toast('歡迎回來，' + (res.user.displayName || email));
        const snap = await db.collection('admin_users').doc(email).get();
        const d = snap.exists ? snap.data() : null;
        if (!(d && d.active !== false && (d.role === 'admin' || d.role === 'viewer'))) {
          await auth.signOut(); toast('帳號【' + email + '】沒有權限。');
        } else toast('歡迎，' + (res.user.displayName || email));
      } catch (err) {
        if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err && err.code)) toast('登入未完成，請確認瀏覽器允許彈出視窗。');
      }
    }

    // ---------- 皇冠選單 ----------
    const menu = $('lfMenu'), authBtn = $('lfAuthBtn');
    function setMenu(open) { menu.hidden = !open; authBtn.setAttribute('aria-expanded', open ? 'true' : 'false'); }
    authBtn.addEventListener('click', () => setMenu(menu.hidden));
    document.addEventListener('click', e => { if (!menu.hidden && !menu.contains(e.target) && !authBtn.contains(e.target)) setMenu(false); });
    menu.addEventListener('click', async e => {
      const b = e.target.closest('button[data-act]'); if (!b) return;
      const act = b.dataset.act;
      if (act !== 'theme') setMenu(false);
      if (act === 'login') login();
      else if (act === 'logout') { if (confirm('確定要登出嗎？')) { await auth.signOut(); toast('已登出'); } }
      else if (act === 'theme') toggleTheme();
      else if (act === 'install') install();
      else if (act === 'users') openUsers();
    });
    function toggleTheme() {
      const dark = !document.documentElement.classList.contains('dark');
      document.documentElement.classList.toggle('dark', dark);
      $('metaThemeColor').setAttribute('content', dark ? '#0E2C4E' : '#F4E4C4');
      try { localStorage.setItem('linfamily_theme', dark ? 'dark' : 'light'); } catch (_) {}
    }

    // ---------- 安裝（PWA） ----------
    let deferredPrompt = null;
    const standalone = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; });
    window.addEventListener('appinstalled', () => { deferredPrompt = null; $('lfInstallItem').hidden = true; toast('已安裝'); });
    if (standalone()) $('lfInstallItem').hidden = true;
    async function install() {
      if (deferredPrompt) { deferredPrompt.prompt(); try { await deferredPrompt.userChoice; } catch (_) {} deferredPrompt = null; return; }
      const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      $('lfInstallText').innerHTML = ios
        ? '請用 Safari 開啟這一頁，按下方的「分享」<b>⬆︎</b>，再選「<b>加入主畫面</b>」。'
        : '請在瀏覽器選單（右上角 ⋮）選「<b>安裝應用程式</b>」或「<b>加到主畫面</b>」。';
      $('lfInstallDialog').showModal();
    }
    $('lfInstallClose').addEventListener('click', () => $('lfInstallDialog').close());
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});

    // ---------- App 清單 ----------
    const CACHE_KEY = 'linfamily_apps_v2';
    const HANNAH = { id: 'hannah', name: "Hannah's Studio", url: 'HannahProjects/home.html', icon: 'HannahProjects/apple-touch-icon.png', pos: 0 };
    const PRESET_EMOJI = { photos:'📷', calendar:'📅', home:'🏠', cloud:'☁️', notes:'📝', finance:'💰', security:'📹', map:'📍', media:'🎬', link:'🔗' };
    let apps = [HANNAH], needsSeed = false, seeding = false;
    try { const c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (Array.isArray(c) && c.length) apps = c; } catch (_) {}

    function safeUrl(value) {
      const v = String(value || '').trim();
      if (!v || v.startsWith('//')) return '';
      if (/^[a-z][a-z0-9+.-]*:/i.test(v)) { try { const u = new URL(v); return /^https?:$/.test(u.protocol) ? u.href : ''; } catch (_) { return ''; } }
      // 看起來像網域（example.com、www.xxx）就補 https://；其他當作站內路徑（例如 HannahProjects/）
      if (/^www\./i.test(v) || (/^[\w-]+(\.[\w-]+)+(:\d+)?(\/.*)?$/i.test(v) && !/\.html?($|[?#/])/i.test(v) && !/\/$/.test(v))) return safeUrl('https://' + v);
      return v;
    }
    const isExternal = url => { try { return new URL(url, location.href).origin !== location.origin; } catch (_) { return false; } };
    const isImageUrl = v => /^(https?:\/\/|\/|\.\/)/i.test(String(v || '')) || /\.(png|jpe?g|gif|webp|svg)(\?|$)/i.test(String(v || ''));
    function iconEl(app) {
      const span = document.createElement('span');
      span.className = 'lf-icon';
      const icon = String(app.icon || app.iconUrl || '').trim();
      const img = src => { const i = document.createElement('img'); i.alt = ''; i.loading = 'lazy'; i.src = src;
        i.addEventListener('error', () => { span.className = 'lf-icon is-emoji'; span.textContent = '🔗'; }, { once: true }); return i; };
      if (icon && isImageUrl(icon) && safeUrl(icon)) { span.classList.add('is-img'); span.append(img(safeUrl(icon))); }
      else if (icon) { span.classList.add('is-emoji'); span.textContent = icon; }
      else if (PRESET_EMOJI[app.preset]) { span.classList.add('is-emoji'); span.textContent = PRESET_EMOJI[app.preset]; }
      else if (isExternal(safeUrl(app.url))) {
        let host = ''; try { host = new URL(safeUrl(app.url)).hostname; } catch (_) {}
        span.classList.add('is-fav'); span.append(img('https://www.google.com/s2/favicons?sz=128&domain=' + encodeURIComponent(host)));
      } else { span.classList.add('is-emoji'); span.textContent = '✨'; }
      return span;
    }
    function renderTile(app, editing) {
      const a = document.createElement('a');
      a.className = 'lf-app';
      a.href = safeUrl(app.url) || '#'; // 同一個視窗換頁（不開新分頁、不用左右滑）
      a.setAttribute('aria-label', editing ? '編輯 ' + app.name : app.name);
      const name = document.createElement('span'); name.className = 'lf-name'; name.textContent = app.name;
      a.append(iconEl(app), name);
      return a;
    }
    let addPos = null;
    slots = window.clcSlotGrid($('lfApps'), {
      minSlots: 8, cellClass: 'lf-cell', emptyClass: 'lf-slot', removeClass: 'lf-remove',
      canEdit: isSuper,
      getItems: () => apps,
      renderTile,
      save: persist,
      error: err => toast('排列儲存失敗：' + errText(err)),
      onAdd: pos => { addPos = pos; openApp(null); },
      onEdit: id => openApp(id),
      onRemove: id => removeApp(id)
    });
    const withPos = () => window.clcSlotGridNormalize(apps);
    function errText(err) { return err && err.code === 'permission-denied' ? '權限不足（請確認已用 Superuser 登入，以及 Firestore 規則）。' : '請稍後再試。'; }
    async function persist(next) {
      if (!db) throw new Error('資料庫尚未載入');
      await db.collection('linfamily_settings').doc('apps').set({
        items: next, hannahSeeded: true,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp(), updatedBy: user ? user.email : ''
      });
      apps = next; needsSeed = false;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(apps)); } catch (_) {}
      slots.render(); renderZone();
    }
    async function removeApp(id) {
      const app = apps.find(a => a.id === id);
      if (!app || !confirm('從主畫面移除「' + app.name + '」？')) return;
      try { await persist(withPos().filter(a => a.id !== id)); } catch (err) { toast('移除失敗：' + errText(err)); }
    }
    // 舊資料第一次載入時，把 Hannah's Studio 放到第一格（其餘依序往後），由 Superuser 登入時寫回雲端。
    function fromCloud(d) {
      let items = Array.isArray(d.items) ? d.items.filter(a => a && a.id && a.name) : [];
      if (d.hannahSeeded || items.some(a => a.id === HANNAH.id)) return { items, seed: false };
      items = [HANNAH].concat(window.clcSlotGridNormalize(items).sort((a, b) => a.pos - b.pos).map((a, i) => Object.assign({}, a, { pos: i + 1 })));
      return { items, seed: true };
    }
    function seedIfNeeded() {
      if (!needsSeed || seeding || !isSuper()) return;
      seeding = true; persist(apps).catch(err => console.warn('Hannah 預設寫入失敗', err)).finally(() => { seeding = false; });
    }
    if (db) db.collection('linfamily_settings').doc('apps').onSnapshot(snap => {
      const r = snap.exists ? fromCloud(snap.data()) : { items: [HANNAH], seed: true };
      apps = r.items; needsSeed = r.seed;
      try { localStorage.setItem(CACHE_KEY, JSON.stringify(apps)); } catch (_) {}
      slots.render(); renderZone(); seedIfNeeded();
    }, err => console.warn('App 清單讀取失敗（沿用快取）', err));

    // ---------- 新增／修改對話框 ----------
    const dlg = $('lfAppDialog'); let editingId = null;
    function showErr(msg) { $('lfAppErr').textContent = msg; $('lfAppErr').hidden = !msg; }
    function openApp(id) {
      if (!isSuper()) return;
      const app = id ? apps.find(a => a.id === id) : null;
      editingId = app ? app.id : null; if (app) addPos = null;
      $('lfAppTitle').textContent = app ? '修改 App' : '新增 App';
      $('lfAppUrl').value = app ? app.url || '' : '';
      $('lfAppName').value = app ? app.name : '';
      $('lfAppIcon').value = app ? (app.icon || app.iconUrl || '') : '';
      showErr(''); $('lfAppSave').disabled = false;
      dlg.showModal(); (app ? $('lfAppName') : $('lfAppUrl')).focus();
    }
    $('lfAppCancel').addEventListener('click', () => dlg.close());
    dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
    dlg.querySelector('form').addEventListener('submit', async e => {
      e.preventDefault();
      const url = safeUrl($('lfAppUrl').value);
      const icon = $('lfAppIcon').value.trim();
      let name = $('lfAppName').value.trim().slice(0, 20);
      if (!url) return showErr('請輸入網址，例如 HannahProjects/home.html 或 https://example.com');
      if (icon && isImageUrl(icon) && !safeUrl(icon)) return showErr('圖示網址格式不正確。');
      if (!name) { try { name = isExternal(url) ? new URL(url).hostname.replace(/^www\./, '') : url.replace(/\/$/, ''); } catch (_) { name = url; } name = name.slice(0, 20); }
      $('lfAppSave').disabled = true;
      const base = withPos(), old = editingId && base.find(a => a.id === editingId);
      const patch = { name, url, icon, iconUrl: '' };
      const next = old
        ? base.map(a => a.id === old.id ? Object.assign({}, a, patch) : a)
        : base.concat(Object.assign({ id: 'app_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6) }, patch,
            Number.isInteger(addPos) && !base.some(a => a.pos === addPos) ? { pos: addPos } : {}));
      try { await persist(next); dlg.close(); }
      catch (err) { showErr('儲存失敗：' + errText(err)); $('lfAppSave').disabled = false; }
    });

    // ---------- 權限管理 ----------
    const usersDlg = $('lfUsersDialog');
    function usersErr(msg) { $('lfUsersErr').textContent = msg; $('lfUsersErr').hidden = !msg; }
    async function loadUsers() {
      const list = $('lfUsersList');
      try {
        const snap = await db.collection('admin_users').get();
        const rows = snap.docs.map(d => Object.assign({ email: d.id }, d.data())).sort((a, b) => a.email.localeCompare(b.email));
        list.innerHTML = rows.length ? rows.map(u => `<li data-email="${esc(u.email)}"><span>${esc(u.email)}</span>
          <button type="button" data-u="role">${u.role === 'viewer' ? 'Viewer' : 'Admin'}</button>
          <button type="button" data-u="active">${u.active === false ? '已停用' : '啟用中'}</button>
          <button type="button" data-u="del" class="lf-del">刪除</button></li>`).join('') : '<li><span>目前沒有其他成員</span></li>';
        usersErr('');
      } catch (err) { list.innerHTML = ''; usersErr('讀取失敗：' + errText(err)); }
    }
    function openUsers() { if (!isSuper()) return; usersDlg.showModal(); loadUsers(); }
    $('lfUsersClose').addEventListener('click', () => usersDlg.close());
    $('lfUsersList').addEventListener('click', async e => {
      const b = e.target.closest('button[data-u]'); if (!b) return;
      const email = b.closest('li').dataset.email, ref = db.collection('admin_users').doc(email);
      try {
        if (b.dataset.u === 'del') { if (!confirm('刪除 ' + email + '？')) return; await ref.delete(); }
        else if (b.dataset.u === 'role') await ref.update({ role: b.textContent === 'Admin' ? 'viewer' : 'admin', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        else await ref.update({ active: b.textContent !== '啟用中', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        loadUsers();
      } catch (err) { usersErr('更新失敗：' + errText(err)); }
    });
    $('lfUserAdd').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('lfUserEmail').value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || SUPERUSERS.includes(email)) return usersErr('Email 格式不正確，或已是 Superuser。');
      try {
        await db.collection('admin_users').doc(email).set({ role: $('lfUserRole').value, active: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        $('lfUserEmail').value = ''; loadUsers();
      } catch (err) { usersErr('加入失敗：' + errText(err)); }
    });

    // ---------- 分頁：主畫面／家庭空間配置 ----------
    document.querySelectorAll('.lf-tabs [data-tab]').forEach(b => b.addEventListener('click', () => {
      const tab = b.dataset.tab;
      document.querySelectorAll('.lf-tabs [data-tab]').forEach(x => x.setAttribute('aria-selected', x === b ? 'true' : 'false'));
      $('panelApps').hidden = tab !== 'apps'; $('panelFamily').hidden = tab !== 'family';
      if (tab !== 'apps') slots.setEditing(false);
    }));
    // 平面圖：點區域 → 列出這個區域的 App（App 的 zoneId 沿用舊資料）
    let activeZone = '';
    function renderZone() {
      const list = $('lfZoneList');
      document.querySelectorAll('.svg-hotspot').forEach(g => g.classList.toggle('is-active', g.dataset.zoneId === activeZone));
      if (!activeZone) { list.replaceChildren(); $('lfZoneTitle').textContent = '點平面圖上的區域，查看相關 App'; return; }
      const g = document.querySelector('.svg-hotspot[data-zone-id="' + CSS.escape(activeZone) + '"]');
      $('lfZoneTitle').textContent = (g && g.getAttribute('aria-label')) || '';
      const items = apps.filter(a => a.zoneId === activeZone);
      list.replaceChildren(...(items.length ? items.map(a => {
        const li = document.createElement('li'), link = document.createElement('a');
        link.href = safeUrl(a.url) || '#';
        const text = document.createElement('div');
        text.innerHTML = `<strong>${esc(a.name)}</strong>${a.rolePrimary ? `<small>${esc(a.rolePrimary)}</small>` : ''}${a.roleSecondary ? `<small>${esc(a.roleSecondary)}</small>` : ''}`;
        link.append(iconEl(a), text); li.append(link); return li;
      }) : [Object.assign(document.createElement('li'), { textContent: '這個區域還沒有 App。' })]));
    }
    document.querySelectorAll('.svg-hotspot').forEach(g => {
      const pick = () => { activeZone = activeZone === g.dataset.zoneId ? '' : g.dataset.zoneId; renderZone(); };
      g.addEventListener('click', pick);
      g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); } });
    });

    slots.render();
  })();
  </script>
</body>
</html>
