    (function lfAppHeight() { // iPhone 主畫面 App 才用：高度＝整個螢幕（直式取長邊、橫式取短邊）
      if (!/iPhone/i.test(navigator.userAgent) || !(navigator.standalone === true || matchMedia('(display-mode: standalone)').matches)) return;
      var root = document.documentElement;
      function set() {
        var a = screen.width, b = screen.height, portrait = innerHeight >= innerWidth;
        root.style.setProperty('--lf-app-h', (portrait ? Math.max(a, b) : Math.min(a, b)) + 'px');

      root.classList.add('lf-ios-app'); set();
      addEventListener('resize', set); addEventListener('orientationchange', function () { setTimeout(set, 300); });
    })();
  </script>

  <style>
    /* 字型與 DX 相同：英文 Arial（粗體用 Arial Bold）、中文微軟正黑體 */
    @font-face { font-family:"CLC Arial"; src:local("Arial"),local("ArialMT"); font-weight:100 549; }
    @font-face { font-family:"CLC Arial"; src:local("Arial Bold"),local("Arial-BoldMT"); font-weight:550 1000; }

    /* 色系：墨黑 #1C1C1C、松綠 #4E8B7E、鼠尾草綠 #8FBFB0、奶油米 #EADFC8、淺灰 #E6E7E9（底色） */
    :root {
      --ink:#1C1C1C; --pine:#4E8B7E; --sage:#8FBFB0; --cream:#EADFC8; --cloud:#E6E7E9;
      --teal:var(--pine);
      --bg:var(--cloud); --surface:#FFFFFF; --text:var(--ink); --muted:#5E6B67;
      --border:rgba(28,28,28,.12); --btn:rgba(28,28,28,.06); --btn-h:rgba(28,28,28,.11);
      --shadow:0 18px 40px rgba(28,28,28,.16);
    }
    html.dark {
      --teal:var(--sage);
      --bg:#161716; --surface:#161924; --text:#F1F1EF; --muted:#A8B5B0;
      --border:rgba(255,255,255,.1); --btn:rgba(255,255,255,.05); --btn-h:rgba(255,255,255,.1);
      --shadow:0 20px 45px rgba(0,0,0,.55);
      color-scheme:dark;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body {
      min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
      background:var(--bg); color:var(--text);
      font-family:"CLC Arial", Arial, "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing:antialiased; transition:background-color .3s, color .3s;
    }
    button, input, select { font:inherit; color:inherit; }
    a { color:inherit; }

    /* ---------- 頂部（沒有外框；左：日期＋標題，右：照 DX 的安裝與管理員按鈕） ---------- */
    .lf-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
      padding:calc(16px + env(safe-area-inset-top)) max(var(--lf-pad), env(safe-area-inset-right)) 0 max(var(--lf-pad), env(safe-area-inset-left));
      width:100%; margin:0 auto; }
    .lf-date { margin:0; font-size:13px; font-weight:700; color:var(--muted); letter-spacing:.02em; }
    .lf-title { margin:2px 0 0; font-size:var(--lf-greeting-size, clamp(24px, 6.6vw, 42px)); font-weight:800; letter-spacing:-.02em; line-height:1.15; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    /* 右上角按鈕位置照 DX 的 Header：離上緣 6px（DX 的 Header 高 46／48px、按鈕 34／36px 置中），離右緣 14／20／24／32px，貼齊整個畫面右邊 */
    .lf-right { display:flex; align-items:center; gap:6px; flex:none; position:fixed; z-index:40; top:calc(6px + env(safe-area-inset-top)); right:max(14px, env(safe-area-inset-right)); }
    @media (min-width:640px) { .lf-right { right:max(20px, env(safe-area-inset-right)); gap:7.1px; } } /* DX 的 gap-1.5 在寬畫面量起來是 7.1px */
    @media (min-width:1024px) { .lf-right { right:24px; } }
    @media (min-width:1440px) { .lf-right { right:32px; } }
    /* 以下尺寸、顏色與 DX 的 Header 按鈕／管理員下拉選單相同 */
    .lf-btn { width:34px; min-width:34px; height:34px; border-radius:9px; font-size:15px; padding:0; display:inline-flex; align-items:center; justify-content:center;
      cursor:pointer; position:relative; background:rgba(226,232,240,.7); color:#334155; border:1px solid rgba(203,213,225,.6); transition:background .15s, transform .1s; }
    /* 皇冠沿用 DX 的 Arial 字型與 1.5 行高，避免 LF 預設 normal 行高造成偏移。 */
    #lfAuthBtn { font-family:"CLC Arial",Arial,"Microsoft JhengHei",sans-serif; font-weight:400; line-height:1.5; }
    #lfAuthIcon { line-height:inherit; }
    .lf-btn:hover { background:rgba(203,213,225,.7); }
    .lf-btn:active { transform:scale(.95); }
    html.dark .lf-btn { background:rgba(255,255,255,.05); color:#cbd5e1; border-color:rgba(255,255,255,.1); }
    html.dark .lf-btn:hover { background:rgba(255,255,255,.1); }
    .lf-install { width:auto; padding:0 10px; font-size:12px; font-weight:600; gap:4px; line-height:1; white-space:nowrap; } /* line-height:1：字在按鈕裡上下置中 */
    .lf-install > span { display:block; }
    .lf-install[hidden] { display:none; }
    .lf-dot { position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:#fbbf24; animation:lfPulse 2s cubic-bezier(.4,0,.6,1) infinite; }
    .lf-dot[hidden] { display:none; }
    @keyframes lfPulse { 50% { opacity:.5; } }
    @media (min-width:640px) {
      .lf-btn { width:36px; min-width:36px; height:36px; border-radius:10px; font-size:16px; }
      .lf-install { width:auto; height:36px; font-size:13px; padding:0 12px; }
    }
    .lf-menu { position:absolute; right:0; top:100%; margin-top:7.5px; width:210px; padding:7.5px 0; border-radius:11.25px; z-index:50; text-align:left;
      background:#fff; border:1px solid #e2e8f0; box-shadow:0 25px 50px -12px rgba(0,0,0,.25); }
    html.dark .lf-menu { background:#161924; border-color:rgba(255,255,255,.1); }
    .lf-menu[hidden] { display:none; }
    .lf-menu .lf-menu-head { padding:7.5px 15px; font-size:11.25px; line-height:15px; font-weight:700; color:#94a3b8; border-bottom:1px solid #f1f5f9;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    html.dark .lf-menu .lf-menu-head { border-bottom-color:rgba(255,255,255,.05); }
    .lf-menu button { display:block; width:100%; padding:9.375px 15px; border:0; background:none; text-align:left; font-size:13.125px; line-height:18.75px; font-weight:600;
      color:#334155; cursor:pointer; transition:background .15s; }
    html.dark .lf-menu button { color:#e2e8f0; }
    .lf-menu button:hover { background:#f1f5f9; }
    html.dark .lf-menu button:hover { background:rgba(255,255,255,.05); }
    @media (min-width:640px) { .lf-menu button { font-size:15px; } }
    .lf-menu button[hidden] { display:none; }
    .lf-menu .lf-sep { border-top:1px solid #f1f5f9; margin:5.625px 0; }
    html.dark .lf-menu .lf-sep { border-top-color:rgba(255,255,255,.05); }
    .lf-menu .lf-danger { color:#e11d48; font-weight:700; }
    html.dark .lf-menu .lf-danger { color:#fb7185; }
    .lf-menu .lf-danger:hover { background:#fff1f2; }
    html.dark .lf-menu .lf-danger:hover { background:rgba(244,63,94,.1); }

    /* ---------- 主畫面 ---------- */
    main { flex:1; width:100%; margin:0 auto; padding:18px max(var(--lf-pad), env(safe-area-inset-left)) 40px; }
    /* 左右邊距跟 DX 主畫面一樣：手機 14px、≥640 20px、≥1024 24px、≥1440 32px */
    :root { --lf-pad:14px; }
    @media (min-width:640px) { :root { --lf-pad:20px; } }
    @media (min-width:1024px) { :root { --lf-pad:24px; } .lf-top, main { padding-left:var(--lf-pad); padding-right:var(--lf-pad); } }
    @media (min-width:1440px) { :root { --lf-pad:32px; } }
    .lf-tabs { display:inline-flex; gap:4px; padding:4px; margin:22px 0 24px; border-radius:9999px; background:var(--btn); border:1px solid var(--border); }
    .lf-tabs > button { border:0; background:none; padding:8px 16px; border-radius:9999px; font-size:14px; font-weight:700; color:var(--muted); cursor:pointer; }
    .lf-tabs > button[aria-selected="true"] { background:var(--pine); color:#fff; }
    .lf-newdot { display:inline-block; width:8px; height:8px; margin-left:5px; vertical-align:top; border-radius:50%; background:#E5484D; }
    .lf-newdot[hidden] { display:none; }
    .lf-all button { border:0; border-radius:9999px; padding:6px 14px; font:inherit; font-size:13px; font-weight:700; background:var(--pine); color:#fff; cursor:pointer; }
    .lf-all-note { font-size:13px; opacity:.7; margin:0 0 12px; }
    .lf-all { display:grid; gap:8px; }
    .lf-all-row { display:flex; align-items:center; gap:12px; padding:8px 12px; border-radius:14px; background:var(--btn); }
    .lf-all-row a { flex:1; display:flex; align-items:center; gap:12px; color:inherit; text-decoration:none; min-width:0; font-weight:700; }
    .lf-all-row .lf-icon { width:40px; height:40px; flex:none; }
    .lf-all-row a { -webkit-touch-callout:none; }
    .lf-all-sec { margin:14px 4px 2px; font-size:13px; font-weight:700; color:var(--muted); } .lf-all-sec:first-child { margin-top:0; }
    .lf-open { flex:none; display:flex; align-items:center; gap:6px; font-size:13px; cursor:pointer; user-select:none; }
    .lf-open input { width:38px; height:22px; margin:0; appearance:none; -webkit-appearance:none; border-radius:11px; background:var(--btn-h); position:relative; cursor:pointer; transition:background .2s; }
    .lf-open input::after { content:''; position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.3); transition:left .2s; }
    .lf-open input:checked { background:var(--pine, #4E8B7E); }
    .lf-open input:checked::after { left:18px; }
    .lf-open span { min-width:2.2em; }
    .lf-row-menu { position:fixed; }
    dialog.lf-dialog.lf-pin { width:min(300px, 90vw); text-align:center; } .lf-pin form { padding:20px; }
    .lf-pin-btns .lf-primary { background:var(--pine); color:#fff; border:0; }
    .lf-pin h3 { margin:0 0 4px; } .lf-pin p { margin:0 0 10px; }
    .lf-pin input { -webkit-text-security:disc; text-security:disc; width:100%; height:44px; text-align:center; letter-spacing:.4em; font-size:20px; border-radius:12px; border:1px solid var(--border); background:var(--btn); }
    .lf-pin-err { color:#E0525E; margin-top:8px !important; }
    .lf-pin-btns { display:flex; gap:10px; margin-top:14px; } .lf-pin-btns button { flex:1; height:40px; border-radius:10px; border:1px solid var(--border); background:var(--btn); }
    .lf-all-row button:disabled { background:var(--btn-h); color:inherit; opacity:.7; cursor:default; }

    /* App 格子：手機 4 欄、平板 6 欄、電腦 8 欄 */
    /* 整個畫面都放 App：一行放得下幾個就放幾個，超過就換下一行 */
    #lfApps { --dk-top:200px; margin:0 -11px; }
    @media (max-width:699px) { #lfApps { margin:0 -8px; } }
    #lfApps .lf-app { width:100%; }
    .lf-top { flex-wrap:wrap; }
    #lfToolbar { margin:0; justify-content:flex-end; } /* 分頁列右緣對齊皇冠；＋ 在左邊，消失時分頁列不會移動 */
    #lfToolbar .clc-tb-add { order:-1; }
    @media (max-width:639px) { #lfToolbar { justify-content:flex-start; } #lfToolbar .clc-tb-add { order:0; } } /* 手機：分頁列靠左、＋ 緊接在放大鏡旁邊 */
    main > .clc-tb-search { order:-1; flex:none; } /* 搜尋框出現在上方，把內容往下擠 */
    @media (max-width:639px) { #lfToolbar { order:3; flex-basis:100%; margin-top:14px; } }
    @media (min-width:640px) { .lf-top { align-items:flex-end; padding-top:calc(30px + env(safe-area-inset-top)); } .lf-top > :first-child { flex:1; min-width:0; } }
    html.lf-has-wall .clc-tb-tabs, html.lf-has-wall .clc-tb-btn { background:color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
    #lfApps .slot-cell { aspect-ratio:auto; }
    .lf-app { display:flex; flex-direction:column; align-items:center; gap:7px; text-decoration:none; color:var(--text); -webkit-tap-highlight-color:transparent; }
    .lf-icon { width:100%; aspect-ratio:1; border-radius:22%; display:grid; place-items:center; overflow:hidden; transition:transform .2s; }
    .lf-app:hover .lf-icon { transform:scale(1.05); }
    .lf-app:active .lf-icon { transform:scale(.95); }
    .lf-icon.is-emoji { background:var(--pine); font-size:clamp(26px, 8vw, 38px); }
    .lf-icon.is-mono { color:#fff; font-weight:800; font-size:clamp(18px, 5.4vw, 26px); letter-spacing:-.02em; }
    .lf-iconrow { display:flex; gap:10px; align-items:center; }
    .lf-iconrow input { flex:1; min-width:0; }
    #lfAppPreview { width:44px; flex:none; }
    #lfAppPreview .lf-icon.is-mono { font-size:16px; } #lfAppPreview .lf-icon.is-emoji { font-size:24px; }
    .lf-icon.is-img img { width:100%; height:100%; object-fit:cover; }
    .lf-icon img { display:block; pointer-events:none; }
    #lfApps a { -webkit-touch-callout:none; } /* iPhone／iPad 長按 App 不跳出連結預覽 */
    .lf-name { font-size:12.5px; font-weight:700; line-height:1.25; text-align:center; max-width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } /* 名稱一行，太長顯示「…」（同 iPhone、Android） */
    @media (min-width:640px) { .lf-name { font-size:13.5px; } }
    .lf-slot { aspect-ratio:1; border-radius:22%; border:2px dashed var(--border); color:var(--muted); background:transparent; display:grid; place-content:center;
      font-size:26px; font-weight:300; margin-bottom:25px; opacity:.75; }
    html:not(.dark) .lf-slot { border-color:rgba(14,44,78,.22); }
    .lf-slot.is-admin { cursor:pointer; }
    .lf-slot.is-admin:hover { border-color:var(--teal); color:var(--teal); opacity:1; }
    .lf-remove { position:absolute; top:-9px; left:-9px; width:34px; height:34px; display:grid; place-content:center; border:0; background:none; padding:0; cursor:pointer; z-index:2; }
    .lf-remove span { width:22px; height:22px; border-radius:50%; background:#475569; box-shadow:0 1px 4px rgba(0,0,0,.35); display:grid; place-content:center; }
    .lf-remove span::after { content:""; width:10px; height:2px; border-radius:2px; background:#fff; }
    .lf-remove:hover span { background:#e11d48; }
    .slot-floating .lf-name { visibility:hidden; }
    .lf-hint { color:var(--muted); font-size:12.5px; margin-top:18px; }
    .lf-hint[hidden] { display:none; }

    /* ---------- 搜尋列（DX 輸入框樣式：圓角、細框、聚焦時松綠框） ---------- */
    .lf-search { display:flex; align-items:center; gap:10px; height:48px; padding:0 8px 0 16px; margin-top:20px; max-width:520px; border-radius:16px;
      background:var(--surface); border:1px solid var(--border); transition:border-color .15s; }
    html.dark .lf-search { background:rgba(255,255,255,.04); }
    .lf-search:focus-within { border-color:var(--pine); }
    html.dark .lf-search:focus-within { border-color:var(--sage); }
    .lf-search svg { width:18px; height:18px; flex:none; color:var(--muted); }
    .lf-search input { flex:1; min-width:0; height:100%; border:0; outline:none; background:transparent; font-size:15px; color:var(--text); }
    .lf-search input::placeholder { color:var(--muted); opacity:.75; }
    .lf-search input::-webkit-search-cancel-button { display:none; }
    .lf-search button { flex:none; width:32px; height:32px; border:0; border-radius:10px; background:none; color:var(--muted); cursor:pointer; font-size:16px; }
    .lf-search button:hover { background:var(--btn); }
    .lf-search button[hidden] { display:none; }
    .lf-search[hidden] { display:none; }
    .lf-tabbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin:22px 0 24px; }
    @media (max-width:639px) {
      .lf-top > :first-child { flex:1; min-width:0; }
      .lf-title { margin-right:var(--lf-greeting-reserve, 0px); font-size:var(--lf-greeting-size, clamp(24px, 6.6vw, 42px)); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      main { padding-top:10px; }
      .lf-tabbar { margin-top:14px; }
    }
    .lf-tabbar .lf-tabs { margin:0; }
    .lf-add-wrap { position:relative; }
    .lf-add-wrap .lf-menu { width:168px; }

    .lf-tabs .lf-tab-icon { border:0; background:none; padding:8px 12px; border-radius:9999px; color:var(--muted); cursor:pointer; display:inline-flex; align-items:center; }
    .lf-tabs .lf-tab-icon svg { width:16px; height:16px; }
    .lf-tabs .lf-tab-icon[aria-expanded="true"] { background:var(--pine); color:#fff; }
    @media (max-width:430px) { .lf-tabs > button { padding:8px 12px; } .lf-tabs .lf-tab-icon { padding:8px 10px; } .lf-tabbar { gap:8px; } } /* 窄手機：縮小分頁間距 */
    @media (max-width:380px) { .lf-tabs > button { padding:7px 10px; font-size:13px; } .lf-tabs .lf-tab-icon { padding:7px 8px; } .lf-tabbar { gap:6px; } .lf-tabbar .lf-search-btn { width:36px; height:36px; } }
    /* 背景主題 */
    .lf-wall { position:fixed; inset:0; z-index:-1; background:center / cover no-repeat; pointer-events:none; }
    .lf-wall::after { content:''; position:absolute; inset:0; background:var(--bg); opacity:.62; } /* 遮罩：蓋一層底色，上面的東西才突出 */
    /* 有桌布時：分頁框、按鈕改成霧面玻璃，App 名稱加淡淡的光暈，從桌布上浮出來 */
    html.lf-has-wall .lf-tabs, html.lf-has-wall .lf-search-btn, html.lf-has-wall .lf-btn {
      background:color-mix(in srgb, var(--bg) 70%, transparent); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
    html.lf-has-wall .lf-icon { box-shadow:0 6px 16px rgba(0,0,0,.18); }
    html.lf-has-wall .lf-name, html.lf-has-wall .lf-title, html.lf-has-wall .lf-date { text-shadow:0 0 6px var(--bg), 0 0 2px var(--bg); }
    .lf-wall[hidden] { display:none; }
    html.lf-has-wall body { background:transparent; }
    html.lf-has-wall { background:var(--bg); }
    .lf-color-mode { display:flex; gap:8px; }

      background:#1C1C1C; color:#fff; font-size:14px; box-shadow:0 10px 30px rgba(0,0,0,.35); }

  <script>
  window.addEventListener('DOMContentLoaded', function () {
    'use strict';
    // ---------- Firebase（LinFamily 自己的專案） ----------
    const firebaseConfig = {
      apiKey: "AIzaSyBPcURIjgwtEVi_nTaZT569e_nwJb4IsUs",
      authDomain: "linfamily-31cb6.firebaseapp.com",
      projectId: "linfamily-31cb6",
      storageBucket: "linfamily-31cb6.firebasestorage.app",
      messagingSenderId: "299667187224",
      appId: "1:299667187224:web:8df32264698caad761c56d"
    };
    let auth = null, db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth(); db = firebase.firestore();
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
    } catch (err) { console.warn('Firebase 無法啟動', err); }

    // Superuser 固定名單（沿用舊版）
    const SUPERUSERS = ['darren710404@gmail.com', 'darren.lin@twclc.org'];
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const $ = id => document.getElementById(id);
    function toast(msg) {
      document.querySelectorAll('.lf-toast').forEach(t => t.remove());
      const t = document.createElement('div'); t.className = 'lf-toast'; t.setAttribute('role', 'status'); t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
    }

    // ---------- 問候與日期 ----------
    function clock() {
      const now = new Date();
      $('lfDate').textContent = now.toLocaleDateString('zh-TW', { month: 'long', day: 'numeric', weekday: 'long' }) + ' ' +
        String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') + ':' + String(now.getSeconds()).padStart(2, '0');
    }
    clock(); setInterval(clock, 1000);

    // ---------- 登入與權限 ----------
    let user = null, role = '', roleUnsub = null, slots = null;
    const finishAuthWait = auth && window.clcVerseWait?.();
    const isSuper = () => role === 'superuser';
    window.isSuperuser = false;
    let entered = true; // 啟動時有權限就直接進首頁；休眠仍會設為 false
    let waitT = null;
    function goHome() { // 先顯示「沒有 App 圖示」的主畫面，等權限與個人桌面讀到再讓圖示出現
      $('lfWelcome').hidden = true;
      document.documentElement.classList.add('lf-apps-wait');
      clearTimeout(waitT); waitT = setTimeout(appsReady, 3000); // 保險：最多等 3 秒
    }
    window.lfSleep = function () { // 全站設定的「休眠」時間到（clc-sso.js 呼叫）：回到 Welcome，點一下再進
      entered = false; try { sessionStorage.removeItem('linfamily_entered'); sessionStorage.removeItem('lf_cabinet_unlock'); } catch (_) {}
      document.querySelectorAll('dialog[open]').forEach(d => d.close());
      $('lfWelcome').hidden = false;
    };
    function appsReady() { clearTimeout(waitT); document.documentElement.classList.remove('lf-apps-wait'); }
    // 從 DX、Hannah's Studio 等子 App 按 🏠 回來（同一個視窗）：已經進來過，就直接回主畫面，不再停在 Welcome
    let authReady = false;
    try { if (sessionStorage.getItem('linfamily_entered') === '1') { entered = true; } } catch (_) {}
    function applyRole(r) {
      finishAuthWait?.();
      role = r || '';
      window.isSuperuser = role === 'superuser';
      $('lfAuthIcon').textContent = role === 'superuser' ? '👑' : role ? '☰' : '🔐'; // 一般帳號用三條線選單
      $('lfLogoutBtn').textContent = isSuper() ? '🚪 登出管理員' : '🚪 登出帳號';
      $('lfAuthDot').hidden = true; // 不顯示已登入小黃點
      $('lfMenuHead').textContent = role ? `${user.email} · ${role === 'superuser' ? 'Superuser' : role === 'admin' ? 'Admin' : role === 'user' ? 'User（不含 DX、YA、SR）' : 'Viewer（唯讀）'}` : '管理員已登入';
      $('lfUsersItem').hidden = !isSuper();
      // 啟動時已登入且有權限就進首頁；未登入或休眠時顯示 Welcome。
      $('lfWelcome').hidden = !!(role && entered); document.documentElement.classList.remove('lf-pending');
      if (window.lfGreetingRender) window.lfGreetingRender(false);
      if (!role) { appsReady(); applyLook({}); } // 登入失敗或沒權限：回到 Welcome、主題回預設
      try { if (role && entered) sessionStorage.setItem('linfamily_entered', '1'); else if (!role && authReady) sessionStorage.removeItem('linfamily_entered'); } catch (_) {}
      syncAddBtn();
      if (window.lfChatApi) window.lfChatApi.auth(user, role);
      if (role && role !== 'superuser' && window.CLCSSO && window.CLCSSO.blockShare) window.CLCSSO.blockShare(); // 只有 Superuser 的登入會帶到 DX、YA、SR
      if (!role) setMenu(false);
      watchDesk();
      if (slots) { slots.render(); if (isSuper()) seedIfNeeded(); }
    }
    if (!auth) document.documentElement.classList.remove('lf-pending');
    if (auth) auth.onAuthStateChanged(u => {
      authReady = true;
      if (roleUnsub) { roleUnsub(); roleUnsub = null; }
      user = u && u.email && u.emailVerified ? u : null;
      if (!user) return applyRole('');
      const email = user.email.toLowerCase();
      if (SUPERUSERS.includes(email)) return applyRole('superuser');
      roleUnsub = db.collection('admin_users').doc(email).onSnapshot(snap => {
        const d = snap.exists ? snap.data() : null;
        // 強制登出（全站設定 → 權限管理）：記號時間比這台裝置登入的時間新 → 立刻登出
        let loginAt = 0; try { loginAt = Number(localStorage.getItem('linfamily_login_at') || 0); if (!loginAt) { loginAt = Date.now(); localStorage.setItem('linfamily_login_at', String(loginAt)); } } catch (_) {}
        if (d && d.forceLogoutAt && d.forceLogoutAt.toMillis && d.forceLogoutAt.toMillis() > loginAt) {
          toast('管理員已將這個帳號登出'); (window.CLCSSO && window.CLCSSO.logoutAll ? window.CLCSSO.logoutAll() : Promise.resolve()).finally(() => auth.signOut()); return;
        }
        applyRole(d && d.active !== false && ['admin', 'viewer', 'user'].includes(d.role) ? d.role : '');
      }, () => { applyRole(''); toast('無法確認帳號權限，請檢查網路後再試。'); });
    }, err => {
      authReady = true;
      applyRole('');
      toast('無法讀取登入狀態，請點選畫面重試。');
      console.warn('Firebase 登入狀態讀取失敗', err);
    });
    // 掛在 DX04 底下（/lf/）時，LinFamily 是主站：登入後保存 Google 憑證，DX04、YA、SR 打開時自動登入（clc-sso.js）。
    // 需要：DX04、YA、SR 各自的 Firebase「外部專案用戶端 ID 白名單」加上 LinFamily 的 Web client ID。
    let loginBusy = false;
    async function login() {
      if (!auth) return toast('登入服務尚未載入，請重新整理。');
      if (loginBusy) return;
      loginBusy = true;
      const loginTimer = setTimeout(() => toast('登入回應較慢，請檢查網路；若未出現登入視窗，請重新整理。'), 12000);
      try {
        const res = await auth.signInWithPopup((()=>{const p=new firebase.auth.GoogleAuthProvider();p.setCustomParameters({prompt:'select_account'});return p})());
        clearTimeout(loginTimer);
        try { localStorage.setItem('linfamily_login_at', String(Date.now() + 1000)); } catch (_) {} // 登入時間（強制登出用；+1 秒避免和伺服器時間誤差）
        const tok = res.credential && res.credential.idToken;
        const share = () => { if (!window.CLCSSO || !tok) return; if (window.CLCSSO.shareLogin) window.CLCSSO.shareLogin(tok); else window.CLCSSO.saveGoogleIdToken(tok); }; // 同時把 DX、YA、SR 登入成同一個帳號
        const email = res.user.email.toLowerCase();
        if (SUPERUSERS.includes(email)) { share(); return toast('歡迎回來，' + (res.user.displayName || email)); }
        const snap = await db.collection('admin_users').doc(email).get();
        const d = snap.exists ? snap.data() : null;
        if (window.CLCSSO && window.CLCSSO.blockShare) window.CLCSSO.blockShare(); // 跨站登入只給 Superuser：Admin、Viewer、User 都不帶到 DX、YA、SR
        if (!(d && d.active !== false && ['admin', 'viewer', 'user'].includes(d.role))) {
          await auth.signOut(); toast('帳號【' + email + '】沒有權限。');
        } else toast('歡迎，' + (res.user.displayName || email));
      } catch (err) {
        if (!['auth/popup-closed-by-user', 'auth/cancelled-popup-request'].includes(err && err.code)) toast('登入未完成，請確認瀏覽器允許彈出視窗。');
      } finally {
        clearTimeout(loginTimer);
        loginBusy = false;
      }
    }

    const lookKey = () => 'linfamily_look_' + (user ? user.email.toLowerCase() : '');
    function paintLook() {
      const t = THEMES[look.theme] || THEMES.pine, st = document.documentElement.style;
      st.setProperty('--pine', t.pine); st.setProperty('--sage', t.sage); st.setProperty('--cloud', t.cloud);
      const img = look.wall === 'img' && look.wallImg ? 'url("' + look.wallImg + '")' : (WALLS[look.wall] || WALLS.none).css;
      $('lfWall').style.backgroundImage = img || 'none'; $('lfWall').hidden = !img;
      document.documentElement.classList.toggle('lf-has-wall', !!img);
      if ($('lfThemeDialog').open) renderLook();
    }
    function applyLook(d, fromServer) {
      look = { theme: THEMES[d.theme] ? d.theme : 'pine', wall: d.wall === 'img' || WALLS[d.wall] ? d.wall : 'none', wallImg: d.wallImg || '' };
      paintLook();
      if (fromServer) try { localStorage.setItem(lookKey(), JSON.stringify(look)); } catch (_) {}
    }
    async function saveLook(patch) {
      Object.assign(look, patch); paintLook();
      try { localStorage.setItem(lookKey(), JSON.stringify(look)); } catch (_) {}
      if (!db || !user) return;
      try { await db.collection(DESK_COL).doc(user.email.toLowerCase()).set(Object.assign({}, patch, { updatedAt: firebase.firestore.FieldValue.serverTimestamp() }), { merge: true }); $('lfLookMsg').textContent = ''; }
      catch (err) { $('lfLookMsg').textContent = '儲存失敗：' + errText(err); }
    }
    function renderLook() {
      const sw = $('lfSwatches'); sw.textContent = '';
      Object.entries(THEMES).forEach(([k, t]) => {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'lf-swatch'; b.title = t.name; b.setAttribute('aria-label', t.name);
        b.style.background = `linear-gradient(135deg, ${t.pine} 50%, ${t.sage} 50%)`; b.setAttribute('aria-pressed', look.theme === k ? 'true' : 'false');
        b.addEventListener('click', () => saveLook({ theme: k })); sw.append(b);
      });
      const wl = $('lfWalls'); wl.textContent = '';
      const tile = (k, label, bg) => {
        const b = document.createElement('button'); b.type = 'button'; b.title = label; b.setAttribute('aria-label', '桌布：' + label);
        if (bg) b.style.backgroundImage = bg; else b.textContent = label;
        b.setAttribute('aria-pressed', look.wall === k ? 'true' : 'false'); wl.append(b); return b;
      };
      Object.entries(WALLS).forEach(([k, w]) => tile(k, w.name, w.css).addEventListener('click', () => saveLook({ wall: k })));
      if (look.wallImg) tile('img', '我的照片', 'url("' + look.wallImg + '")').addEventListener('click', () => saveLook({ wall: 'img' }));
      tile('upload', '＋ 上傳照片', '').addEventListener('click', () => $('lfWallFile').click());
    }
    // 上傳照片：先在手機上縮小、壓成 JPEG（約 200～500KB），存在自己的資料裡，不用另外的檔案空間
    $('lfWallFile').addEventListener('change', async e => {
      const file = e.target.files && e.target.files[0]; e.target.value = '';
      if (!file) return;
      $('lfLookMsg').textContent = '處理照片中…';
      try {
        const bmp = await createImageBitmap(file);
        let max = 1600, q = 0.72, data = '';
        for (let i = 0; i < 4; i++) {
          const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
          const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
          c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
          data = c.toDataURL('image/jpeg', q);
          if (data.length < 650000) break;
          max = Math.round(max * 0.8); q = Math.max(0.5, q - 0.08);
        }
        $('lfLookMsg').textContent = '';
        await saveLook({ wall: 'img', wallImg: data });
      } catch (err) { $('lfLookMsg').textContent = '這張照片無法使用，請換一張。'; }
    });
    const colorMode = $('lfColorMode');
    function renderColorMode() {
      const mode = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
      colorMode.querySelectorAll('[data-mode]').forEach(button => {
        button.setAttribute('aria-pressed', String(button.dataset.mode === mode));
      });
    }
    colorMode.addEventListener('click', e => {
      const button = e.target.closest('button[data-mode]');
      if (button) setColorMode(button.dataset.mode === 'dark');
    });
    $('lfThemeClose').addEventListener('click', () => $('lfThemeDialog').close());
    if (window.clcDialogBackdropClose) window.clcDialogBackdropClose($('lfThemeDialog'));
    else $('lfThemeDialog').addEventListener('click', e => { if (e.target === $('lfThemeDialog')) $('lfThemeDialog').close(); });


    // ---------- 問候語（照 DX 的做法：依時段、星期隨機一句；LF 是家庭用，語氣生活化、親近） ----------
    (function () {
      const POOLS = {
        early: [ // 05:00–07:59
          "Morning, {n}! Up early today", "Rise and shine, {n} ☀️", "Early start, {n}? Breakfast first",
          "Good morning, {n}. Sleep well?", "Hey {n}, the day's just waking up"
        ],
        morning: [ // 08:00–11:59
          "Good morning, {n}", "Morning, {n}! Had breakfast?", "Hi {n}, have a lovely day",
          "Welcome home, {n}", "Morning, {n}. Coffee or tea?", "Hello {n}, nice to see you"
        ],
        lunch: [ // 12:00–13:59
          "Lunchtime, {n}! What's good today?", "Have you eaten yet, {n}?", "Hi {n}, enjoy your lunch",
          "Time for a bite, {n}", "Hey {n}, don't skip lunch"
        ],
        afternoon: [ // 14:00–17:59
          "Good afternoon, {n}", "Hey {n}, how's your day going?", "Snack time, {n}?",
          "Welcome back, {n}", "Hi {n}, take a little break", "Afternoon, {n}. Time for some tea?"
        ],
        evening: [ // 18:00–21:59
          "Good evening, {n}", "Welcome home, {n}", "What's for dinner, {n}?",
          "Evening, {n}. How was your day?", "Hi {n}, time to relax", "Family time, {n} 🏡"
        ],
        late: [ // 22:00–00:59
          "Still up, {n}?", "Time to get cozy, {n}", "Good night soon, {n}?",
          "Hey {n}, rest well tonight", "Sweet dreams soon, {n} 🌙"
        ],
        night: [ // 01:00–04:59
          "Can't sleep, {n}?", "It's late, {n}. Get some rest", "Hey night owl 🦉",
          "Shh… everyone's asleep, {n}", "Off to bed soon, {n}?"
        ]
      };
      const EXTRA = {
        weekendMorning: ["Happy {d}, {n}!", "Lazy {d} morning, {n}?", "Enjoy your {d}, {n}"],
        weekendAfternoon: ["Any plans this {d}, {n}?", "Enjoy the weekend, {n}"],
        mondayMorning: ["New week, {n}! You've got this"],
        fridayEvening: ["Weekend's here, {n}! 🎉", "Happy Friday night, {n}"],
        sundayEvening: ["Cozy Sunday night, {n}?"]
      };
      const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const slotOf = h => h >= 5 && h < 8 ? 'early' : h < 12 && h >= 8 ? 'morning' : h >= 12 && h < 14 ? 'lunch' : h >= 14 && h < 18 ? 'afternoon' : h >= 18 && h < 22 ? 'evening' : (h >= 22 || h < 1) ? 'late' : 'night';
      function poolFor(now) {
        const slot = slotOf(now.getHours()), day = now.getDay(), wk = day === 0 || day === 6;
        let list = POOLS[slot].slice();
        if ((slot === 'early' || slot === 'morning') && wk) list = list.concat(EXTRA.weekendMorning);
        if ((slot === 'lunch' || slot === 'afternoon') && wk) list = list.concat(EXTRA.weekendAfternoon);
        if ((slot === 'early' || slot === 'morning') && day === 1) list = list.concat(EXTRA.mondayMorning);
        if (slot === 'evening' && day === 5) list = list.concat(EXTRA.fridayEvening);
        if (slot === 'evening' && day === 0) list = list.concat(EXTRA.sundayEvening);
        return { key: slot + day, list, dayName: DAYS[day] };
      }
      const nameOf = () => { const n = user && (user.displayName || '').trim().split(/\s+/)[0]; return n || 'there'; };
      const el = $('lfGreeting'); let curKey = '', curLine = '';
      const mobile = matchMedia('(max-width:639px)');
      const right = document.querySelector('.lf-right');
      function fitGreeting() {
        el.style.removeProperty('--lf-greeting-size'); // 手機、寬螢幕都一樣：問候語不換行，放不下就縮小字
        const reserve = mobile.matches ? Math.max(0, el.parentElement.getBoundingClientRect().right - right.getBoundingClientRect().left + 8) : 0;
        el.style.setProperty('--lf-greeting-reserve', reserve + 'px');
        const available = el.clientWidth;
        const required = el.scrollWidth;
        if (available > 0 && required > available) {
          const size = parseFloat(getComputedStyle(el).fontSize);
          el.style.setProperty('--lf-greeting-size', Math.max(14, size * (available - 1) / required) + 'px');
        }
      }
      const greetingResize = new ResizeObserver(fitGreeting);
      greetingResize.observe(el.parentElement);
      greetingResize.observe(right);
      mobile.addEventListener('change', fitGreeting);
      document.fonts.ready.then(fitGreeting);

      function render(force) {
        const p = poolFor(new Date());
        if (force || p.key !== curKey) { curKey = p.key; curLine = p.list[Math.floor(Math.random() * p.list.length)].replace('{d}', p.dayName); } // 換時段才重抽
        const text = curLine.replace('{n}', nameOf()).replace('Hey there night owl', 'Hey night owl');
        if (el.textContent !== text) {
          el.textContent = text;
          fitGreeting();
        }
      }
      window.lfGreetingRender = render;
      render(true);
      setInterval(() => render(false), 60000);
      document.addEventListener('visibilitychange', () => { if (!document.hidden) render(false); });
    })();

    // ---------- 分頁：主畫面／家庭留言板／App 櫃 ----------
    function onTab(tab) {
      if (tab === 'all' && isSuper() && !cabUnlocked()) { // App 櫃要密碼
        tb.setTab(curTab === 'all' ? 'apps' : curTab, true);
        return askPin(() => { tb.setTab('all', true); if (curTab !== 'all') onTab('all'); });
      }
      curTab = tab; syncAddBtn();
      $('panelApps').hidden = tab !== 'apps'; $('panelFamily').hidden = tab !== 'family'; $('panelAll').hidden = tab !== 'all';
      if (tab === 'all') { renderAll(); clearNews(); }
      if (tab !== 'apps') desk.closeMenu();
      if (window.lfChatApi) { window.lfChatApi.show(tab === 'family'); window.lfChatApi.search(tab === 'family' ? tb.value() : ''); }
      try { history.replaceState(history.state, '', tab === 'apps' ? location.pathname + location.search : '#' + (tab === 'all' ? 'apps' : tab)); } catch (_) {} // 重新整理時停在同一個分頁
    }
    // ---------- 搜尋：符合的 App 保持清楚，其他變淡；Enter 開第一個符合的 App ----------
    // ---------- 搜尋：App ＋ 卡片內容；符合的保持清楚，其他變淡；Enter 開第一個符合的 App ----------
    function applySearch() {
      const q = tb.value();
      if (tb.tab() === 'family') { if (window.lfChatApi) window.lfChatApi.search(q); return []; } // Family：搜聊天內容
      if (q && tb.tab() !== 'apps') tb.setTab('apps', true);
      const hits = desk.search(q);
      $('lfNoResult').hidden = !q || hits.length > 0;
      return hits;
    }
    syncDesk();
  });
  </script>
