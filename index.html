<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>LinFamily APP</title>

  <!-- PWA 設定 -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="LinFamily APP">
  <meta name="theme-color" content="#0E0E0E" id="metaThemeColor">
  <link id="dynamicFavicon" rel="icon" type="image/svg+xml">
  <link id="dynamicAppleIcon" rel="apple-touch-icon">
  <link id="dynamicManifest" rel="manifest">

  <!-- Firebase SDK (與 clc-dx04 相同版本，支援 Google 登入與 Firestore 即時同步) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- 主題預載防閃爍 -->
  <script>
    (function () {
      const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
      function savedTheme() {
        const v = localStorage.getItem('linfamily_pixel_theme');
        return v === 'light' || v === 'dark' ? v : null;
      }
      function applyTheme() {
        const chosen = savedTheme();
        const isDark = chosen ? chosen === 'dark' : systemTheme.matches;
        document.documentElement.classList.toggle('dark', isDark);
        const meta = document.getElementById('metaThemeColor');
        if (meta) meta.setAttribute('content', isDark ? '#0E0E0E' : '#F8F9FA');
      }
      applyTheme();
      systemTheme.addEventListener?.('change', () => { if (!savedTheme()) applyTheme(); });
    })();
  </script>

  <style>
    /* =====================================================================
       Google Pixel Material You (Monochrome 黑白極簡配色)
    ===================================================================== */
    :root {
      --md-bg: #F8F9FA;
      --md-surface: #FFFFFF;
      --md-surface-container: #EFEFEF;
      --md-surface-container-high: #E4E4E7;
      --md-surface-glass: rgba(248, 249, 250, 0.84);
      --md-on-surface: #111111;
      --md-on-surface-variant: #52525B;
      --md-outline: #D4D4D8;
      --md-outline-strong: #111111;
      --md-primary: #111111;
      --md-on-primary: #FFFFFF;
      --md-primary-container: #E4E4E7;
      --md-on-primary-container: #111111;
      --md-danger: #DC2626;
      --md-success: #16A34A;
      --md-warning: #D97706;
      --md-ripple: rgba(17, 17, 17, 0.12);
      --md-elevation-1: 0 1px 3px rgba(0, 0, 0, 0.06), 0 1px 2px rgba(0, 0, 0, 0.04);
      --md-elevation-2: 0 4px 14px rgba(0, 0, 0, 0.08);
      --md-elevation-3: 0 20px 56px rgba(0, 0, 0, 0.22);
    }

    html.dark {
      --md-bg: #0E0E0E;
      --md-surface: #171717;
      --md-surface-container: #222222;
      --md-surface-container-high: #2E2E30;
      --md-surface-glass: rgba(14, 14, 14, 0.84);
      --md-on-surface: #F4F4F5;
      --md-on-surface-variant: #A1A1AA;
      --md-outline: #323236;
      --md-outline-strong: #F4F4F5;
      --md-primary: #F4F4F5;
      --md-on-primary: #111111;
      --md-primary-container: #2E2E30;
      --md-on-primary-container: #F4F4F5;
      --md-danger: #F87171;
      --md-success: #4ADE80;
      --md-warning: #FBBF24;
      --md-ripple: rgba(244, 244, 245, 0.14);
      --md-elevation-1: 0 1px 3px rgba(0, 0, 0, 0.4);
      --md-elevation-2: 0 6px 18px rgba(0, 0, 0, 0.5);
      --md-elevation-3: 0 24px 64px rgba(0, 0, 0, 0.8);
    }

    /* 全面隱藏所有捲軸，保留流暢觸控滑動與捲動 */
    *, *::before, *::after {
      box-sizing: border-box;
      scrollbar-width: none !important;
      -ms-overflow-style: none !important;
      -webkit-tap-highlight-color: transparent;
    }
    *::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
    }

    html {
      font-size: 16.5px;
      font-family: "Google Sans", "Roboto", -apple-system, BlinkMacSystemFont, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      background-color: var(--md-bg);
      color: var(--md-on-surface);
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    /* Material You Ripple 水波紋點擊回饋 */
    .ripple-host {
      position: relative;
      overflow: hidden;
    }
    .md-ripple-wave {
      position: absolute;
      border-radius: 50%;
      background: var(--md-ripple);
      transform: scale(0);
      animation: mdRippleAnim 0.52s cubic-bezier(0.2, 0, 0, 1) forwards;
      pointer-events: none;
    }
    @keyframes mdRippleAnim {
      to { transform: scale(2.8); opacity: 0; }
    }

    /* =====================================================================
       無獨立 Header：極簡懸浮頂部控制列（無任何品牌 Logo，純粹 LinFamily APP 字樣）
    ===================================================================== */
    .pixel-top-bar {
      position: sticky;
      top: 0;
      z-index: 40;
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: calc(12px + env(safe-area-inset-top)) 18px 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      pointer-events: none;
    }
    .pixel-top-bar > * { pointer-events: auto; }

    .wordmark-btn {
      height: 40px;
      padding: 0 16px;
      border-radius: 999px;
      border: 1px solid var(--md-outline);
      background: var(--md-surface-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--md-on-surface);
      font: inherit;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: var(--md-elevation-1);
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      position: relative;
    }

    .m3-chip-btn {
      height: 40px;
      min-width: 40px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--md-outline);
      background: var(--md-surface-glass);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      color: var(--md-on-surface);
      font: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      box-shadow: var(--md-elevation-1);
      transition: background-color 0.16s ease, transform 0.14s ease;
    }
    .m3-chip-btn.icon-only {
      width: 40px;
      padding: 0;
    }
    .m3-chip-btn:hover { background: var(--md-surface-container); }
    .m3-chip-btn:active { transform: scale(0.95); }
    .m3-chip-btn svg { width: 18px; height: 18px; flex: none; }

    .status-indicator {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--md-success);
    }
    .status-indicator.is-viewer { background: var(--md-warning); }

    /* Material You 權限選單卡片 */
    .m3-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      width: 256px;
      padding: 8px;
      border-radius: 24px;
      background: var(--md-surface);
      border: 1px solid var(--md-outline);
      box-shadow: var(--md-elevation-3);
      z-index: 60;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .m3-menu[hidden] { display: none !important; }
    .m3-menu-head {
      padding: 10px 12px 12px;
      border-bottom: 1px solid var(--md-outline);
      margin-bottom: 4px;
    }
    .m3-menu-email {
      font-size: 0.84rem;
      font-weight: 700;
      word-break: break-all;
    }
    .m3-menu-role {
      font-size: 0.75rem;
      color: var(--md-on-surface-variant);
      margin-top: 2px;
    }
    .m3-menu-item {
      width: 100%;
      padding: 11px 14px;
      border: 0;
      border-radius: 16px;
      background: transparent;
      color: var(--md-on-surface);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 11px;
      cursor: pointer;
      text-align: left;
    }
    .m3-menu-item:hover { background: var(--md-surface-container); }
    .m3-menu-item.danger { color: var(--md-danger); }
    .m3-menu-item svg { width: 18px; height: 18px; flex: none; }

    /* =====================================================================
       Google Pixel 主畫面架構
    ===================================================================== */
    .pixel-shell {
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      padding: 10px 20px calc(24px + env(safe-area-inset-bottom));
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    /* Pixel At a Glance 頂部資訊區 */
    .at-a-glance {
      padding: 6px 4px 2px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .glance-date {
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--md-on-surface-variant);
      letter-spacing: 0.01em;
    }
    .glance-title {
      margin: 0;
      font-size: clamp(1.85rem, 4.8vw, 2.45rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      line-height: 1.12;
    }
    .glance-meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-top: 2px;
      font-size: 0.84rem;
      color: var(--md-on-surface-variant);
    }
    .glance-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 11px;
      border-radius: 999px;
      background: var(--md-surface-container);
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--md-on-surface);
    }

    /* Material You 分段切換鈕 (Segmented Button) */
    .m3-segmented {
      display: inline-flex;
      align-self: flex-start;
      border-radius: 999px;
      border: 1px solid var(--md-outline);
      background: var(--md-surface);
      padding: 3px;
      gap: 2px;
    }
    .m3-seg-btn {
      height: 36px;
      padding: 0 18px;
      border-radius: 999px;
      border: 0;
      background: transparent;
      color: var(--md-on-surface-variant);
      font: inherit;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: background-color 0.18s ease, color 0.18s ease;
    }
    .m3-seg-btn.active {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }

    /* 置頂向量平面圖 / 動線圖（於「家庭空間配置」分頁置頂顯示，且深色模式下維持純白高對比） */
    .diagram-card {
      border-radius: 28px;
      background: var(--md-surface);
      border: 1px solid var(--md-outline);
      box-shadow: var(--md-elevation-1);
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .diagram-card[hidden] { display: none; }
    .diagram-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .diagram-title {
      margin: 0;
      font-size: 1rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .diagram-hint {
      font-size: 0.78rem;
      color: var(--md-on-surface-variant);
    }
    /* 特殊保留原則：深色模式切換時，所有平面圖、動線圖、示意圖圖表底色必須維持純白高對比 */
    .diagram-white-board {
      background: #FFFFFF !important;
      color: #111111 !important;
      border-radius: 20px;
      padding: 14px;
      border: 1px solid #E4E4E7;
      overflow: hidden;
    }
    .diagram-white-board svg {
      width: 100%;
      height: auto;
      display: block;
    }
    .svg-hotspot {
      cursor: pointer;
      transition: opacity 0.18s ease;
    }
    .svg-hotspot:hover { opacity: 0.85; }
    .svg-hotspot.is-highlighted rect.zone-box,
    .svg-hotspot.is-highlighted circle.zone-pin {
      stroke: #111111 !important;
      stroke-width: 3.5px !important;
      filter: drop-shadow(0 0 8px rgba(0, 0, 0, 0.28));
    }

    /* Pixel Launcher 頂部拖曳編輯列 */
    .pixel-edit-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 16px;
      border-radius: 999px;
      background: var(--md-primary);
      color: var(--md-on-primary);
      box-shadow: var(--md-elevation-2);
    }
    .pixel-edit-bar[hidden] { display: none; }
    .pixel-edit-bar span {
      font-size: 0.84rem;
      font-weight: 600;
    }
    .pixel-done-btn {
      height: 30px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid currentColor;
      background: transparent;
      color: inherit;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* Pixel Launcher 主畫面圓形 App 網格 */
    .pixel-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 22px 12px;
      padding: 4px 0 8px;
      user-select: none;
      -webkit-user-select: none;
    }
    @media (min-width: 640px) {
      .pixel-grid {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 26px 18px;
      }
    }
    @media (min-width: 860px) {
      .pixel-grid {
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 28px 22px;
      }
    }

    .pixel-cell {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      touch-action: manipulation;
      transition: transform 0.18s ease, opacity 0.18s ease;
    }
    .pixel-cell.is-pressing { transform: scale(0.9); }
    .pixel-cell.reorder-source { opacity: 0.25; }
    .pixel-cell.reorder-target .pixel-circle-icon {
      outline: 3px solid var(--md-outline-strong);
      outline-offset: 4px;
    }

    /* 原生 Android Pixel 圓形圖示 (Adaptive Circle Icon) */
    .pixel-circle-icon {
      position: relative;
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline);
      color: var(--md-on-surface);
      display: grid;
      place-items: center;
      overflow: hidden;
      cursor: pointer;
      text-decoration: none;
      box-shadow: var(--md-elevation-1);
      transition: transform 0.18s cubic-bezier(0.2, 0, 0, 1), background-color 0.18s ease, box-shadow 0.18s ease;
    }
    @media (min-width: 640px) {
      .pixel-circle-icon { width: 68px; height: 68px; }
    }
    .pixel-circle-icon:hover {
      background: var(--md-surface-container-high);
      transform: translateY(-2px);
      box-shadow: var(--md-elevation-2);
    }
    .pixel-circle-icon:active { transform: scale(0.93); }

    /* Monochrome 單色主題圖示風格（Pixel Material You Themed Icons） */
    .pixel-circle-icon.themed-invert {
      background: var(--md-primary);
      color: var(--md-on-primary);
      border-color: var(--md-primary);
    }
    .pixel-circle-icon img {
      width: 58%;
      height: 58%;
      object-fit: contain;
      border-radius: 50%;
      pointer-events: none;
    }
    .pixel-circle-icon svg {
      width: 28px;
      height: 28px;
      pointer-events: none;
    }

    .pixel-app-label {
      width: 100%;
      max-width: 82px;
      font-size: 0.76rem;
      font-weight: 500;
      color: var(--md-on-surface);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
    }

    /* 長按編輯時：右上角 Material 刪除膠囊按鈕 */
    .pixel-remove-btn {
      position: absolute;
      top: -4px;
      right: calc(50% - 38px);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 1.5px solid var(--md-bg);
      background: var(--md-danger);
      color: #FFFFFF;
      display: grid;
      place-items: center;
      cursor: pointer;
      z-index: 5;
      box-shadow: var(--md-elevation-1);
    }
    .pixel-remove-btn svg { width: 13px; height: 13px; }

    /* Pixel Launcher 標誌性「＋」新增捷徑圓形槽位 */
    .pixel-add-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 1.5px dashed var(--md-outline-strong);
      background: transparent;
      color: var(--md-on-surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      opacity: 0.72;
      transition: opacity 0.16s ease, background-color 0.16s ease, transform 0.16s ease;
    }
    @media (min-width: 640px) {
      .pixel-add-circle { width: 68px; height: 68px; }
    }
    .pixel-add-circle:hover {
      opacity: 1;
      background: var(--md-surface-container);
      transform: scale(1.04);
    }
    .pixel-add-circle svg { width: 26px; height: 26px; }

    /* =====================================================================
       Google Pixel 底部搜尋膠囊列 + 應用程式抽屜按鈕 + Extended FAB
    ===================================================================== */
    .pixel-bottom-dock {
      margin-top: auto;
      padding-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .pixel-search-pill-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .pixel-search-pill {
      flex: 1;
      height: 52px;
      padding: 0 16px;
      border-radius: 999px;
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline);
      display: flex;
      align-items: center;
      gap: 12px;
      transition: background-color 0.18s ease, border-color 0.18s ease;
    }
    .pixel-search-pill:focus-within {
      background: var(--md-surface);
      border-color: var(--md-outline-strong);
      box-shadow: var(--md-elevation-2);
    }
    .pixel-search-pill svg {
      width: 20px;
      height: 20px;
      color: var(--md-on-surface-variant);
      flex: none;
    }
    .pixel-search-input {
      flex: 1;
      min-width: 0;
      border: 0;
      background: transparent;
      color: var(--md-on-surface);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .pixel-search-input::placeholder { color: var(--md-on-surface-variant); }

    .drawer-trigger-btn {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: 1px solid var(--md-outline);
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex: none;
      transition: background-color 0.16s ease, transform 0.14s ease;
    }
    .drawer-trigger-btn:hover { background: var(--md-surface-container-high); }
    .drawer-trigger-btn:active { transform: scale(0.94); }
    .drawer-trigger-btn svg { width: 22px; height: 22px; }

    /* Material You Extended FAB（新增 App 捷徑主按鈕） */
    .m3-fab {
      height: 52px;
      padding: 0 20px;
      border-radius: 18px;
      border: 0;
      background: var(--md-primary);
      color: var(--md-on-primary);
      font: inherit;
      font-size: 0.9rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: var(--md-elevation-2);
      flex: none;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }
    .m3-fab:hover { opacity: 0.92; }
    .m3-fab:active { transform: scale(0.95); }
    .m3-fab svg { width: 20px; height: 20px; }

    /* =====================================================================
       Android 15/16 Bottom Sheet 應用程式抽屜 (App Drawer)
    ===================================================================== */
    .bottom-sheet-backdrop {
      position: fixed;
      inset: 0;
      z-index: 90;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.22s ease;
    }
    .bottom-sheet-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .bottom-sheet {
      width: min(100%, 760px);
      max-height: 86dvh;
      border-radius: 28px 28px 0 0;
      background: var(--md-surface);
      border-top: 2px solid var(--md-outline-strong);
      box-shadow: var(--md-elevation-3);
      padding: 12px 20px calc(24px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 16px;
      transform: translateY(100%);
      transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1);
    }
    .bottom-sheet-backdrop.is-open .bottom-sheet {
      transform: translateY(0);
    }
    .sheet-drag-pill {
      width: 36px;
      height: 4px;
      border-radius: 999px;
      background: var(--md-outline);
      margin: 0 auto;
    }
    .drawer-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .drawer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-radius: 18px;
      text-decoration: none;
      color: var(--md-on-surface);
      transition: background-color 0.14s ease;
    }
    .drawer-row:hover { background: var(--md-surface-container); }
    .drawer-row-left {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }
    .drawer-mini-circle {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--md-surface-container);
      border: 1px solid var(--md-outline);
      display: grid;
      place-items: center;
      flex: none;
      overflow: hidden;
    }
    .drawer-mini-circle img { width: 58%; height: 58%; object-fit: contain; }
    .drawer-mini-circle svg { width: 20px; height: 20px; }

    /* =====================================================================
       近全螢幕大尺寸 Pop-up 彈窗（2.5px 粗實線主題色邊框 + 深層立體陰影）
    ===================================================================== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 100;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.is-open {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-dialog {
      width: min(96vw, 680px);
      max-height: 92dvh;
      border-radius: 28px;
      background: var(--md-surface);
      color: var(--md-on-surface);
      border: 2.5px solid var(--md-outline-strong);
      box-shadow: var(--md-elevation-3);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: scale(0.96) translateY(10px);
      transition: transform 0.22s cubic-bezier(0.2, 0, 0, 1);
    }
    .modal-backdrop.is-open .modal-dialog {
      transform: scale(1) translateY(0);
    }
    .modal-dialog.compact { width: min(94vw, 440px); }
    .modal-header {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--md-outline);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .modal-title {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
    }
    .modal-close-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: 1px solid var(--md-outline);
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .modal-body {
      padding: 18px 20px 22px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 一鍵切換多重職責膠囊按鈕 */
    .role-capsule-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-radius: 999px;
      border: 1.5px solid var(--md-outline-strong);
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }
    .role-capsule-btn:hover {
      background: var(--md-primary);
      color: var(--md-on-primary);
    }

    /* Material Outlined Text Field 與按鈕 */
    .m3-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .m3-label {
      font-size: 0.84rem;
      font-weight: 600;
      color: var(--md-on-surface-variant);
    }
    .m3-input, .m3-select {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      border-radius: 14px;
      border: 1.5px solid var(--md-outline);
      background: var(--md-bg);
      color: var(--md-on-surface);
      font: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .m3-input:focus, .m3-select:focus {
      border-color: var(--md-outline-strong);
      background: var(--md-surface);
    }
    .btn-actions {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 4px;
    }
    .m3-btn-tonal {
      height: 42px;
      padding: 0 18px;
      border-radius: 999px;
      border: 0;
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
    }
    .m3-btn-filled {
      height: 42px;
      padding: 0 22px;
      border-radius: 999px;
      border: 0;
      background: var(--md-primary);
      color: var(--md-on-primary);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 700;
      cursor: pointer;
    }
    .m3-btn-danger {
      height: 34px;
      padding: 0 14px;
      border-radius: 999px;
      border: 1px solid var(--md-danger);
      background: transparent;
      color: var(--md-danger);
      font: inherit;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    /* 單色向量圖示選擇器 */
    .icon-grid-picker {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
    }
    .icon-choice {
      aspect-ratio: 1;
      border-radius: 50%;
      border: 1.5px solid var(--md-outline);
      background: var(--md-surface-container);
      color: var(--md-on-surface);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .icon-choice.selected {
      background: var(--md-primary);
      color: var(--md-on-primary);
      border-color: var(--md-primary);
    }
    .icon-choice svg { width: 22px; height: 22px; }

    /* 權限管理成員卡片 */
    .member-card {
      padding: 13px 16px;
      border-radius: 20px;
      border: 1px solid var(--md-outline);
      background: var(--md-bg);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }
    .member-email { font-weight: 700; font-size: 0.92rem; word-break: break-all; }
    .member-meta { font-size: 0.78rem; color: var(--md-on-surface-variant); margin-top: 2px; }
    .mini-pill {
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid var(--md-outline);
      background: var(--md-surface);
      color: var(--md-on-surface);
      font: inherit;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* Android Snackbar 底部通知 */
    .snackbar {
      position: fixed;
      bottom: calc(22px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 200;
      padding: 12px 20px;
      border-radius: 14px;
      background: var(--md-primary);
      color: var(--md-on-primary);
      font-size: 0.86rem;
      font-weight: 600;
      box-shadow: var(--md-elevation-3);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      white-space: nowrap;
    }
    .snackbar.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- 無獨立 Header：極簡懸浮頂部列（無任何品牌 Logo，純粹 LinFamily APP 字樣與右上角控制項） -->

    <!-- Pixel Launcher 編輯模式頂部控制膠囊 -->
    <div id="pixelEditBar" class="pixel-edit-bar" hidden>
      <span>編輯主畫面：拖曳圓形圖示排列順序，點擊可編輯或按 × 移除</span>

    <section aria-label="主畫面應用程式網格">
      <div id="pixelGrid" class="pixel-grid" role="list"></div>

    <!-- Google Pixel 底部搜尋膠囊列 (Pixel Search Pill) + 應用程式抽屜按鈕 + Extended FAB -->
    <div class="pixel-bottom-dock">
      <div class="pixel-search-pill-row">
        <div class="pixel-search-pill">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/>

          <input type="search" id="pixelSearchInput" class="pixel-search-input" placeholder="搜尋您的應用程式與家庭服務…" autocomplete="off">

  <script>
    (function () {
      'use strict';

      /* =====================================================================
         0. Firebase 連線設定（將下方 firebaseConfig 替換為你自己的 Firebase 專案金鑰即可上線）
      ===================================================================== */
      const firebaseConfig = {

      let auth = null;
      let db = null;

        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        auth = firebase.auth();
        db = firebase.firestore();
        auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
      }

      /* =====================================================================

      const MATERIAL_ICONS = {

      /* =====================================================================
         2. 動態生成純黑白幾何 Favicon 與 Android Adaptive 桌面圖示（無蘋果 Logo）
      ===================================================================== */
      function initDynamicAppIcons() {
        const svgMarkup = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
          <rect width="512" height="512" rx="128" fill="#111111"/>
          <circle cx="256" cy="256" r="184" fill="none" stroke="#F4F4F5" stroke-width="22"/>
          <text x="256" y="286" text-anchor="middle" fill="#F4F4F5" font-family="Arial, sans-serif" font-size="138" font-weight="700" letter-spacing="-4">LF</text>
        </svg>`;
        const svgUrl = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgMarkup);
        const fav = document.getElementById('dynamicFavicon');
        if (fav) fav.href = svgUrl;

        const canvas = document.createElement('canvas');
        canvas.width = 512;
        canvas.height = 512;
        const ctx = canvas.getContext('2d');
        const img = new Image();
        img.onload = () => {
          ctx.drawImage(img, 0, 0, 512, 512);
          const pngUrl = canvas.toDataURL('image/png');
          const appleIcon = document.getElementById('dynamicAppleIcon');
          if (appleIcon) appleIcon.href = pngUrl;

          const manifest = {
            name: 'LinFamily APP',
            short_name: 'LinFamily',
            start_url: './',
            display: 'standalone',
            background_color: '#0E0E0E',
            theme_color: '#111111',
            icons: [
              { src: pngUrl, sizes: '512x512', type: 'image/png', purpose: 'any maskable' }
            ]
          };
          const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
          const manifestEl = document.getElementById('dynamicManifest');
          if (manifestEl) manifestEl.href = URL.createObjectURL(blob);
        };
        img.src = svgUrl;
      }
      initDynamicAppIcons();

      /* =====================================================================
         3. Material You 水波紋點擊效果 (Ripple Feedback)
      ===================================================================== */
      document.addEventListener('pointerdown', e => {
        const host = e.target.closest('.ripple-host');
        if (!host) return;
        const rect = host.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        const wave = document.createElement('span');
        wave.className = 'md-ripple-wave';
        wave.style.width = wave.style.height = size + 'px';
        wave.style.left = (e.clientX - rect.left - size / 2) + 'px';
        wave.style.top = (e.clientY - rect.top - size / 2) + 'px';
        host.appendChild(wave);
        setTimeout(() => wave.remove(), 550);
      });

      /* =====================================================================
         4. 權限與資料狀態管理（對齊 clc-dx04 Superuser / Admin / Viewer 模型）
      ===================================================================== */
      const STORAGE_APPS_KEY = 'linfamily_pixel_apps_v1';
      const STORAGE_AUTH_KEY = 'linfamily_pixel_auth_v1';
      const STORAGE_USERS_KEY = 'linfamily_pixel_users_v1';

      const SUPERUSERS = [
        'darren710404@gmail.com',
        'darren.lin@twclc.org'
      ];

      const DEFAULT_APPS = [
        {
          id: 'app-photos',
          name: '家庭相簿',
          url: 'https://photos.google.com',
          preset: 'photos',
          iconUrl: '',
          themedInvert: true,
          category: 'apps',
          zoneId: 'zone-living',
          rolePrimary: '生活紀錄：全家人出遊照片、影片自動備份與共享相簿牆',
          roleSecondary: '空間設備：客廳電視待機畫面輪播與家庭劇院投影同步'
        },
        {
          id: 'app-calendar',
          name: '家庭行事曆',
          url: 'https://calendar.google.com',
          preset: 'calendar',
          iconUrl: '',
          themedInvert: false,
          category: 'apps',
          zoneId: 'zone-life',
          rolePrimary: '生活紀錄：家庭聚餐、孩子課表、紀念日與重要預約提醒',
          roleSecondary: '空間設備：餐廚區共享平板看板每日自動同步排程'
        },
        {
          id: 'app-home',
          name: '智慧家庭',
          url: 'https://home.google.com',
          preset: 'home',
          iconUrl: '',
          themedInvert: true,
          category: 'apps',
          zoneId: 'zone-entry',
          rolePrimary: '空間設備：玄關智慧門鎖、客廳燈光場景與冷氣遠端控制',
          roleSecondary: '生活紀錄：家人回家自動解鎖紀錄與離家節能自動化排程'
        },
        {
          id: 'app-cloud',
          name: 'LinFamily 雲端',
          url: 'https://drive.google.com',
          preset: 'cloud',
          iconUrl: '',
          themedInvert: false,
          category: 'apps',
          zoneId: 'zone-cloud',
          rolePrimary: '空間設備：書房私有雲 NAS 檔案存取、重要證件與保單歸檔',
          roleSecondary: '生活紀錄：跨裝置家庭文件協作與相片原檔異地備份'
        },
        {
          id: 'app-notes',
          name: '採買與備忘',
          url: 'https://keep.google.com',
          preset: 'notes',
          iconUrl: '',
          themedInvert: false,
          category: 'family',
          zoneId: 'zone-life',
          rolePrimary: '生活紀錄：冰箱常備食材清單、日常採買與家務分工備忘',
          roleSecondary: '空間設備：餐廚生活共享區即時同步勾選進度'
        },
        {
          id: 'app-finance',
          name: '家庭帳本',
          url: 'https://docs.google.com/spreadsheets',
          preset: 'finance',
          iconUrl: '',
          themedInvert: true,
          category: 'family',
          zoneId: 'zone-life',
          rolePrimary: '生活紀錄：每月水電瓦斯固定支出、家庭旅遊基金與預算表',
          roleSecondary: '空間設備：書房財務報表定期歸檔至 LinFamily 雲端'
        },
        {
          id: 'app-security',
          name: '門禁監視器',
          url: 'https://home.google.com',
          preset: 'security',
          iconUrl: '',
          themedInvert: false,
          category: 'family',
          zoneId: 'zone-entry',
          rolePrimary: '空間設備：大門口與車庫即時監視器畫面、異常移動警報',
          roleSecondary: '生活紀錄：訪客按鈴雙向通話與包裹送達影像存證'
        },
        {
          id: 'app-map',
          name: '家人定位',
          url: 'https://www.google.com/maps',
          preset: 'map',
          iconUrl: '',
          themedInvert: true,
          category: 'family',
          zoneId: 'zone-entry',
          rolePrimary: '生活紀錄：家人即時安全位置分享與通勤抵達通知',
          roleSecondary: '空間設備：遺失裝置尋找與家庭群組位置共享中心'
        }
      ];

      let apps = [];
      try {
        const raw = JSON.parse(localStorage.getItem(STORAGE_APPS_KEY) || 'null');
        apps = Array.isArray(raw) && raw.length ? raw : structuredClone(DEFAULT_APPS);
      } catch (_) {
        apps = structuredClone(DEFAULT_APPS);
      }

      let adminUsers = [];
      try {
        const rawUsers = JSON.parse(localStorage.getItem(STORAGE_USERS_KEY) || 'null');
        adminUsers = Array.isArray(rawUsers) ? rawUsers : [];
      } catch (_) {
        adminUsers = [];
      }

      let session = null;
      try {
        if (!isFirebaseConfigured) {
          session = JSON.parse(localStorage.getItem(STORAGE_AUTH_KEY) || 'null');
        }
      } catch (_) {
        session = null;
      }

      let activeTab = 'apps';
      let searchQuery = '';
      let isEditing = false;
      let editingAppId = null;
      let selectedPreset = 'link';

      function saveLocalApps() {
        try { localStorage.setItem(STORAGE_APPS_KEY, JSON.stringify(apps)); } catch (_) {}
      }
      function saveLocalUsers() {
        try { localStorage.setItem(STORAGE_USERS_KEY, JSON.stringify(adminUsers)); } catch (_) {}
      }
      function saveLocalSession() {
        try {
          if (session) localStorage.setItem(STORAGE_AUTH_KEY, JSON.stringify(session));
          else localStorage.removeItem(STORAGE_AUTH_KEY);
        } catch (_) {}
      }

      // 儲存 App 清單（若已連接 Firebase 則同步寫入 Firestore linfamily_settings/apps）
      async function persistApps() {
        saveLocalApps();
        if (isFirebaseConfigured && db && canEditApps()) {
          try {
            await db.collection('linfamily_settings').doc('apps').set({
              items: apps,
              updatedAt: firebase.firestore.FieldValue.serverTimestamp(),
              updatedBy: session ? session.email : ''
            });
          } catch (err) {
            console.warn('Firestore 寫入失敗：', err);
            showSnackbar('雲端同步失敗：' + (err.code === 'permission-denied' ? '權限不足，請確認已發布 firestore.rules' : err.message));
          }
        }
      }

      function getRoleForEmail(email) {
        const clean = String(email || '').trim().toLowerCase();
        if (!clean) return null;
        if (SUPERUSERS.includes(clean)) return 'superuser';
        const found = adminUsers.find(u => u.email.toLowerCase() === clean);
        if (found && found.active !== false) return found.role === 'viewer' ? 'viewer' : 'admin';
        return null;
      }

      function canEditApps() {
        if (!session) return false;
        const role = getRoleForEmail(session.email);
        return role === 'superuser' || role === 'admin';
      }

      /* =====================================================================
         5. Firebase 即時監聽（Google 登入狀態 + Firestore 雲端清單 + 管理員名單）
      ===================================================================== */
      const syncBadgeEl = document.getElementById('glanceSyncBadge');
      if (isFirebaseConfigured && auth && db) {
        syncBadgeEl.textContent = 'Firebase 雲端已連線';

        // 監聽 Google 登入狀態
        let userRoleUnsub = null;
        auth.onAuthStateChanged(user => {
          if (userRoleUnsub) { userRoleUnsub(); userRoleUnsub = null; }
          if (!user || !user.email || !user.emailVerified) {
            session = null;
            syncAuthUI();
            return;
          }
          const email = user.email.toLowerCase().trim();
          if (SUPERUSERS.includes(email)) {
            session = { email, loginAt: Date.now() };
            syncAuthUI();
            return;
          }
          // 動態查詢 Firestore admin_users/{email}
          userRoleUnsub = db.collection('admin_users').doc(email).onSnapshot(snap => {
            const data = snap.exists ? snap.data() : null;
            if (data && (data.role === 'admin' || data.role === 'viewer') && data.active !== false) {
              if (!adminUsers.some(u => u.email === email)) {
