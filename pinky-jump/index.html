<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>粉紅魔法貓跑酷 | Pink Cat Jump</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 橫屏提示遮罩 (手機直向時顯示) -->
  <div id="rotate-overlay" class="overlay hidden">
    <div class="rotate-card">
      <div class="phone-icon">📱</div>
      <h2>請將手機轉為橫向</h2>
      <p>橫向全螢幕遊玩體驗最佳！</p>
      <button id="force-fullscreen-btn" class="btn-primary">切換橫向全螢幕</button>
    </div>
  </div>

  <!-- 遊戲主容器 -->
  <div id="game-wrapper">
    <!-- 頂部控制列 -->
    <div id="hud">
      <div class="hud-left">
        <span class="badge-title">✨ 粉紅魔法貓跑酷</span>
        <button id="fullscreen-btn" class="icon-btn" title="切換全螢幕">⛶ 全螢幕</button>
        <button id="mute-btn" class="icon-btn" title="音效開關">🔊</button>
      </div>
      <div class="hud-right">
        <div class="score-box">
          <span class="label">HI</span>
          <span id="hi-score">00000</span>
        </div>
        <div class="score-box current">
          <span class="label">SCORE</span>
          <span id="current-score">00000</span>
        </div>
      </div>
    </div>

    <!-- 遊戲畫布 -->
    <canvas id="game-canvas"></canvas>

    <!-- 開始 / 結束 互動提示面板 -->
    <div id="ui-overlay" class="ui-overlay">
      <div id="start-panel" class="panel">
        <h1>粉紅魔法貓衝刺！</h1>
        <p class="subtitle">閃避毛線球仙人掌與飛天鈴鐺鳥，收集金色魔法幣！</p>
        <div class="controls-hint">
          <span>💻 電腦：<b>空白鍵 / ↑</b> 跳躍、<b>↓</b> 蹲下</span>
          <span>📱 手機：<b>點擊左側/螢幕</b> 跳躍、<b>長按右側</b> 蹲下</span>
        </div>
        <button id="start-btn" class="btn-primary pulse">開始奔跑 ▶</button>
      </div>

      <div id="gameover-panel" class="panel hidden">
        <h2 class="gameover-title">哎呀！撞到了！</h2>
        <p class="final-score-text">本次得分：<span id="final-score">0</span></p>
        <p id="new-record-badge" class="new-record hidden">🎉 刷新最高紀錄！</p>
        <button id="restart-btn" class="btn-primary">再玩一次 ↻</button>
      </div>
    </div>

    <!-- 手機觸控輔助按鈕 (觸控裝置顯示) -->
    <div id="touch-controls" class="touch-controls">
      <div id="touch-jump" class="touch-zone left-zone" aria-label="跳躍">
        <span>▲ 跳躍</span>
      </div>
      <div id="touch-duck" class="touch-zone right-zone" aria-label="蹲下">
        <span>▼ 蹲下</span>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
