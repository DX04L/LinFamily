<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f760a6">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="pinky-icon.png">
<link rel="apple-touch-icon" href="pinky-icon.png">
<link rel="stylesheet" href="pinky-arcade.css?v=1">
<title>Pinky Jump｜手機體感控制器</title>
</head>
<body data-pinky-page="controller" class="pinky-controller-body">
<main class="pinky-controller">
  <a class="pinky-back" href="./">‹ 返回 Pinky Jump</a>
  <img src="pinky-icon.png" class="pinky-controller-icon" alt="Pinky Jump">
  <h1>🎮 Pinky Jump 控制器</h1>
  <p class="pinky-muted">把手機變成 Pinky 的體感搖桿！</p>
  <section class="pinky-controller-card">
    <label for="controller-room-input">電腦畫面的 6 碼配對碼</label>
    <input id="controller-room-input" type="text" maxlength="6" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="例如 A3K6M8" inputmode="text">
    <button id="controller-connect" class="pinky-primary" type="button">連接電腦</button>
    <p id="controller-status" role="status" class="pinky-status">輸入電腦顯示的代碼，再按連接。</p>
  </section>
  <section id="controller-actions" class="pinky-controller-card" hidden>
    <button id="controller-start-game" class="pinky-light" type="button">▶ 電腦開始遊戲</button>
    <button id="controller-jump" class="pinky-big-jump" type="button" aria-label="跳躍；按住較久跳得較高">⬆<span>跳躍測試</span><small>按住越久，跳得越高</small></button>
    <div class="pinky-power">最近一次跳躍強度：<strong id="controller-last-power">—</strong></div>
  </section>
  <section id="controller-sensor" class="pinky-controller-card" hidden>
    <h2>📱 體感跳躍</h2>
    <p class="pinky-muted">點「啟用動作感應」，穩住手機約 1 秒後，輕輕向上抬起手機測試。</p>
    <button id="controller-activate-sensor" class="pinky-primary" type="button">啟用動作感應</button>
    <div class="pinky-sensor-row">
      <label for="controller-sensitivity">靈敏度</label>
      <select id="controller-sensitivity"><option value="low">低</option><option value="normal" selected>標準</option><option value="high">高</option></select>
      <button id="controller-calibrate" class="pinky-light" type="button">重新校準</button>
    </div>
    <div class="pinky-meter"><div id="controller-meter-fill"></div></div>
    <p class="pinky-small">注意安全：不需要真的跳高，向上輕抬就能測試。避免甩動或拋接手機。</p>
  </section>
  <p class="pinky-footnote">測試版使用 Firebase 配對。跨裝置需要啟用匿名登入及遊戲專用 Firestore 規則；未啟用時，同一瀏覽器兩個分頁仍可測試手動控制。</p>
</main>
<script defer src="pinky-online.js?v=1"></script>
</body>
</html>
