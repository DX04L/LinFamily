<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>Pinky Jump｜粉紅魔法貓跳跳冒險</title>
  <meta name="theme-color" content="#f760a6" />
  <meta name="description" content="Pinky Jump：輕點小跳、按住跳更高，翻越山峰、穿越雲朵、收集星星與愛心！" />
  <link rel="icon" type="image/png" href="pinky-icon.png" />
  <link rel="apple-touch-icon" href="pinky-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="install.css?v=1" />
  <!-- LF/DX 規格：先接住瀏覽器可能提前送出的安裝事件 -->
  <script>window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();window.__pinkyBIP=e;});</script>
  <script defer src="install.js?v=1"></script>
</head>
<body>
  <!-- 橫屏提示遮罩 (手機直向時顯示) -->
  <div id="rotate-overlay" class="overlay hidden">
    <div class="rotate-card">
      <div class="phone-icon">📱</div>
      <h2>Pinky Jump</h2>
      <p>橫向全螢幕遊玩體驗最佳！</p>
      <button id="force-fullscreen-btn" class="btn-primary">切換橫向全螢幕</button>
    </div>
  </div>

  <!-- 遊戲主容器 -->
  <div id="game-wrapper">
    <!-- 頂部控制列 -->
    <div id="hud">
      <div class="hud-left">
        <span class="badge-title"><img src="pinky-icon.png" alt="" /> Pinky Jump</span>
        <button type="button" id="pinky-install-btn" class="icon-btn" title="安裝 Pinky Jump 到桌面" hidden>📲 安裝</button>
        <button id="fullscreen-btn" class="icon-btn" title="切換全螢幕">⛶ 全螢幕</button>
        <button id="mute-btn" class="icon-btn" title="背景音樂與音效開關">🔊</button>
      </div>
      <div class="hud-right">
        <div class="score-box">
          <span class="label">HI</span>
          <span id="hi-score">00000</span>
        </div>
        <div class="score-box current">
          <span class="label">SCORE</span>
          <span id="current-score">00000</span>
        </div>
        <div class="score-box shield-box"><span>💗</span><span id="shield-count">0</span></div>
      </div>
    </div>

    <!-- 遊戲畫布 -->
    <canvas id="game-canvas"></canvas>

    <!-- 開始 / 結束 互動提示面板 -->
    <div id="ui-overlay" class="ui-overlay">
      <div id="start-panel" class="panel">
        <img class="start-mascot" src="pinky-icon.png" alt="Pinky Jump 主角" />
        <h1>Pinky Jump！</h1>
        <p class="subtitle">跨越山峰、穿越棉花雲，閃避飛機與小鳥！收集金幣 🪙、星星 ⭐、愛心護盾 💗</p>
        <div class="controls-hint">
          <span>👆 輕點小跳、按住跳更高（電腦也可以按空白鍵）</span>
        </div>
        <button id="start-btn" class="btn-primary pulse">開始奔跑 ▶</button>
      </div>

      <div id="gameover-panel" class="panel hidden">
        <h2 class="gameover-title">哎呀！撞到了！</h2>
        <p class="final-score-text">本次得分：<span id="final-score">0</span></p>
        <p id="new-record-badge" class="new-record hidden">🎉 刷新最高紀錄！</p>
        <button id="restart-btn" class="btn-primary">再玩一次 ↻</button>
      </div>
    </div>

  </div>

  <dialog id="pinky-install-dialog" class="pinky-install-dialog" aria-labelledby="pinky-install-title">
    <h2 id="pinky-install-title">安裝 Pinky Jump</h2>
    <p id="pinky-install-reason">目前瀏覽器未提供直接安裝提示。</p>
    <ol id="pinky-install-steps"></ol>
    <p class="pinky-install-hint">若已經安裝，請從桌面或應用程式清單開啟 Pinky Jump。</p>
    <div class="pinky-install-actions"><button type="button" id="pinky-install-close">知道了</button></div>
  </dialog>
  <script src="game.js?v=20261122-big-hills-music"></script>
</body>
</html>
