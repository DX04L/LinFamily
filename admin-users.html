<!DOCTYPE html>
<html lang="zh-TW" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>權限管理 · LinFamily</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="favicon.png?v=3">
  <meta name="theme-color" content="#161716" id="metaThemeColor">
  <script>
    (function () {
      var v = null; try { v = localStorage.getItem('linfamily_theme') || localStorage.getItem('linfamily_pixel_theme'); } catch (_) {}
      var dark = v ? v === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.classList.toggle('dark', dark);
      document.getElementById('metaThemeColor').setAttribute('content', dark ? '#161716' : '#E6E7E9');
    })();
  </script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    /* 字型與 DX 相同：英文 Arial（粗體用 Arial Bold）、中文微軟正黑體 */
    @font-face { font-family:"CLC Arial"; src:local("Arial"),local("ArialMT"); font-weight:100 549; }
    @font-face { font-family:"CLC Arial"; src:local("Arial Bold"),local("Arial-BoldMT"); font-weight:550 1000; }

    /* 色系：墨黑 #1C1C1C、松綠 #4E8B7E、鼠尾草綠 #8FBFB0、奶油米 #EADFC8、淺灰 #E6E7E9（底色） */
    :root {
      --ink:#1C1C1C; --pine:#4E8B7E; --sage:#8FBFB0; --cream:#EADFC8; --cloud:#E6E7E9;
      --teal:var(--pine);
      --bg:var(--cloud); --surface:#FFFFFF; --text:var(--ink); --muted:#5E6B67;
      --border:rgba(28,28,28,.12); --btn:rgba(28,28,28,.06); --btn-h:rgba(28,28,28,.11);
      --shadow:0 18px 40px rgba(28,28,28,.16);
    }
    html.dark {
      --teal:var(--sage);
      --bg:#161716; --surface:#161924; --text:#F1F1EF; --muted:#A8B5B0;
      --border:rgba(255,255,255,.1); --btn:rgba(255,255,255,.05); --btn-h:rgba(255,255,255,.1);
      --shadow:0 20px 45px rgba(0,0,0,.55);
      color-scheme:dark;
    }
    * { box-sizing:border-box; }
    html, body { margin:0; }
    body {
      min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
      background:var(--bg); color:var(--text);
      font-family:"CLC Arial", Arial, "Microsoft JhengHei", "微軟正黑體", "PingFang TC", "Noto Sans TC", sans-serif;
      -webkit-font-smoothing:antialiased; transition:background-color .3s, color .3s;
    }
    button, input, select { font:inherit; color:inherit; }
    /* 版面與字體大小照 DX 的 admin-users.html（基準 15px） */
    html { font-size:15px; }
    main { width:100%; max-width:48rem; margin:0 auto; padding:calc(1.75rem + env(safe-area-inset-top)) 1rem 1.75rem; display:flex; flex-direction:column; gap:1.25rem; }
    .lf-back { align-self:flex-start; text-decoration:none; font-weight:700; font-size:.875rem; color:var(--teal); margin-bottom:-.5rem; }
    h1 { margin:0; font-size:1.25rem; line-height:1.75rem; font-weight:800; }
    .lf-note { color:var(--muted); font-size:.875rem; line-height:1.25rem; margin:0; }
    .lf-box { border:1px solid var(--border); border-radius:.75rem; padding:1rem; font-size:.875rem; }
    #lfBody { display:flex; flex-direction:column; gap:1.25rem; }
    .lf-card { background:var(--surface); border:1px solid var(--border); border-radius:.75rem; padding:1rem; }
    .lf-card h2 { margin:0; font-size:1rem; font-weight:700; }
    form.lf-card > * + * { margin-top:.75rem; }
    label { display:block; font-size:.875rem; }
    .field { display:block; width:100%; margin-top:.25rem; padding:11px; border-radius:10px; background:var(--surface); border:1px solid var(--border); outline:none; font-size:1rem; }
    html.dark .field { background:#161924; border-color:#334155; }
    .field:focus { border-color:var(--teal); }
    .lf-primary { padding:10px 17px; border-radius:10px; font-weight:700; border:0; cursor:pointer; background:var(--pine); color:#fff; font-size:1rem; }
    .lf-head { display:flex; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom:.75rem; }
    .lf-count { font-size:.75rem; color:var(--muted); }
    .lf-users { display:flex; flex-direction:column; gap:.5rem; font-size:.875rem; }
    .lf-row { border:1px solid var(--border); border-radius:.75rem; padding:.75rem; display:flex; flex-direction:column; gap:.75rem; }
    @media (min-width:640px) { .lf-row { flex-direction:row; align-items:center; justify-content:space-between; } .lf-btns { justify-content:flex-end; } }
    .lf-row .lf-email { font-weight:600; word-break:break-all; }
    .lf-row .lf-sub { font-size:.75rem; color:var(--muted); margin-top:.25rem; }
    .lf-btns { display:flex; flex-wrap:wrap; align-items:center; gap:.5rem; }
    .lf-btns button { border:1px solid var(--border); background:none; border-radius:.375rem; padding:.375rem .625rem; font-size:.75rem; cursor:pointer; color:var(--teal); }
    .lf-btns button.lf-del, .lf-btns button.lf-off { color:#E0525E; }
    .lf-btns button.lf-del { border-color:rgba(224,82,94,.5); }
    .lf-btns button.lf-on { color:#34A37A; }
    .lf-err { color:#E0525E; font-size:.875rem; margin:0; }
    [hidden] { display:none !important; }
  </style>
</head>
<body>
  <main>
    <a class="lf-back" id="lfBack" href="./">‹ 返回</a>
    <script>(function(){var b=new URLSearchParams(location.search).get('back');if(b&&/^[\w\/.-]+$/.test(b)&&b.indexOf('..')<0)document.getElementById('lfBack').href=b;})();</script>
    <h1>👤 權限管理</h1>
    <p class="lf-note">Superuser 為固定名單（寫在程式裡）。Admin 可登入；Viewer 唯讀；User 可登入 LinFamily，但不能開 DX（含 YA、SR），登入也不會帶過去。編輯 App 只限 Superuser。新增者需使用相同 Google Email 登入。</p>
    <div class="lf-box" id="lfGate">確認登入中…</div>
    <div id="lfBody" hidden>
      <form class="lf-card" id="lfUserAdd">
        <h2>新增成員</h2>
        <label>Google 帳號 Email<input class="field" id="lfUserEmail" type="email" placeholder="name@example.com" autocomplete="off"></label>
        <label>權限等級<select class="field" id="lfUserRole"><option value="admin">Admin（可登入）</option><option value="viewer">Viewer（唯讀）</option><option value="user">User（不含 DX、YA、SR）</option></select></label>
        <button type="submit" class="lf-primary">新增成員</button>
      </form>
      <section class="lf-card">
        <div class="lf-head"><h2>成員名單</h2><span class="lf-count" id="lfUsersCount"></span></div>
        <div class="lf-users" id="lfUsersList"><div class="lf-note">讀取中…</div></div>
      </section>
      <p class="lf-err" id="lfUsersErr" hidden></p>
    </div>
  </main>
  <script>
  (function () {
    const firebaseConfig = {
      apiKey: "AIzaSyBPcURIjgwtEVi_nTaZT569e_nwJb4IsUs",
      authDomain: "linfamily-31cb6.firebaseapp.com",
      projectId: "linfamily-31cb6",
      storageBucket: "linfamily-31cb6.firebasestorage.app",
      messagingSenderId: "299667187224",
      appId: "1:299667187224:web:8df32264698caad761c56d"
    };
    let auth = null, db = null;
    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      auth = firebase.auth(); db = firebase.firestore();
      auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(() => {});
    } catch (err) { console.warn('Firebase 無法啟動', err); }

    // Superuser 固定名單（沿用舊版）
    const SUPERUSERS = ['darren710404@gmail.com', 'darren.lin@twclc.org'];
    const ROLE_NAME = { admin: 'Admin', viewer: 'Viewer（唯讀）', user: 'User（不含 DX、YA、SR）' };
    const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const $ = id => document.getElementById(id);
    const errText = err => err && err.code === 'permission-denied' ? '權限不足（請確認已用 Superuser 登入，以及 Firestore 規則）。' : '請稍後再試。';
    if (!auth) { $('lfGate').textContent = '登入服務尚未載入，請重新整理。'; return; }
    auth.onAuthStateChanged(u => {
      const ok = !!(u && u.email && u.emailVerified && SUPERUSERS.includes(u.email.toLowerCase()));
      $('lfGate').textContent = ok ? '' : '只有 Superuser 可以使用這一頁，請先回 LinFamily 登入。';
      $('lfGate').hidden = ok; $('lfBody').hidden = !ok;
      if (ok) loadUsers();
    });
    function usersErr(msg) { $('lfUsersErr').textContent = msg; $('lfUsersErr').hidden = !msg; }
    async function loadUsers() {
      const list = $('lfUsersList');
      try {
        const snap = await db.collection('admin_users').get();
        const rows = snap.docs.map(d => Object.assign({ email: d.id }, d.data())).sort((a, b) => a.email.localeCompare(b.email));
        const all = SUPERUSERS.map(email => ({ email, sup: true })).concat(rows.filter(u => !SUPERUSERS.includes(u.email)));
        $('lfUsersCount').textContent = all.length + ' 位成員';
        list.innerHTML = all.map(u => u.sup
          ? `<div class="lf-row"><div><div class="lf-email">${esc(u.email)}</div><div class="lf-sub">🔒 Superuser · 永久保留（不可刪除、不可降權）</div></div></div>`
          : `<div class="lf-row" data-email="${esc(u.email)}"><div><div class="lf-email">${esc(u.email)}</div>
          <div class="lf-sub">${ROLE_NAME[u.role] || 'Admin'} · ${u.active === false ? '已停用' : '已啟用'}</div></div>
          <div class="lf-btns"><select data-u="role" class="field" style="width:auto;margin:0" aria-label="權限等級">${Object.keys(ROLE_NAME).map(r => `<option value="${r}"${(ROLE_NAME[u.role] ? u.role : 'admin') === r ? ' selected' : ''}>${r === 'admin' ? 'Admin' : r === 'viewer' ? 'Viewer' : 'User'}</option>`).join('')}</select>
          <button type="button" data-u="active" data-active="${u.active === false ? '0' : '1'}" class="${u.active === false ? 'lf-on' : 'lf-off'}">${u.active === false ? '啟用' : '停用'}</button>
          <button type="button" data-u="del" class="lf-del">刪除</button></div></div>`).join('');
        usersErr('');
      } catch (err) { list.innerHTML = ''; usersErr('讀取失敗：' + errText(err)); }
    }
    $('lfUsersList').addEventListener('click', async e => {
      const b = e.target.closest('button[data-u]'); if (!b) return;
      const email = b.closest('[data-email]').dataset.email, ref = db.collection('admin_users').doc(email);
      try {
        if (b.dataset.u === 'del') { if (!confirm('刪除 ' + email + '？')) return; await ref.delete(); }
        else await ref.update({ active: b.dataset.active !== '1', updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        loadUsers();
      } catch (err) { usersErr('更新失敗：' + errText(err)); }
    });
    $('lfUsersList').addEventListener('change', async e => {
      const s = e.target.closest('select[data-u="role"]'); if (!s) return;
      try { await db.collection('admin_users').doc(s.closest('[data-email]').dataset.email).update({ role: s.value, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); loadUsers(); }
      catch (err) { usersErr('更新失敗：' + errText(err)); loadUsers(); }
    });
    $('lfUserAdd').addEventListener('submit', async e => {
      e.preventDefault();
      const email = $('lfUserEmail').value.trim().toLowerCase();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email) || SUPERUSERS.includes(email)) return usersErr('Email 格式不正確，或已是 Superuser。');
      try {
        await db.collection('admin_users').doc(email).set({ role: $('lfUserRole').value, active: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        $('lfUserEmail').value = ''; loadUsers();
      } catch (err) { usersErr('加入失敗：' + errText(err)); }
    });
  })();
  </script>
</body>
</html>
