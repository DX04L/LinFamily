<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="64x64" href="favicon.png">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>不要怕！森林大霧</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #161412;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans TC", sans-serif;
    }

    #reader-stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      overflow: hidden;
      touch-action: none;
    }

    #book-shell {
      position: relative;
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.72), 0 4px 16px rgba(0, 0, 0, 0.5);
      border-radius: 4px;
      background: #fdfbf7;
      will-change: transform;
      transform-origin: center center;
    }

    canvas#book-canvas {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 4px;
      touch-action: none;
      cursor: grab;
    }

    canvas#book-canvas:active {
      cursor: grabbing;
    }

    /* 右上角折疊式燕尾緞帶書籤 */
    #bookmark-ribbon {
      position: absolute;
      top: -2px;
      right: 22px;
      width: 42px;
      height: 84px;
      cursor: pointer;
      z-index: 15;
      transform-origin: top center;
      transition: opacity 0.25s ease, transform 0.28s ease;
    }

    #bookmark-ribbon.inactive {
      opacity: 0.76;
    }

    #bookmark-ribbon.inactive:hover {
      opacity: 0.98;
    }

    #bookmark-ribbon.active {
      opacity: 1;
    }

    #bookmark-ribbon.active:active {
      transform: translateY(3px) scaleY(1.03);
    }

    #bookmark-ribbon svg {
      width: 100%;
      height: 100%;
      display: block;
      overflow: visible;
    }

    #book-shell.is-flipping #bookmark-ribbon {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.14s ease;
    }

    #bookmark-toast {
      position: fixed;
      top: 18px;
      left: 50%;
      transform: translateX(-50%) translateY(-16px);
      background: rgba(24, 20, 17, 0.84);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #f7e6c4;
      padding: 7px 16px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.04em;
      border: 1px solid rgba(243, 198, 105, 0.35);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 30;
    }

    #bookmark-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #hud-pill {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: rgba(20, 18, 16, 0.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: rgba(255, 255, 255, 0.92);
      padding: 6px 16px;
      border-radius: 999px;
      font-size: 13px;
      letter-spacing: 0.04em;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.28s ease, transform 0.28s ease;
      z-index: 20;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    #hud-pill.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
      pointer-events: auto;
    }

    .hud-btn {
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.88);
      font-size: 15px;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      line-height: 1;
      white-space: nowrap;
    }

    .hud-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.14);
    }

    .hud-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    #btn-goto-bookmark {
      color: #f3c669;
      font-size: 12px;
      padding: 3px 8px;
      background: rgba(243, 198, 105, 0.14);
      border: 1px solid rgba(243, 198, 105, 0.3);
      border-radius: 999px;
    }

    #btn-goto-bookmark:hover {
      background: rgba(243, 198, 105, 0.26);
    }

    #loader {
      position: fixed;
      inset: 0;
      background: #161412;
      color: #e8e2d9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      z-index: 50;
      transition: opacity 0.35s ease;
    }

    #loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #f3c669;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loader">
    <div class="spinner"></div>
    <div style="font-size: 14px; letter-spacing: 0.08em;">正在載入《不要怕！森林大霧》…</div>
  </div>

  <div id="bookmark-toast">已將書籤移至此頁</div>

  <div id="reader-stage">
    <div id="book-shell">
      <canvas id="book-canvas"></canvas>
      <div id="bookmark-ribbon" class="inactive" title="點擊在此頁掛上書籤（全書僅保留一個書籤）">
        <svg viewBox="0 0 42 84" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="ribbonBody" x1="0" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#8F1720" />
              <stop offset="22%" stop-color="#D42838" />
              <stop offset="50%" stop-color="#B81D2B" />
              <stop offset="80%" stop-color="#DE3344" />
              <stop offset="100%" stop-color="#7E121A" />
            </linearGradient>
            <linearGradient id="foldOverShadow" x1="21" y1="0" x2="21" y2="84" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="rgba(40, 4, 8, 0.55)" />
              <stop offset="3.5%" stop-color="rgba(255, 232, 232, 0.42)" />
              <stop offset="7.5%" stop-color="rgba(0, 0, 0, 0.26)" />
              <stop offset="14%" stop-color="rgba(255, 255, 255, 0.05)" />
              <stop offset="75%" stop-color="rgba(255, 255, 255, 0)" />
              <stop offset="100%" stop-color="rgba(0, 0, 0, 0.24)" />
            </linearGradient>
            <linearGradient id="goldTrim" x1="0" y1="0" x2="42" y2="84" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#F7D78B" />
              <stop offset="50%" stop-color="#D99B38" />
              <stop offset="100%" stop-color="#F5CE76" />
            </linearGradient>
            <filter id="ribbonDropShadow" x="-20%" y="-10%" width="140%" height="140%">
              <feDropShadow dx="0" dy="3.5" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.34"/>
            </filter>
          </defs>
          <g filter="url(#ribbonDropShadow)">
            <path id="ribbon-main-path" d="M2 2.5C2 1.12 3.12 0 4.5 0H37.5C38.88 0 40 1.12 40 2.5V26L21 18L2 26V2.5Z" fill="url(#ribbonBody)"/>
            <path id="ribbon-sheen-path" d="M2 2.5C2 1.12 3.12 0 4.5 0H37.5C38.88 0 40 1.12 40 2.5V26L21 18L2 26V2.5Z" fill="url(#foldOverShadow)"/>
            <line x1="2.5" y1="2.8" x2="39.5" y2="2.8" stroke="rgba(255, 228, 228, 0.38)" stroke-width="0.9"/>
            <path id="ribbon-stitch-path" d="M6.8 3.5V21M35.2 3.5V21" stroke="url(#goldTrim)" stroke-width="1.35" stroke-dasharray="2.4 2"/>
            <g id="ribbon-emblem" opacity="0">
              <circle cx="21" cy="45" r="8.2" fill="rgba(94, 13, 19, 0.38)" stroke="url(#goldTrim)" stroke-width="1.2"/>
              <path d="M21 39.3L22.4 43.2L26.5 43.4L23.3 46L24.4 50L21 47.6L17.6 50L18.7 46L15.5 43.4L19.6 43.2L21 39.3Z" fill="#F9DF9B"/>
            </g>
          </g>
        </svg>
      </div>
    </div>
  </div>

  <div id="hud-pill">
    <button class="hud-btn" id="btn-first" title="回到封面">⇤</button>
    <button class="hud-btn" id="btn-prev" title="上一頁">‹</button>
    <span id="page-label">封面</span>
    <button class="hud-btn" id="btn-next" title="下一頁">›</button>
    <button class="hud-btn" id="btn-goto-bookmark" title="回到上次書籤頁" style="display:none;">🔖 回到書籤</button>
    <button class="hud-btn" id="btn-reset-zoom" title="還原大小" style="display:none; font-size:12px;">100%</button>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = "nofear_forest_fog_single_bookmark_v1";
      const INNER_PAGE_COUNT = 28;
      const IMAGE_FILES = ["images/NoFear.png"];
      const PAGE_TITLES = ["封面"];

      for (let i = 1; i <= INNER_PAGE_COUNT; i++) {
        IMAGE_FILES.push(`images/NoFear (${i}).png`);
        PAGE_TITLES.push(`第 ${i} 頁`);
      }

      const PAGE_ASPECT = 896 / 1200;

      const readerStage = document.getElementById("reader-stage");
      const bookShell = document.getElementById("book-shell");
      const canvas = document.getElementById("book-canvas");
      const ctx = canvas.getContext("2d", { alpha: false });
      const loader = document.getElementById("loader");
      const hudPill = document.getElementById("hud-pill");
      const pageLabel = document.getElementById("page-label");
      const btnFirst = document.getElementById("btn-first");
      const btnPrev = document.getElementById("btn-prev");
      const btnNext = document.getElementById("btn-next");
      const btnGotoBookmark = document.getElementById("btn-goto-bookmark");
      const btnResetZoom = document.getElementById("btn-reset-zoom");
      const bookmarkRibbon = document.getElementById("bookmark-ribbon");
      const bookmarkToast = document.getElementById("bookmark-toast");

      const ribbonMainPath = document.getElementById("ribbon-main-path");
      const ribbonSheenPath = document.getElementById("ribbon-sheen-path");
      const ribbonStitchPath = document.getElementById("ribbon-stitch-path");
      const ribbonEmblem = document.getElementById("ribbon-emblem");

      const images = [];
      const pageCache = [];
      let cachedPageW = 0;
      let cachedPageH = 0;

      let readyCount = 0;
      let initialShown = false;

      let isSpreadCapable = false;
      let currentStep = 0;
      let logicalW = 0;
      let logicalH = 0;

      // ===== 緞帶書籤幾何動畫 =====
      let ribbonOpenFactor = 0;
      let ribbonAnimFrame = null;

      function applyRibbonGeometry(t) {
        const sideY = 25 + t * 55;
        const notchY = 17.5 + t * 49;
        const stitchEndY = 20.5 + t * 52.5;

        const d = `M2 2.5C2 1.12 3.12 0 4.5 0H37.5C38.88 0 40 1.12 40 2.5V${sideY.toFixed(1)}L21 ${notchY.toFixed(1)}L2 ${sideY.toFixed(1)}V2.5Z`;
        ribbonMainPath.setAttribute("d", d);
        ribbonSheenPath.setAttribute("d", d);
        ribbonStitchPath.setAttribute("d", `M6.8 3.5V${stitchEndY.toFixed(1)}M35.2 3.5V${stitchEndY.toFixed(1)}`);

        const emblemAlpha = Math.max(0, Math.min(1, (t - 0.45) / 0.45));
        ribbonEmblem.setAttribute("opacity", emblemAlpha.toFixed(2));
        ribbonEmblem.setAttribute("transform", `translate(0, ${((t - 1) * 14).toFixed(1)})`);
      }

      function animateRibbonTo(targetT, immediate = false) {
        if (ribbonAnimFrame) {
          cancelAnimationFrame(ribbonAnimFrame);
          ribbonAnimFrame = null;
        }
        if (immediate) {
          ribbonOpenFactor = targetT;
          applyRibbonGeometry(ribbonOpenFactor);
          return;
        }

        let pos = ribbonOpenFactor;
        let vel = 0;
        let lastTs = performance.now();
        const stiffness = 135;
        const damping = 18;

        function tick(now) {
          const dt = Math.min(0.032, (now - lastTs) / 1000);
          lastTs = now;

          const force = -stiffness * (pos - targetT) - damping * vel;
          vel += force * dt;
          pos += vel * dt;

          ribbonOpenFactor = Math.max(0, Math.min(1.06, pos));
          applyRibbonGeometry(ribbonOpenFactor);

          if (Math.abs(pos - targetT) < 0.005 && Math.abs(vel) < 0.03) {
            ribbonOpenFactor = targetT;
            applyRibbonGeometry(targetT);
            ribbonAnimFrame = null;
            return;
          }
          ribbonAnimFrame = requestAnimationFrame(tick);
        }

        ribbonAnimFrame = requestAnimationFrame(tick);
      }

      // ===== 單一全局書籤狀態 =====
      let bookmarkedPageIndex = loadSavedBookmark();

      function loadSavedBookmark() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw === null) return null;
          const idx = parseInt(raw, 10);
          if (!Number.isNaN(idx) && idx >= 0 && idx < IMAGE_FILES.length) {
            return idx;
          }
        } catch (e) {}
        return null;
      }

      function saveBookmarkToStorage(pageIdx) {
        try {
          if (pageIdx === null || pageIdx === undefined) {
            localStorage.removeItem(STORAGE_KEY);
          } else {
            localStorage.setItem(STORAGE_KEY, String(pageIdx));
          }
        } catch (e) {}
      }

      function pageIndexToStep(pageIdx) {
        if (pageIdx <= 0) return 0;
        if (isSpreadCapable) {
          return Math.min(getMaxStep(), Math.ceil(pageIdx / 2));
        }
        return Math.min(getMaxStep(), pageIdx);
      }

      function getCurrentRepresentativePageIndex() {
        if (!isSpreadCapable || currentStep === 0) {
          return currentStep;
        }
        const leftIdx = currentStep * 2 - 1;
        const rightIdx = currentStep * 2;
        return rightIdx < IMAGE_FILES.length ? rightIdx : leftIdx;
      }

      function isCurrentViewBookmarked() {
        if (bookmarkedPageIndex === null) return false;
        if (!isSpreadCapable || currentStep === 0) {
          return bookmarkedPageIndex === currentStep;
        }
        const leftIdx = currentStep * 2 - 1;
        const rightIdx = currentStep * 2;
        return bookmarkedPageIndex === leftIdx || bookmarkedPageIndex === rightIdx;
      }

      let toastTimer = null;
      function showBookmarkToast(text) {
        bookmarkToast.textContent = text;
        bookmarkToast.classList.add("visible");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          bookmarkToast.classList.remove("visible");
        }, 2000);
      }

      function updateBookmarkUI(immediate = false) {
        const isHere = isCurrentViewBookmarked();
        if (isHere) {
          bookmarkRibbon.classList.remove("inactive");
          bookmarkRibbon.classList.add("active");
          bookmarkRibbon.title = "此頁已掛上書籤（再次點擊可收起）";
          animateRibbonTo(1, immediate);
        } else {
          bookmarkRibbon.classList.remove("active");
          bookmarkRibbon.classList.add("inactive");
          bookmarkRibbon.title = bookmarkedPageIndex !== null
            ? "點擊將書籤從原本頁面移到此頁"
            : "點擊下拉書籤標記此頁";
          animateRibbonTo(0, immediate);
        }

        if (bookmarkedPageIndex !== null && !isHere) {
          btnGotoBookmark.style.display = "inline-block";
          const targetName = bookmarkedPageIndex === 0 ? "封面" : `第 ${bookmarkedPageIndex} 頁`;
          btnGotoBookmark.textContent = `🔖 回到${targetName}`;
        } else {
          btnGotoBookmark.style.display = "none";
        }
      }

      bookmarkRibbon.addEventListener("mouseenter", () => {
        if (!isCurrentViewBookmarked()) {
          animateRibbonTo(0.14, false);
        }
      });
      bookmarkRibbon.addEventListener("mouseleave", () => {
        if (!isCurrentViewBookmarked()) {
          animateRibbonTo(0, false);
        }
      });

      function toggleOrMoveBookmark() {
        if (isCurrentViewBookmarked()) {
          bookmarkedPageIndex = null;
          saveBookmarkToStorage(null);
          updateBookmarkUI(false);
          showBookmarkToast("已收起書籤");
        } else {
          const hadOldBookmark = bookmarkedPageIndex !== null;
          const targetIdx = getCurrentRepresentativePageIndex();
          bookmarkedPageIndex = targetIdx;
          saveBookmarkToStorage(targetIdx);
          updateBookmarkUI(false);
          const label = targetIdx === 0 ? "封面" : `第 ${targetIdx} 頁`;
          showBookmarkToast(hadOldBookmark ? `書籤已移至${label}（下次開啟將自動回到此頁）` : `已在${label}掛上書籤`);
        }
      }

      function jumpToBookmark() {
        if (bookmarkedPageIndex === null || flip.active) return;
        const targetStep = pageIndexToStep(bookmarkedPageIndex);
        if (targetStep === currentStep) return;
        resetZoom(false);
        const dir = targetStep > currentStep ? 1 : -1;
        flip.active = true;
        flip.dragging = false;
        flip.direction = dir;
        flip.fromStep = currentStep;
        flip.toStep = targetStep;
        flip.progress = 0.015;
        flip.tiltAngle = 0;
        bookShell.classList.add("is-flipping");
        if (isSpreadCapable && (currentStep === 0 || targetStep === 0)) {
          updateLayout(false);
        }
        animateSpringTo(1, 0.95, () => {
          currentStep = targetStep;
        });
      }

      // ===== 雙指縮放與平移狀態 =====
      const view = {
        scale: 1,
        tx: 0,
        ty: 0,
        minScale: 1,
        maxScale: 3.5,
        isPinching: false,
        isPanning: false,
        pinchStartDist: 0,
        pinchStartScale: 1,
        pinchStartTx: 0,
        pinchStartTy: 0,
        pinchMidX: 0,
        pinchMidY: 0,
        panStartX: 0,
        panStartY: 0,
        panStartTx: 0,
        panStartTy: 0,
        zoomAnim: null
      };

      const flip = {
        active: false,
        direction: 0,
        progress: 0,
        velocity: 0,
        tiltAngle: 0,
        startYNorm: 0.5,
        dragging: false,
        startX: 0,
        startY: 0,
        lastX: 0,
        lastTime: 0,
        fromStep: 0,
        toStep: 0,
        animFrame: null
      };

      let renderPending = false;
      function scheduleRender() {
        if (renderPending) return;
        renderPending = true;
        requestAnimationFrame(() => {
          renderPending = false;
          render();
        });
      }

      let hudTimer = null;
      function showHud() {
        hudPill.classList.add("visible");
        clearTimeout(hudTimer);
        hudTimer = setTimeout(() => {
          hudPill.classList.remove("visible");
        }, 2600);
      }

      function clampPan(tx, ty, scale) {
        if (scale <= 1.001) return { tx: 0, ty: 0 };
        const stageRect = readerStage.getBoundingClientRect();
        const scaledW = logicalW * scale;
        const scaledH = logicalH * scale;
        const maxTx = Math.max(0, (scaledW - stageRect.width) / 2 + 24);
        const maxTy = Math.max(0, (scaledH - stageRect.height) / 2 + 24);
        return {
          tx: Math.max(-maxTx, Math.min(maxTx, tx)),
          ty: Math.max(-maxTy, Math.min(maxTy, ty))
        };
      }

      function applyViewTransform() {
        const clamped = clampPan(view.tx, view.ty, view.scale);
        view.tx = clamped.tx;
        view.ty = clamped.ty;
        if (view.scale <= 1.001 && Math.abs(view.tx) < 0.5 && Math.abs(view.ty) < 0.5) {
          bookShell.style.transform = "";
          btnResetZoom.style.display = "none";
        } else {
          bookShell.style.transform = `translate3d(${view.tx.toFixed(2)}px, ${view.ty.toFixed(2)}px, 0) scale(${view.scale.toFixed(4)})`;
          btnResetZoom.style.display = "inline-block";
          btnResetZoom.textContent = `${Math.round(view.scale * 100)}%`;
        }
      }

      function animateViewTo(targetScale, targetTx, targetTy, onDone) {
        if (view.zoomAnim) cancelAnimationFrame(view.zoomAnim);
        const startScale = view.scale;
        const startTx = view.tx;
        const startTy = view.ty;
        const startTime = performance.now();
        const duration = 260;

        function step(now) {
          const t = Math.min(1, (now - startTime) / duration);
          const ease = 1 - Math.pow(1 - t, 3);
          view.scale = startScale + (targetScale - startScale) * ease;
          view.tx = startTx + (targetTx - startTx) * ease;
          view.ty = startTy + (targetTy - startTy) * ease;
          applyViewTransform();

          if (t < 1) {
            view.zoomAnim = requestAnimationFrame(step);
          } else {
            view.scale = targetScale;
            view.tx = targetTx;
            view.ty = targetTy;
            view.zoomAnim = null;
            applyViewTransform();
            updateCanvasResolution();
            if (onDone) onDone();
          }
        }
        view.zoomAnim = requestAnimationFrame(step);
      }

      function resetZoom(animated = true) {
        if (animated) {
          animateViewTo(1, 0, 0);
        } else {
          if (view.zoomAnim) cancelAnimationFrame(view.zoomAnim);
          view.scale = 1;
          view.tx = 0;
          view.ty = 0;
          applyViewTransform();
          updateCanvasResolution();
        }
      }

      function checkSpreadCapable(stageW, stageH) {
        return stageW >= 820 && stageW > stageH * 1.05;
      }

      function getMaxStep() {
        return isSpreadCapable
          ? Math.ceil((IMAGE_FILES.length - 1) / 2)
          : IMAGE_FILES.length - 1;
      }

      function convertStepOnResize(wasSpread, nowSpread, oldStep) {
        if (wasSpread === nowSpread) return Math.min(oldStep, getMaxStep());
        if (!wasSpread && nowSpread) {
          return oldStep === 0 ? 0 : Math.ceil(oldStep / 2);
        } else {
          return oldStep === 0 ? 0 : Math.min(oldStep * 2 - 1, IMAGE_FILES.length - 1);
        }
      }

      function getEffectiveDpr() {
        const baseDpr = window.devicePixelRatio || 1;
        const zoomBoost = Math.min(2.2, Math.max(1, view.scale));
        return Math.min(3.5, baseDpr * zoomBoost);
      }

      function getCachedPage(imgIndex, targetW, targetH) {
        const dpr = getEffectiveDpr();
        const pxW = Math.max(1, Math.round(targetW * dpr));
        const pxH = Math.max(1, Math.round(targetH * dpr));

        if (cachedPageW !== pxW || cachedPageH !== pxH) {
          pageCache.length = 0;
          cachedPageW = pxW;
          cachedPageH = pxH;
        }

        if (pageCache[imgIndex]) {
          return pageCache[imgIndex];
        }

        const img = images[imgIndex];
        if (!img || !img.complete || img.naturalWidth === 0) {
          return null;
        }

        const off = document.createElement("canvas");
        off.width = pxW;
        off.height = pxH;
        const octx = off.getContext("2d", { alpha: false });
        octx.fillStyle = "#fdfbf7";
        octx.fillRect(0, 0, pxW, pxH);
        octx.drawImage(img, 0, 0, pxW, pxH);

        pageCache[imgIndex] = off;
        return off;
      }

      function updateCanvasResolution() {
        if (!logicalW || !logicalH) return;
        const dpr = getEffectiveDpr();
        const targetCanvasW = Math.round(logicalW * dpr);
        const targetCanvasH = Math.round(logicalH * dpr);
        if (canvas.width !== targetCanvasW || canvas.height !== targetCanvasH) {
          canvas.width = targetCanvasW;
          canvas.height = targetCanvasH;
        }
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        scheduleRender();
      }

      function updateLayout(forceReset = false) {
        const stageRect = readerStage.getBoundingClientRect();
        const stageW = stageRect.width || window.innerWidth;
        const stageH = stageRect.height || window.innerHeight;

        const wasSpread = isSpreadCapable;
        isSpreadCapable = checkSpreadCapable(stageW, stageH);

        if (!forceReset && wasSpread !== isSpreadCapable) {
          currentStep = convertStepOnResize(wasSpread, isSpreadCapable, currentStep);
          if (flip.active) {
            if (flip.animFrame) cancelAnimationFrame(flip.animFrame);
            flip.active = false;
            flip.dragging = false;
            flip.animFrame = null;
            bookShell.classList.remove("is-flipping");
          }
          resetZoom(false);
        }
        currentStep = Math.max(0, Math.min(currentStep, getMaxStep()));

        const effectiveStep = flip.active ? Math.max(flip.fromStep, flip.toStep) : currentStep;
        const showDouble = isSpreadCapable && effectiveStep > 0;

        const padW = 12;
        const padH = 12;
        const availW = Math.max(200, stageW - padW);
        const availH = Math.max(200, stageH - padH);
        const targetAspect = showDouble ? (PAGE_ASPECT * 2) : PAGE_ASPECT;

        let bookW, bookH;
        if (availW / availH > targetAspect) {
          bookH = availH;
          bookW = bookH * targetAspect;
        } else {
          bookW = availW;
          bookH = bookW / targetAspect;
        }

        const nextLogicalW = Math.round(bookW);
        const nextLogicalH = Math.round(bookH);
        const sizeChanged = (nextLogicalW !== logicalW || nextLogicalH !== logicalH);

        logicalW = nextLogicalW;
        logicalH = nextLogicalH;

        if (sizeChanged || forceReset) {
          bookShell.style.width = logicalW + "px";
          bookShell.style.height = logicalH + "px";
          applyViewTransform();
          updateCanvasResolution();
        }

        updateHudText();
        updateBookmarkUI(forceReset);
        render();
      }

      function updateHudText() {
        const maxStep = getMaxStep();
        btnFirst.disabled = currentStep === 0;
        btnPrev.disabled = currentStep === 0;
        btnNext.disabled = currentStep >= maxStep;

        if (!isSpreadCapable) {
          pageLabel.textContent = `${PAGE_TITLES[currentStep]} / 共 ${INNER_PAGE_COUNT} 頁`;
        } else {
          if (currentStep === 0) {
            pageLabel.textContent = `封面 / 共 ${INNER_PAGE_COUNT} 頁`;
          } else {
            const leftIdx = currentStep * 2 - 1;
            const rightIdx = currentStep * 2;
            if (rightIdx < IMAGE_FILES.length) {
              pageLabel.textContent = `第 ${leftIdx}–${rightIdx} 頁 / 共 ${INNER_PAGE_COUNT} 頁`;
            } else {
              pageLabel.textContent = `第 ${leftIdx} 頁 / 共 ${INNER_PAGE_COUNT} 頁`;
            }
          }
        }
      }

      function drawPageImage(imgIndex, x, y, w, h, basePageW, basePageH) {
        const cacheW = basePageW || w;
        const cacheH = basePageH || h;
        const cached = getCachedPage(imgIndex, cacheW, cacheH);
        if (cached) {
          ctx.drawImage(cached, x, y, w, h);
        } else {
          ctx.fillStyle = "#fdfbf7";
          ctx.fillRect(x, y, w, h);
        }
      }

      function drawSpineShadow(centerX, h) {
        const spineW = Math.max(18, h * 0.032);
        const grad = ctx.createLinearGradient(centerX - spineW, 0, centerX + spineW, 0);
        grad.addColorStop(0, "rgba(0,0,0,0)");
        grad.addColorStop(0.38, "rgba(0,0,0,0.06)");
        grad.addColorStop(0.5, "rgba(0,0,0,0.22)");
        grad.addColorStop(0.62, "rgba(0,0,0,0.06)");
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(centerX - spineW, 0, spineW * 2, h);
      }

      function drawStaticStep(step, w, h, forceDoubleLayout) {
        if (!forceDoubleLayout) {
          const idx = isSpreadCapable ? 0 : step;
          drawPageImage(idx, 0, 0, w, h, w, h);
          const edgeGrad = ctx.createLinearGradient(0, 0, Math.max(12, w * 0.025), 0);
          edgeGrad.addColorStop(0, "rgba(0,0,0,0.16)");
          edgeGrad.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = edgeGrad;
          ctx.fillRect(0, 0, Math.max(12, w * 0.025), h);
        } else {
          const halfW = w / 2;
          const leftIdx = step * 2 - 1;
          const rightIdx = step * 2;
          if (leftIdx >= 0 && leftIdx < images.length) {
            drawPageImage(leftIdx, 0, 0, halfW, h, halfW, h);
          }
          if (rightIdx >= 0 && rightIdx < images.length) {
            drawPageImage(rightIdx, halfW, 0, halfW, h, halfW, h);
          } else {
            ctx.fillStyle = "#f7f3eb";
            ctx.fillRect(halfW, 0, halfW, h);
          }
          drawSpineShadow(halfW, h);
        }
      }

      // 完整 0% -> 100% 展開翻頁：折痕從最右邊 (w) 一路走到最左邊 (0)，整頁完整翻完！
      function drawSinglePageCurl(lowerIdx, upperIdx, peelP, tiltAngle, w, h) {
        // 1. 底層即將完整露出的下一頁（upperIdx）
        drawPageImage(upperIdx, 0, 0, w, h, w, h);

        // 接近起點或終點時角度平滑收斂，確保 100% 翻完時完全平貼
        const activeAngle = tiltAngle * Math.sin(peelP * Math.PI);
        const curlCurve = Math.sin(peelP * Math.PI);

        // 關鍵修正：
        // 折痕（山脊）從最右邊 w 一路走到最左邊 0：foldCenterX = w * (1 - peelP)
        // 而被掀起的紙背從折痕往左邊張開的寬度為 peeledSpan = w * peelP（越翻越寬，超過左邊界後自然翻出書外）
        const foldCenterX = w * (1 - peelP);
        const foldCenterY = h * 0.5;
        const peeledSpan = w * peelP;
        const diag = Math.hypot(w, h) * 1.6;

        ctx.save();
        ctx.translate(foldCenterX, foldCenterY);
        ctx.rotate(activeAngle);

        // 2. 折痕右側：投射在底層「下一頁 (upperIdx)」上的柔和陰影
        const rightShadowW = Math.min(w * 0.36, 22 + w * 0.18 * curlCurve);
        const rightShadow = ctx.createLinearGradient(0, 0, rightShadowW, 0);
        rightShadow.addColorStop(0, `rgba(0, 0, 0, ${0.34 * curlCurve})`);
        rightShadow.addColorStop(0.45, `rgba(0, 0, 0, ${0.12 * curlCurve})`);
        rightShadow.addColorStop(1, "rgba(0, 0, 0, 0)");
        ctx.fillStyle = rightShadow;
        ctx.fillRect(0, -diag, rightShadowW, diag * 2);

        // 3. 折痕左側 [-diag, -peeledSpan]：尚未被掀起的「當前頁正面 (lowerIdx)」
        if (foldCenterX - peeledSpan > -w * 0.2) {
          ctx.save();
          ctx.beginPath();
          ctx.rect(-diag, -diag, Math.max(0, diag - peeledSpan), diag * 2);
          ctx.clip();

          ctx.rotate(-activeAngle);
          ctx.translate(-foldCenterX, -foldCenterY);
          drawPageImage(lowerIdx, 0, 0, w, h, w, h);

          const leftSpine = ctx.createLinearGradient(0, 0, Math.max(12, w * 0.025), 0);
          leftSpine.addColorStop(0, "rgba(0,0,0,0.16)");
          leftSpine.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = leftSpine;
          ctx.fillRect(0, 0, Math.max(12, w * 0.025), h);

          ctx.translate(foldCenterX, foldCenterY);
          ctx.rotate(activeAngle);
          const leftCastShadowW = Math.min(w * 0.30, 20 + w * 0.16 * curlCurve);
          const leftCastShadow = ctx.createLinearGradient(-peeledSpan - leftCastShadowW, 0, -peeledSpan, 0);
          leftCastShadow.addColorStop(0, "rgba(0, 0, 0, 0)");
          leftCastShadow.addColorStop(0.55, `rgba(0, 0, 0, ${0.14 * curlCurve})`);
          leftCastShadow.addColorStop(1, `rgba(0, 0, 0, ${0.34 * curlCurve})`);
          ctx.fillStyle = leftCastShadow;
          ctx.fillRect(-peeledSpan - leftCastShadowW, -diag, leftCastShadowW, diag * 2);
          ctx.restore();
        }

        // 4. 折痕左側 [-peeledSpan, 0]：往左邊「越翻越張開」的紙背！
        if (peeledSpan > 0.5 && peelP > 0.002 && peelP < 0.998) {
          ctx.save();
          // 限制在書本四邊形範圍內
          ctx.rotate(-activeAngle);
          ctx.translate(-foldCenterX, -foldCenterY);
          ctx.beginPath();
          ctx.rect(0, 0, w, h);
          ctx.clip();
          ctx.translate(foldCenterX, foldCenterY);
          ctx.rotate(activeAngle);

          // 裁切出折痕左側張開的紙背區域 [-peeledSpan, 0]
          ctx.beginPath();
          ctx.rect(-peeledSpan, -diag, peeledSpan, diag * 2);
          ctx.clip();

          // 紙背暖白底色
          ctx.fillStyle = "#faf7f0";
          ctx.fillRect(-peeledSpan, -diag, peeledSpan, diag * 2);

          // 沿折痕鏡像翻折正面內容（紙背透光效果，越翻越張開）
          ctx.save();
          ctx.globalAlpha = 0.20;
          ctx.scale(-1, 1);
          ctx.rotate(-activeAngle);
          ctx.translate(-foldCenterX, -foldCenterY);
          drawPageImage(lowerIdx, 0, 0, w, h, w, h);
          ctx.restore();

          // 紙背明暗漸層：僅在靠近折痕山脊處有立體高光，往左延伸為舒展平鋪的紙張
          const ridgeWidth = Math.min(peeledSpan, Math.max(24, w * 0.14 * curlCurve));
          const spreadGrad = ctx.createLinearGradient(-peeledSpan, 0, 0, 0);
          spreadGrad.addColorStop(0, `rgba(0, 0, 0, ${0.14 * curlCurve})`);
          spreadGrad.addColorStop(0.06, `rgba(255, 255, 255, ${0.10 * curlCurve})`);
          const ridgeStartStop = Math.max(0.08, 1 - ridgeWidth / Math.max(1, peeledSpan));
          spreadGrad.addColorStop(ridgeStartStop, "rgba(245, 240, 232, 0.03)");
          const peakStop = Math.min(0.96, ridgeStartStop + (1 - ridgeStartStop) * 0.58);
          spreadGrad.addColorStop(peakStop, `rgba(255, 255, 255, ${0.50 * curlCurve})`);
          spreadGrad.addColorStop(1, `rgba(0, 0, 0, ${0.18 * curlCurve})`);

          ctx.fillStyle = spreadGrad;
          ctx.fillRect(-peeledSpan, -diag, peeledSpan, diag * 2);

          ctx.restore();
        }

        ctx.restore();
      }

      function drawSpreadPageFlip(prevLeftIdx, prevRightIdx, nextLeftIdx, nextRightIdx, flipP, tiltAngle, w, h) {
        const halfW = w / 2;
        drawPageImage(prevLeftIdx, 0, 0, halfW, h, halfW, h);
        if (nextRightIdx < images.length) {
          drawPageImage(nextRightIdx, halfW, 0, halfW, h, halfW, h);
        } else {
          ctx.fillStyle = "#f7f3eb";
          ctx.fillRect(halfW, 0, halfW, h);
        }

        const skewOffset = Math.sin(tiltAngle) * h * 0.14 * Math.sin(flipP * Math.PI);

        if (flipP < 0.5) {
          const t = flipP * 2;
          const pageW = halfW * Math.cos(t * Math.PI * 0.5);

          const dropShadowW = Math.min(halfW, pageW + 55);
          const sGrad = ctx.createLinearGradient(halfW, 0, halfW + dropShadowW, 0);
          sGrad.addColorStop(0, `rgba(0,0,0,${0.38 * (1 - t * 0.4)})`);
          sGrad.addColorStop(0.75, `rgba(0,0,0,${0.14 * (1 - t)})`);
          sGrad.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = sGrad;
          ctx.fillRect(halfW, 0, dropShadowW, h);

          ctx.save();
          ctx.transform(1, skewOffset / Math.max(1, pageW), 0, 1, 0, -skewOffset * 0.5);
          if (prevRightIdx < images.length) {
            drawPageImage(prevRightIdx, halfW, 0, pageW, h, halfW, h);
          } else {
            ctx.fillStyle = "#f7f3eb";
            ctx.fillRect(halfW, 0, pageW, h);
          }

          const curlGrad = ctx.createLinearGradient(halfW, 0, halfW + pageW, 0);
          curlGrad.addColorStop(0, "rgba(0,0,0,0.14)");
          curlGrad.addColorStop(0.65, `rgba(255,255,255,${0.28 * t})`);
          curlGrad.addColorStop(0.92, `rgba(0,0,0,${0.18 * t})`);
          curlGrad.addColorStop(1, `rgba(0,0,0,${0.32 * t})`);
          ctx.fillStyle = curlGrad;
          ctx.fillRect(halfW, 0, pageW, h);
          ctx.restore();
        } else {
          const t = (flipP - 0.5) * 2;
          const pageW = halfW * Math.sin(t * Math.PI * 0.5);
          const leftEdge = halfW - pageW;

          const dropShadowW = Math.min(halfW, pageW + 55);
          const sGrad = ctx.createLinearGradient(halfW - dropShadowW, 0, halfW, 0);
          sGrad.addColorStop(0, "rgba(0,0,0,0)");
          sGrad.addColorStop(0.25, `rgba(0,0,0,${0.14 * (1 - t)})`);
          sGrad.addColorStop(1, `rgba(0,0,0,${0.38 * (1 - t * 0.4)})`);
          ctx.fillStyle = sGrad;
          ctx.fillRect(halfW - dropShadowW, 0, dropShadowW, h);

          ctx.save();
          ctx.transform(1, -skewOffset / Math.max(1, pageW), 0, 1, 0, skewOffset * 0.5);
          drawPageImage(nextLeftIdx, leftEdge, 0, pageW, h, halfW, h);

          const curlGrad = ctx.createLinearGradient(leftEdge, 0, halfW, 0);
          curlGrad.addColorStop(0, `rgba(0,0,0,${0.32 * (1 - t)})`);
          curlGrad.addColorStop(0.08, `rgba(0,0,0,${0.16 * (1 - t)})`);
          curlGrad.addColorStop(0.35, `rgba(255,255,255,${0.28 * (1 - t)})`);
          curlGrad.addColorStop(1, "rgba(0,0,0,0.14)");
          ctx.fillStyle = curlGrad;
          ctx.fillRect(leftEdge, 0, pageW, h);
          ctx.restore();
        }

        drawSpineShadow(halfW, h);
      }

      function render() {
        const w = logicalW;
        const h = logicalH;
        if (!w || !h) return;

        if (!flip.active) {
          const isDouble = isSpreadCapable && currentStep > 0;
          drawStaticStep(currentStep, w, h, isDouble);
          return;
        }

        const p = Math.max(0, Math.min(1, flip.progress));
        const dir = flip.direction;
        const fromStep = flip.fromStep;
        const toStep = flip.toStep;

        if (isSpreadCapable && ((fromStep === 0 && toStep === 1) || (fromStep === 1 && toStep === 0))) {
          const halfW = w / 2;
          drawStaticStep(1, w, h, true);

          const openP = (fromStep === 0) ? p : (1 - p);

          if (openP < 0.5) {
            const t = openP * 2;
            const coverW = halfW * Math.cos(t * Math.PI * 0.5);

            ctx.fillStyle = `rgba(0, 0, 0, ${0.38 * (1 - t)})`;
            ctx.fillRect(halfW, 0, halfW, h);

            drawPageImage(0, halfW, 0, coverW, h, halfW, h);
            const ridge = ctx.createLinearGradient(halfW, 0, halfW + coverW, 0);
            ridge.addColorStop(0, "rgba(0,0,0,0.18)");
            ridge.addColorStop(0.7, `rgba(255,255,255,${0.28 * t})`);
            ridge.addColorStop(1, `rgba(0,0,0,${0.25 * t})`);
            ctx.fillStyle = ridge;
            ctx.fillRect(halfW, 0, coverW, h);
          } else {
            const t = (openP - 0.5) * 2;
            const flapW = halfW * Math.sin(t * Math.PI * 0.5);

            ctx.fillStyle = `rgba(0, 0, 0, ${0.32 * (1 - t)})`;
            ctx.fillRect(0, 0, halfW, h);

            ctx.save();
            ctx.beginPath();
            ctx.rect(halfW - flapW, 0, flapW, h);
            ctx.clip();
            drawPageImage(1, halfW - flapW, 0, flapW, h, halfW, h);

            const ridge = ctx.createLinearGradient(halfW - flapW, 0, halfW, 0);
            ridge.addColorStop(0, `rgba(0,0,0,${0.22 * (1 - t)})`);
            ridge.addColorStop(0.3, `rgba(255,255,255,${0.28 * (1 - t)})`);
            ridge.addColorStop(1, "rgba(0,0,0,0.15)");
            ctx.fillStyle = ridge;
            ctx.fillRect(halfW - flapW, 0, flapW, h);
            ctx.restore();
          }

          drawSpineShadow(halfW, h);
          return;
        }

        if (isSpreadCapable) {
          const prevStep = dir === 1 ? fromStep : toStep;
          const nextStep = dir === 1 ? toStep : fromStep;
          const flipP = dir === 1 ? p : (1 - p);

          const prevLeftIdx = prevStep * 2 - 1;
          const prevRightIdx = prevStep * 2;
          const nextLeftIdx = nextStep * 2 - 1;
          const nextRightIdx = nextStep * 2;

          drawSpreadPageFlip(prevLeftIdx, prevRightIdx, nextLeftIdx, nextRightIdx, flipP, flip.tiltAngle, w, h);
          return;
        }

        const lowerIdx = dir === 1 ? fromStep : toStep;
        const upperIdx = dir === 1 ? toStep : fromStep;
        const peelP = dir === 1 ? p : (1 - p);

        drawSinglePageCurl(lowerIdx, upperIdx, peelP, flip.tiltAngle, w, h);
      }

      // 無尾端拖泥帶水、無結束閃爍的臨界阻尼彈簧收尾
      function animateSpringTo(targetP, initialVelocity, onComplete) {
        if (flip.animFrame) cancelAnimationFrame(flip.animFrame);
        bookShell.classList.add("is-flipping");

        let pos = flip.progress;
        let vel = initialVelocity || 0;
        let lastTs = performance.now();

        const stiffness = 105;
        const damping = 20.5;

        function finishAnimation() {
          flip.progress = targetP;
          flip.tiltAngle = 0;
          flip.active = false;
          flip.dragging = false;
          flip.velocity = 0;
          flip.animFrame = null;
          bookShell.classList.remove("is-flipping");
          if (onComplete) onComplete();
          // 僅更新頁碼文字、書籤狀態與重繪靜態畫面，不重設 canvas 寬高避免最後一瞬閃爍卡頓
          if (isSpreadCapable && (flip.fromStep === 0 || flip.toStep === 0)) {
            updateLayout(false);
          } else {
            updateHudText();
            updateBookmarkUI(false);
            render();
          }
        }

        function tick(now) {
          const dt = Math.min(0.032, (now - lastTs) / 1000);
          lastTs = now;

          const displacement = pos - targetP;
          const springForce = -stiffness * displacement;
          const dampingForce = -damping * vel;
          const accel = springForce + dampingForce;

          vel += accel * dt;
          pos += vel * dt;

          flip.tiltAngle *= 0.90;

          if (pos <= 0 && targetP === 0) {
            finishAnimation();
            return;
          }
          if (pos >= 1 && targetP === 1) {
            finishAnimation();
            return;
          }

          pos = Math.max(0, Math.min(1, pos));
          flip.progress = pos;
          render();

          // 接近終點 0.8% 內直接順滑落定，避免臨界阻尼尾端無限逼近造成最後停頓感
          if (Math.abs(pos - targetP) < 0.008 && Math.abs(vel) < 0.18) {
            finishAnimation();
            return;
          }

          flip.animFrame = requestAnimationFrame(tick);
        }

        flip.animFrame = requestAnimationFrame(tick);
      }

      function turnPage(dir, customTilt = 0) {
        if (flip.active) return;
        if (view.scale > 1.02) resetZoom(true);

        const maxStep = getMaxStep();
        const nextStep = currentStep + dir;
        if (nextStep < 0 || nextStep > maxStep) return;

        flip.active = true;
        flip.dragging = false;
        flip.direction = dir;
        flip.fromStep = currentStep;
        flip.toStep = nextStep;
        flip.progress = 0.01;
        flip.tiltAngle = customTilt;
        bookShell.classList.add("is-flipping");

        if (isSpreadCapable && currentStep === 0 && nextStep === 1) {
          updateLayout(false);
        }

        animateSpringTo(1, 0.9, () => {
          currentStep = nextStep;
        });
      }

      bookmarkRibbon.addEventListener("mousedown", (e) => {
        e.stopPropagation();
      });
      bookmarkRibbon.addEventListener("touchstart", (e) => {
        e.stopPropagation();
      }, { passive: true });
      bookmarkRibbon.addEventListener("click", (e) => {
        e.stopPropagation();
        if (flip.active) return;
        toggleOrMoveBookmark();
        showHud();
      });

      btnGotoBookmark.addEventListener("click", (e) => {
        e.stopPropagation();
        jumpToBookmark();
        showHud();
      });

      // ===== 觸控與滑鼠手勢整合 =====
      let pointerDown = false;
      let hasMoved = false;
      let touchStartTime = 0;
      let lastTapTime = 0;
      let lastTapX = 0;
      let lastTapY = 0;

      function getTouchDistance(t1, t2) {
        return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
      }

      function getTouchMidpoint(t1, t2) {
        return {
          x: (t1.clientX + t2.clientX) / 2,
          y: (t1.clientY + t2.clientY) / 2
        };
      }

      readerStage.addEventListener("touchstart", (e) => {
        if (e.touches.length >= 2) {
          pointerDown = false;
          view.isPanning = false;

          if (flip.active && flip.dragging) {
            const orig = flip.fromStep;
            animateSpringTo(0, -0.35, () => {
              currentStep = orig;
            });
          }

          if (view.zoomAnim) {
            cancelAnimationFrame(view.zoomAnim);
            view.zoomAnim = null;
          }

          view.isPinching = true;
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const mid = getTouchMidpoint(t1, t2);
          const stageRect = readerStage.getBoundingClientRect();

          view.pinchStartDist = Math.max(10, getTouchDistance(t1, t2));
          view.pinchStartScale = view.scale;
          view.pinchStartTx = view.tx;
          view.pinchStartTy = view.ty;
          view.pinchMidX = mid.x - (stageRect.left + stageRect.width / 2);
          view.pinchMidY = mid.y - (stageRect.top + stageRect.height / 2);
          return;
        }

        if (e.touches.length === 1 && !view.isPinching) {
          const touch = e.touches[0];
          touchStartTime = performance.now();
          if (view.scale > 1.02) {
            if (view.zoomAnim) {
              cancelAnimationFrame(view.zoomAnim);
              view.zoomAnim = null;
            }
            view.isPanning = true;
            hasMoved = false;
            view.panStartX = touch.clientX;
            view.panStartY = touch.clientY;
            view.panStartTx = view.tx;
            view.panStartTy = view.ty;
          } else {
            onSingleStart(touch.clientX, touch.clientY);
          }
        }
      }, { passive: true });

      readerStage.addEventListener("touchmove", (e) => {
        if (view.isPinching && e.touches.length >= 2) {
          const t1 = e.touches[0];
          const t2 = e.touches[1];
          const dist = getTouchDistance(t1, t2);
          const mid = getTouchMidpoint(t1, t2);
          const stageRect = readerStage.getBoundingClientRect();

          const rawScale = view.pinchStartScale * (dist / view.pinchStartDist);
          const nextScale = Math.max(0.85, Math.min(view.maxScale * 1.15, rawScale));
          const scaleRatio = nextScale / view.pinchStartScale;

          const curMidX = mid.x - (stageRect.left + stageRect.width / 2);
          const curMidY = mid.y - (stageRect.top + stageRect.height / 2);

          view.scale = nextScale;
          view.tx = curMidX - (view.pinchMidX - view.pinchStartTx) * scaleRatio;
          view.ty = curMidY - (view.pinchMidY - view.pinchStartTy) * scaleRatio;
          applyViewTransform();
          return;
        }

        if (view.isPanning && e.touches.length === 1) {
          const touch = e.touches[0];
          const dx = touch.clientX - view.panStartX;
          const dy = touch.clientY - view.panStartY;
          if (!hasMoved && Math.hypot(dx, dy) < 5) return;
          hasMoved = true;

          view.tx = view.panStartTx + dx;
          view.ty = view.panStartTy + dy;
          applyViewTransform();
          return;
        }

        if (pointerDown && e.touches.length === 1) {
          if (!hasMoved && performance.now() - touchStartTime < 40) return;
          onSingleMove(e.touches[0].clientX, e.touches[0].clientY);
        }
      }, { passive: true });

      readerStage.addEventListener("touchend", (e) => {
        if (view.isPinching) {
          if (e.touches.length < 2) {
            view.isPinching = false;
            if (view.scale <= 1.06) {
              animateViewTo(1, 0, 0);
            } else if (view.scale > view.maxScale) {
              const clamped = clampPan(view.tx, view.ty, view.maxScale);
              animateViewTo(view.maxScale, clamped.tx, clamped.ty);
            } else {
              const clamped = clampPan(view.tx, view.ty, view.scale);
              animateViewTo(view.scale, clamped.tx, clamped.ty);
            }
          }
          return;
        }

        if (view.isPanning) {
          view.isPanning = false;
          if (!hasMoved && e.changedTouches.length) {
            handleTapOrDoubleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
          }
          return;
        }

        if (pointerDown) {
          const endX = e.changedTouches.length ? e.changedTouches[0].clientX : flip.lastX;
          const endY = e.changedTouches.length ? e.changedTouches[0].clientY : flip.startY;
          onSingleEnd(endX, endY);
        }
      });

      canvas.addEventListener("mousedown", (e) => {
        if (e.button !== 0) return;
        if (view.scale > 1.02) {
          view.isPanning = true;
          hasMoved = false;
          view.panStartX = e.clientX;
          view.panStartY = e.clientY;
          view.panStartTx = view.tx;
          view.panStartTy = view.ty;
        } else {
          onSingleStart(e.clientX, e.clientY);
        }
      });

      window.addEventListener("mousemove", (e) => {
        if (view.isPanning) {
          const dx = e.clientX - view.panStartX;
          const dy = e.clientY - view.panStartY;
          if (!hasMoved && Math.hypot(dx, dy) < 5) return;
          hasMoved = true;
          view.tx = view.panStartTx + dx;
          view.ty = view.panStartTy + dy;
          applyViewTransform();
          return;
        }
        if (!pointerDown) {
          showHud();
          return;
        }
        onSingleMove(e.clientX, e.clientY);
      });

      window.addEventListener("mouseup", (e) => {
        if (view.isPanning) {
          view.isPanning = false;
          if (!hasMoved) {
            handleTapOrDoubleTap(e.clientX, e.clientY);
          }
          return;
        }
        if (!pointerDown) return;
        onSingleEnd(e.clientX, e.clientY);
      });

      readerStage.addEventListener("wheel", (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          const stageRect = readerStage.getBoundingClientRect();
          const midX = e.clientX - (stageRect.left + stageRect.width / 2);
          const midY = e.clientY - (stageRect.top + stageRect.height / 2);

          const factor = Math.exp(-e.deltaY * 0.008);
          const nextScale = Math.max(1, Math.min(view.maxScale, view.scale * factor));
          const ratio = nextScale / view.scale;

          view.scale = nextScale;
          if (nextScale <= 1.01) {
            view.scale = 1;
            view.tx = 0;
            view.ty = 0;
          } else {
            view.tx = midX - (midX - view.tx) * ratio;
            view.ty = midY - (midY - view.ty) * ratio;
          }
          applyViewTransform();
          updateCanvasResolution();
        }
      }, { passive: false });

      function onSingleStart(x, y) {
        if (flip.active && flip.animFrame) {
          cancelAnimationFrame(flip.animFrame);
          flip.animFrame = null;
          flip.dragging = true;
        }

        pointerDown = true;
        hasMoved = false;
        flip.startX = x;
        flip.startY = y;
        flip.lastX = x;
        flip.lastTime = performance.now();
        flip.velocity = 0;

        const rect = bookShell.getBoundingClientRect();
        flip.startYNorm = Math.max(0, Math.min(1, (y - rect.top) / Math.max(1, rect.height)));
      }

      function onSingleMove(x, y) {
        const now = performance.now();
        const dx = x - flip.startX;
        const dy = y - flip.startY;
        const stepDx = x - flip.lastX;
        const dt = Math.max(1, now - flip.lastTime) / 1000;

        if (!hasMoved && Math.hypot(dx, dy) < 6) return;
        hasMoved = true;

        const maxStep = getMaxStep();

        if (!flip.dragging) {
          const dir = dx < 0 ? 1 : -1;
          const targetStep = currentStep + dir;
          if (targetStep < 0 || targetStep > maxStep) {
            return;
          }
          flip.active = true;
          flip.dragging = true;
          flip.direction = dir;
          flip.fromStep = currentStep;
          flip.toStep = targetStep;
          flip.progress = 0;
          flip.tiltAngle = 0;
          bookShell.classList.add("is-flipping");

          if (isSpreadCapable && currentStep === 0 && targetStep === 1) {
            updateLayout(false);
          }
        }

        const cornerBias = (flip.startYNorm - 0.5) * 0.42;
        const dragBias = (dy / Math.max(180, logicalH)) * 0.55;
        const rawTilt = (dragBias - cornerBias) * flip.direction;
        const targetTilt = Math.max(-0.42, Math.min(0.42, rawTilt));
        flip.tiltAngle = flip.tiltAngle * 0.7 + targetTilt * 0.3;

        const dragSpan = Math.max(120, logicalW * 0.90);
        const deltaP = (flip.direction === 1 ? -stepDx : stepDx) / dragSpan;
        flip.progress = Math.max(0.002, Math.min(0.998, flip.progress + deltaP));

        const instantVel = deltaP / dt;
        flip.velocity = flip.velocity * 0.65 + instantVel * 0.35;

        flip.lastX = x;
        flip.lastTime = now;
        scheduleRender();
      }

      function handleTapOrDoubleTap(clientX, clientY) {
        const now = performance.now();
        const isDoubleTap = (now - lastTapTime < 280) && (Math.hypot(clientX - lastTapX, clientY - lastTapY) < 36);
        lastTapTime = now;
        lastTapX = clientX;
        lastTapY = clientY;

        if (isDoubleTap) {
          lastTapTime = 0;
          if (view.scale > 1.05) {
            animateViewTo(1, 0, 0);
          } else {
            const stageRect = readerStage.getBoundingClientRect();
            const targetScale = 2.0;
            const tapOffsetX = clientX - (stageRect.left + stageRect.width / 2);
            const tapOffsetY = clientY - (stageRect.top + stageRect.height / 2);
            const clamped = clampPan(-tapOffsetX * (targetScale - 1), -tapOffsetY * (targetScale - 1), targetScale);
            animateViewTo(targetScale, clamped.tx, clamped.ty);
          }
          return;
        }

        if (view.scale <= 1.02) {
          const rect = bookShell.getBoundingClientRect();
          const ratio = (clientX - rect.left) / rect.width;
          const yNorm = (clientY - rect.top) / rect.height;
          const tapTilt = (0.5 - yNorm) * 0.28;
          if (ratio < 0.28) {
            turnPage(-1, -tapTilt);
          } else if (ratio > 0.72) {
            turnPage(1, tapTilt);
          } else {
            showHud();
          }
        } else {
          showHud();
        }
      }

      function onSingleEnd(endX, endY) {
        pointerDown = false;

        if (!hasMoved && !flip.dragging) {
          handleTapOrDoubleTap(endX, endY);
          return;
        }

        if (flip.dragging) {
          const shouldComplete =
            (flip.progress > 0.38 && flip.velocity > -0.5) ||
            (flip.progress > 0.12 && flip.velocity > 0.65);

          if (shouldComplete) {
            const dest = flip.toStep;
            animateSpringTo(1, Math.max(0.35, flip.velocity * 0.7), () => {
              currentStep = dest;
            });
          } else {
            const orig = flip.fromStep;
            animateSpringTo(0, Math.min(-0.2, flip.velocity * 0.7), () => {
              currentStep = orig;
            });
          }
        }
      }

      window.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") {
          e.preventDefault();
          turnPage(1);
        } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
          e.preventDefault();
          turnPage(-1);
        } else if (e.key === "Home") {
          e.preventDefault();
          if (!flip.active && currentStep !== 0) {
            resetZoom(false);
            currentStep = 0;
            updateLayout(false);
            showHud();
          }
        } else if (e.key === "Escape" && view.scale > 1.02) {
          resetZoom(true);
        }
      });

      btnFirst.addEventListener("click", (e) => {
        e.stopPropagation();
        if (flip.active || currentStep === 0) return;
        resetZoom(false);
        currentStep = 0;
        updateLayout(false);
        showHud();
      });

      btnPrev.addEventListener("click", (e) => {
        e.stopPropagation();
        turnPage(-1);
        showHud();
      });

      btnNext.addEventListener("click", (e) => {
        e.stopPropagation();
        turnPage(1);
        showHud();
      });

      btnResetZoom.addEventListener("click", (e) => {
        e.stopPropagation();
        resetZoom(true);
        showHud();
      });

      if (typeof ResizeObserver !== "undefined") {
        const ro = new ResizeObserver(() => {
          updateLayout(false);
        });
        ro.observe(readerStage);
      } else {
        window.addEventListener("resize", () => updateLayout(false));
      }

      function checkInitialReady() {
        if (!initialShown && readyCount >= Math.min(3, IMAGE_FILES.length)) {
          initialShown = true;
          const stageRect = readerStage.getBoundingClientRect();
          isSpreadCapable = checkSpreadCapable(stageRect.width || window.innerWidth, stageRect.height || window.innerHeight);
          if (bookmarkedPageIndex !== null) {
            currentStep = pageIndexToStep(bookmarkedPageIndex);
          }
          updateLayout(true);
          loader.classList.add("hidden");
          showHud();
          if (bookmarkedPageIndex !== null) {
            const label = bookmarkedPageIndex === 0 ? "封面" : `第 ${bookmarkedPageIndex} 頁`;
            showBookmarkToast(`已自動回到上次書籤位置：${label}`);
          }
        }
      }

      IMAGE_FILES.forEach((src, i) => {
        const img = new Image();
        img.onload = () => {
          readyCount++;
          delete pageCache[i];
          checkInitialReady();
          if (initialShown) scheduleRender();
        };
        img.onerror = () => {
          readyCount++;
          checkInitialReady();
        };
        img.src = src;
        images[i] = img;
      });
    })();
  </script>
</body>
</html>
